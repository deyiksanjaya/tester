<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas {
            display: none;
        }
        #display-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            z-index: 1;
        }
        #result-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            opacity: 0.8;
            max-height: calc(100% - 160px);
            overflow-y: auto;
            width: 100%;
            text-align: left;
            pointer-events: none;
            display: none;
        }
        #peek-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: calc(90% - 140px);
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
        }
        #debug-preview {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 85%;
            max-height: 55%;
            border: 2px solid #333;
            border-radius: 8px;
            display: none;
            z-index: 3;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #stealth-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
            transition: background 0.3s;
        }
        .dot-success {
            background: #22c55e !important;
            opacity: 0.3;
        }
        .dot-error {
            background: #ef4444 !important;
            opacity: 0.4;
        }
        #main-console {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #38bdf8;
            z-index: 4;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }
        .console-line {
            margin-bottom: 4px;
            line-height: 1.4;
            word-break: break-all;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #222;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #eee;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #555;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="peek-img" src="" alt="">
    <img id="debug-preview" src="" alt="">

    <div id="stealth-dot"></div>

    <div id="display-area">
        <div id="result-text"></div>
    </div>

    <div id="main-console"></div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">Konfigurasi</div>
            <div class="input-group">
                <span class="input-label">Kredensial API</span>
                <input type="text" id="api-key-input" placeholder="Google Cloud Vision Key" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Modul Kamera</span>
                <select id="camera-select">
                    <option value="environment">Kamera Utama</option>
                    <option value="user">Kamera Depan</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Metode Operasi</span>
                <select id="mode-select">
                    <option value="ocr">Cloud OCR</option>
                    <option value="peek">Peek Picture</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Interval Snapshot</span>
                <select id="interval-select">
                    <option value="500">0.5 Detik</option>
                    <option value="1000">1 Detik</option>
                    <option value="2000">2 Detik</option>
                    <option value="3000">3 Detik</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Tutup</button>
                <button class="btn-primary" id="save-btn">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultText = document.getElementById('result-text');
        const peekImg = document.getElementById('peek-img');
        const debugPreview = document.getElementById('debug-preview');
        const stealthDot = document.getElementById('stealth-dot');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const cameraSelect = document.getElementById('camera-select');
        const modeSelect = document.getElementById('mode-select');
        const intervalSelect = document.getElementById('interval-select');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');
        const mainConsole = document.getElementById('main-console');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentFacingMode = localStorage.getItem('stealthScannerCamera') || 'environment';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let currentInterval = parseInt(localStorage.getItem('stealthScannerInterval')) || 1000;
        
        let scanIntervalId = null;
        let isProcessing = false;
        let peekImageSrc = '';
        let extractedText = '';
        
        let lastTapTime = 0;
        let tapCount = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        document.addEventListener('contextmenu', e => e.preventDefault());

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#38bdf8';
            if (type === 'error') color = '#f87171';
            if (type === 'success') color = '#4ade80';
            mainConsole.innerHTML += `<div class="console-line" style="color: ${color};">[${time}] ${msg}</div>`;
            mainConsole.scrollTop = mainConsole.scrollHeight;
        }

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            
            isHolding = false;
            holdTimeout = setTimeout(() => {
                isHolding = true;
                if (debugPreview.style.display === 'block') {
                    debugPreview.style.visibility = 'hidden';
                }
                if (currentMode === 'peek' && peekImageSrc) {
                    peekImg.src = peekImageSrc;
                    peekImg.style.display = 'block';
                    log('Menampilkan gambar hasil crop.');
                } else if (currentMode === 'ocr' && extractedText) {
                    resultText.innerText = extractedText;
                    resultText.style.display = 'block';
                    log('Menampilkan hasil teks.');
                }
            }, 400);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                peekImg.style.display = 'none';
                peekImg.src = '';
                resultText.style.display = 'none';
                debugPreview.style.visibility = 'visible';
                log('Tampilan disembunyikan kembali.');
                e.preventDefault();
                e.stopPropagation();
                return;
            }

            if (e.type === 'pointerup') {
                if (e.target.closest('#debug-preview')) {
                    debugPreview.style.display = 'none';
                    log('Pratinjau gambar ditutup.');
                    return;
                }

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < 400 && tapLength > 0) {
                    tapCount++;
                } else {
                    tapCount = 1;
                }
                lastTapTime = currentTime;

                clearTimeout(tapTimeout);
                tapTimeout = setTimeout(() => {
                    if (tapCount === 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        cameraSelect.value = currentFacingMode;
                        modeSelect.value = currentMode;
                        intervalSelect.value = currentInterval.toString();
                        log('Menu konfigurasi dibuka.');
                    } else if (tapCount === 2) {
                        if (scanIntervalId || video.srcObject) {
                            log('Mematikan kamera...');
                            stopCamera();
                        } else {
                            log('Menghubungkan kamera...');
                            startSystem();
                        }
                    }
                    tapCount = 0;
                }, 400);
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentFacingMode = cameraSelect.value;
            currentMode = modeSelect.value;
            currentInterval = parseInt(intervalSelect.value);

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerCamera', currentFacingMode);
            localStorage.setItem('stealthScannerMode', currentMode);
            localStorage.setItem('stealthScannerInterval', currentInterval);

            settingsModal.style.display = 'none';
            
            resultText.innerText = '';
            extractedText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            debugPreview.style.display = 'none';
            debugPreview.src = '';
            stealthDot.className = '';
            
            isProcessing = false;
            log(`Konfigurasi disimpan. Mode: ${currentMode}, Interval: ${currentInterval}ms`);
            stopCamera();
        });

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            log('Kamera nonaktif.');
        }

        async function startSystem() {
            if (scanIntervalId) return;
            isProcessing = false;
            stealthDot.className = '';
            debugPreview.style.display = 'none';
            debugPreview.src = '';
            
            try {
                log(`Mengaktifkan kamera video (${currentFacingMode})...`);
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;
                
                scanIntervalId = setInterval(processSnapshot, currentInterval);
                log('Sistem aktif murni via Cloud Vision API.');
            } catch (err) {
                log('Gagal mengakses kamera: ' + err.message, 'error');
                stealthDot.className = 'dot-error';
            }
        }

        async function processSnapshot() {
            if (!video.videoWidth || isProcessing) return;
            isProcessing = true;

            const targetWidth = 800;
            const scale = targetWidth / video.videoWidth;
            canvas.width = targetWidth;
            canvas.height = video.videoHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64Url = canvas.toDataURL('image/jpeg', 0.85);
            const base64Image = base64Url.split(',')[1];

            await sendToCloudVision(base64Image, canvas, base64Url);
        }

        async function sendToCloudVision(base64String, sourceCanvas, base64Url) {
            if (!visionApiKey) {
                log('Kunci API tidak ditemukan.', 'error');
                stealthDot.className = 'dot-error';
                isProcessing = false;
                return;
            }

            log('Menganalisis frame via Google Cloud...');
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.error) {
                    log(`Google API Error: ${data.error.message}`, 'error');
                    isProcessing = false;
                    return;
                }

                if (data.responses && data.responses[0] && data.responses[0].fullTextAnnotation) {
                    const responseObj = data.responses[0];
                    const textResult = responseObj.fullTextAnnotation.text;
                    const cleanText = textResult.replace(/[^a-zA-Z0-9 ]/g, '').trim();
                    
                    if (cleanText.length < 2) {
                        log('Teks terlalu pendek, dilompati.');
                        isProcessing = false;
                        return;
                    }

                    stopCamera();
                    log('Respons Cloud OCR diterima.', 'success');
                    
                    if (currentMode === 'ocr') {
                        extractedText = textResult;
                        stealthDot.className = 'dot-success';
                        debugPreview.src = base64Url;
                        debugPreview.style.display = 'block';
                        log('Teks berhasil disimpan. Siap di-peeking.', 'success');
                    } else if (currentMode === 'peek') {
                        const annotations = responseObj.textAnnotations;
                        if (annotations && annotations.length > 0) {
                            const vertices = annotations[0].boundingPoly.vertices;
                            let minX = sourceCanvas.width, minY = sourceCanvas.height, maxX = 0, maxY = 0;
                            
                            vertices.forEach(v => {
                                const x = v.x || 0;
                                const y = v.y || 0;
                                if (x < minX) minX = x;
                                if (y < minY) minY = y;
                                if (x > maxX) maxX = x;
                                if (y > maxY) maxY = y;
                            });

                            const pad = 20;
                            minX = Math.max(0, minX - pad);
                            minY = Math.max(0, minY - pad);
                            maxX = Math.min(sourceCanvas.width, maxX + pad);
                            maxY = Math.min(sourceCanvas.height, maxY + pad);

                            const w = maxX - minX;
                            const h = maxY - minY;

                            if (w > 0 && h > 0) {
                                const cropCanvas = document.createElement('canvas');
                                cropCanvas.width = w;
                                cropCanvas.height = h;
                                const cropCtx = cropCanvas.getContext('2d');
                                cropCtx.drawImage(sourceCanvas, minX, minY, w, h, 0, 0, w, h);
                                
                                peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.95);
                                debugPreview.src = peekImageSrc;
                                debugPreview.style.display = 'block';
                                stealthDot.className = 'dot-success';
                                log('Pemotongan gambar tulisan selesai. Siap di-peeking.', 'success');
                            }
                        }
                    }
                } else {
                    log('Tidak ada teks jelas di frame ini.');
                    isProcessing = false;
                }
            } catch (err) {
                stealthDot.className = 'dot-error';
                log('Koneksi Cloud OCR gagal: ' + err.message, 'error');
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
