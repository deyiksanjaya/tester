<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  
  <!-- ==================== PWA META TAGS & ICONS ==================== -->
  <title>Google</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Favicon & App Icon yang baru (High Res) -->
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/3840px-Google_%22G%22_logo.svg.png" />
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/3840px-Google_%22G%22_logo.svg.png" />
  
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Google" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body class="h-[100dvh] flex flex-col text-[#202124] overflow-hidden bg-white w-full">
  
  <!-- ==================== HALAMAN UTAMA ==================== -->
  
  <!-- Header -->
  <header class="flex justify-between items-center px-4 pt-4 pb-0 text-sm w-full flex-shrink-0">
    <div class="flex items-center">
      <button class="p-1 mr-1 text-[#5f6368] hover:bg-gray-100 rounded-full transition-colors flex items-center">
        <span class="material-symbols-outlined text-[22px]">science</span>
      </button>
      <div class="flex space-x-4 mt-[6px]">
        <a href="#" class="text-[#1a73e8] font-semibold text-[13px] border-b-[3px] border-[#1a73e8] pb-2">ALL</a>
        <a href="#" class="text-[#5f6368] font-semibold text-[13px] pb-2">IMAGES</a>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button class="text-[#5f6368] hover:bg-gray-100 p-1.5 rounded-full transition-colors flex items-center">
        <span class="material-symbols-outlined text-[22px]">notifications</span>
      </button>
      <button class="text-[#5f6368] hover:bg-gray-100 p-1.5 rounded-full transition-colors flex items-center">
        <span class="material-symbols-outlined text-[22px]">apps</span>
      </button>
      <a href="#" class="bg-[#1a73e8] hover:bg-[#1b66c9] text-white text-[13px] font-medium px-5 py-2 rounded transition-colors ml-1">
        Sign in
      </a>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="flex-grow flex flex-col justify-center items-center px-4 w-full pb-[10vh]">
    <img 
      class="w-[180px] sm:w-[272px] object-contain mb-8" 
      src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" 
      alt="Google" 
    />

    <!-- Pencetus Kotak Pencarian -->
    <div id="main-search-trigger" class="flex items-center w-full max-w-[600px] border border-[#dfe1e5] shadow-sm rounded-full px-4 py-2.5 bg-white cursor-text">
      <span class="mr-3 text-[#9aa0a6] flex items-center">
        <span class="material-symbols-outlined text-[22px]">search</span>
      </span>
      <input type="text" id="main-display-input" class="flex-grow focus:outline-none text-base bg-transparent min-w-0 pointer-events-none" placeholder="" />
      <div class="flex items-center space-x-1 sm:space-x-2 ml-2 text-[#5f6368]">
        <span class="p-1.5 flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]">auto_awesome</span>
        </span>
        <span class="p-1.5 flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]">mic</span>
        </span>
        <span class="p-1.5 flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]">center_focus_strong</span>
        </span>
      </div>
    </div>

    <div class="mt-6 text-[13px] text-[#4d5156]">
      Google offered in: <a href="#" class="text-[#1a0dab] hover:underline ml-1">Bahasa Indonesia</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#f2f2f2] text-[#70757a] text-[14px] flex-shrink-0 w-full">
    <div class="px-5 py-4 border-b border-[#dadce0]">Indonesia</div>
    <div class="flex flex-col items-center py-4 space-y-4">
      <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 px-4 w-full max-w-[600px]">
        <a href="#" class="hover:underline">Dark theme: off</a>
        <a href="#" class="hover:underline">Settings</a>
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Terms</a>
      </div>
      <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 px-4 w-full max-w-[600px]">
        <a href="#" class="hover:underline">Advertising</a>
        <a href="#" class="hover:underline">Business</a>
        <a href="#" class="hover:underline">About</a>
      </div>
    </div>
  </footer>

  <!-- ==================== OVERLAY PENCARIAN ==================== -->
  <div id="search-overlay" class="fixed inset-0 bg-white z-50 hidden flex-col">
    <div class="flex items-center px-2 py-2 border-b border-[#dfe1e5] shadow-sm">
      <button id="back-btn" type="button" class="p-2 text-[#1a73e8] flex items-center justify-center rounded-full hover:bg-gray-100">
        <span class="material-symbols-outlined text-[24px]">arrow_back</span>
      </button>
      
      <form id="search-form" action="https://www.google.com/search" method="GET" class="flex-grow mx-2 flex items-center">
        <input id="active-search-input" name="q" type="text" class="w-full text-[16px] text-[#202124] focus:outline-none bg-transparent" autocomplete="off" />
      </form>
      
      <div id="empty-icons" class="flex items-center text-[#5f6368]">
        <button class="p-2 flex items-center justify-center rounded-full hover:bg-gray-100">
          <span class="material-symbols-outlined text-[24px]">mic</span>
        </button>
        <button class="p-2 flex items-center justify-center rounded-full hover:bg-gray-100 mr-1">
          <span class="material-symbols-outlined text-[24px]">center_focus_strong</span>
        </button>
      </div>
      
      <div id="typing-icons" class="hidden flex items-center text-[#5f6368]">
        <button id="clear-btn" type="button" class="p-2 flex items-center justify-center rounded-full hover:bg-gray-100 mr-1">
          <span class="material-symbols-outlined text-[24px]">close</span>
        </button>
      </div>
    </div>

    <!-- Daftar Saran & Riwayat -->
    <div id="suggestions-list" class="flex-grow overflow-y-auto bg-white pt-2"></div>
  </div>

  <!-- ==================== LOGIK JAVASCRIPT & FIREBASE ==================== -->
  <script type="module">
    // Import Firebase SDK dari CDN resmi Google
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // Konfigurasi Firebase dari pengguna
    const firebaseConfig = {
      apiKey: "AIzaSyBsdaCltUZPkg0kl7-BIY-xfbkTnypyfxM",
      authDomain: "qrpredictionwix.firebaseapp.com",
      databaseURL: "https://qrpredictionwix-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qrpredictionwix",
      storageBucket: "qrpredictionwix.firebasestorage.app",
      messagingSenderId: "1045444279571",
      appId: "1:1045444279571:web:02a98dec1d28c743d9aee6"
    };

    // Inisialisasi Firebase & Realtime Database
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Fungsi untuk memperbarui data ke 'predictions/input' di Firebase
    function updateFirebaseInput(text) {
      set(ref(db, 'predictions/input'), text)
        .catch((error) => console.error("Firebase update failed:", error));
    }

    // DOM Elements
    const mainSearchTrigger = document.getElementById('main-search-trigger');
    const mainDisplayInput = document.getElementById('main-display-input');
    const searchOverlay = document.getElementById('search-overlay');
    const searchForm = document.getElementById('search-form');
    const activeInput = document.getElementById('active-search-input');
    const backBtn = document.getElementById('back-btn');
    const clearBtn = document.getElementById('clear-btn');
    const emptyIcons = document.getElementById('empty-icons');
    const typingIcons = document.getElementById('typing-icons');
    const suggestionsList = document.getElementById('suggestions-list');

    // Pengelolaan Riwayat (Local Storage)
    const STORAGE_KEY = 'google_clone_history';
    let searchHistory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      'google search api', 'apa itu html', 'cara buat website'
    ];

    function saveToHistory(query) {
      if (!query.trim()) return;
      searchHistory = searchHistory.filter(item => item !== query); 
      searchHistory.unshift(query); 
      if (searchHistory.length > 15) searchHistory.pop(); 
      localStorage.setItem(STORAGE_KEY, JSON.stringify(searchHistory));
    }

    function removeFromHistory(query) {
      searchHistory = searchHistory.filter(item => item !== query);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(searchHistory));
      renderHistory(); 
    }

    function executeSearch(query) {
      saveToHistory(query);
      updateFirebaseInput(query); // Kirim kata kunci final sebelum redirect
      window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    }

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (activeInput.value.trim() !== '') {
        executeSearch(activeInput.value);
      }
    });

    // Menarik data dari Google Autocomplete API
    function fetchGoogleSuggestions(query) {
      if (!query.trim()) {
        renderHistory();
        return;
      }
      
      const script = document.createElement('script');
      const callbackName = 'googleSuggestCb_' + Date.now();
      
      window[callbackName] = function(data) {
        const suggestions = data[1] || [];
        const items = suggestions.map(text => ({ text: text, type: 'search' }));
        renderListHTML(items, query);
        
        delete window[callbackName];
        script.remove();
      };
      
      script.src = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(query)}&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    function renderHistory() {
      const items = searchHistory.map(text => ({ text, type: 'history' }));
      renderListHTML(items, '');
    }

    function renderListHTML(items, currentQuery) {
      suggestionsList.innerHTML = '';

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'flex items-center px-4 py-[14px] active:bg-gray-100 cursor-pointer';

        const leftIcon = item.type === 'history' ? 'schedule' : 'search';
        
        let formattedText = item.text;
        if (currentQuery && item.text.toLowerCase().startsWith(currentQuery.toLowerCase()) && item.type === 'search') {
          const matchedPart = item.text.substring(0, currentQuery.length);
          const suggestedPart = item.text.substring(currentQuery.length);
          formattedText = `<span>${matchedPart}</span><span class="font-bold">${suggestedPart}</span>`;
        } else if (item.type === 'search') {
          formattedText = `<span class="font-bold">${item.text}</span>`;
        }

        const rightIcon = item.type === 'history' ? 'close' : 'north_west';

        div.innerHTML = `
          <span class="material-symbols-outlined text-[#9aa0a6] text-[22px] mr-4">${leftIcon}</span>
          <span class="flex-grow text-[16px] text-[#202124] pr-4 line-clamp-2">${formattedText}</span>
          <span class="material-symbols-outlined text-[#9aa0a6] text-[22px] ml-2 cursor-pointer hover:text-gray-700 right-action-btn">
            ${rightIcon}
          </span>
        `;
        
        div.querySelector('.flex-grow').addEventListener('click', () => {
          executeSearch(item.text);
        });

        div.querySelector('.right-action-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          if (item.type === 'history') {
            removeFromHistory(item.text); 
          } else {
            activeInput.value = item.text + ' '; 
            activeInput.focus();
            fetchGoogleSuggestions(activeInput.value);
            toggleIcons(activeInput.value);
            updateFirebaseInput(activeInput.value); // Kirim teks ke firebase saat panah ditekan
          }
        });

        suggestionsList.appendChild(div);
      });
    }

    function toggleIcons(query) {
      if (query.length > 0) {
        emptyIcons.classList.add('hidden');
        typingIcons.classList.remove('hidden');
      } else {
        emptyIcons.classList.remove('hidden');
        typingIcons.classList.add('hidden');
      }
    }

    function openOverlay() {
      searchOverlay.classList.remove('hidden');
      searchOverlay.classList.add('flex');
      activeInput.value = mainDisplayInput.value;
      activeInput.focus();
      toggleIcons(activeInput.value);
      
      if (activeInput.value) {
        fetchGoogleSuggestions(activeInput.value);
      } else {
        renderHistory();
      }
    }

    function closeOverlay() {
      searchOverlay.classList.add('hidden');
      searchOverlay.classList.remove('flex');
    }

    // Event Listeners
    mainSearchTrigger.addEventListener('click', openOverlay);
    backBtn.addEventListener('click', closeOverlay);

    // Hapus input dan reset database firebase
    clearBtn.addEventListener('click', () => {
      activeInput.value = '';
      activeInput.focus();
      toggleIcons('');
      renderHistory();
      updateFirebaseInput(''); // Hapus di firebase juga
    });

    // Mengetik di kotak pencarian
    let timeoutId;
    activeInput.addEventListener('input', (e) => {
      const query = e.target.value;
      
      // Update Firebase secara real-time saat ngetik
      updateFirebaseInput(query);
      
      toggleIcons(query);
      
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        fetchGoogleSuggestions(query);
      }, 200); 
    });

  </script>
</body>
</html>
