<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas, #motion-canvas {
            display: none;
        }
        #display-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            z-index: 1;
        }
        #result-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            opacity: 0.8;
            max-height: calc(100% - 160px);
            overflow-y: auto;
            width: 100%;
            text-align: left;
            pointer-events: none;
            display: none;
        }
        #peek-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: calc(90% - 140px);
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
        }
        #stealth-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
            transition: background 0.3s;
        }
        .dot-success {
            background: #4ade80 !important;
        }
        .dot-error {
            background: #f87171 !important;
        }
        #main-console {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #38bdf8;
            z-index: 4;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }
        .console-line {
            margin-bottom: 4px;
            line-height: 1.4;
            word-break: break-all;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 24px;
            border-radius: 8px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #333;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #eee;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #fff;
        }
        #slider-value {
            font-size: 14px;
            color: #fff;
            min-width: 30px;
            text-align: right;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #666;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <canvas id="motion-canvas"></canvas>
    <img id="peek-img" src="" alt="">

    <div id="stealth-dot"></div>

    <div id="display-area">
        <div id="result-text"></div>
    </div>

    <div id="main-console"></div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">Konfigurasi Sistem</div>
            <div class="input-group">
                <span class="input-label">Kredensial API</span>
                <input type="text" id="api-key-input" placeholder="Google Cloud Vision" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Modul Kamera</span>
                <select id="camera-select">
                    <option value="environment">Kamera Utama</option>
                    <option value="user">Kamera Depan</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Metode Operasi</span>
                <select id="mode-select">
                    <option value="ocr">Cloud OCR</option>
                    <option value="peek">Peek Picture</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Sensitivitas Deteksi Gerak</span>
                <div class="slider-container">
                    <input type="range" id="sensitivity-slider" min="10" max="90" step="5">
                    <span id="slider-value">60%</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Tutup</button>
                <button class="btn-primary" id="save-btn">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const motionCanvas = document.getElementById('motion-canvas');
        const resultText = document.getElementById('result-text');
        const peekImg = document.getElementById('peek-img');
        const stealthDot = document.getElementById('stealth-dot');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const cameraSelect = document.getElementById('camera-select');
        const modeSelect = document.getElementById('mode-select');
        const sensitivitySlider = document.getElementById('sensitivity-slider');
        const sliderValue = document.getElementById('slider-value');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');
        const mainConsole = document.getElementById('main-console');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentFacingMode = localStorage.getItem('stealthScannerCamera') || 'environment';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let currentSensitivity = parseInt(localStorage.getItem('stealthScannerSensitivity')) || 60;
        
        let scanIntervalId = null;
        let isProcessing = false;
        let peekImageSrc = '';
        let extractedText = '';
        
        let tapCount = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        let prevFrameData = null;
        let motionDetected = false;
        let stableFramesCount = 0;
        const requiredStableFrames = 5;

        sensitivitySlider.value = currentSensitivity;
        sliderValue.innerText = currentSensitivity + '%';

        document.addEventListener('contextmenu', e => e.preventDefault());

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#38bdf8';
            if (type === 'error') color = '#f87171';
            if (type === 'success') color = '#4ade80';
            mainConsole.innerHTML += `<div class="console-line" style="color: ${color};">[${time}] ${msg}</div>`;
            mainConsole.scrollTop = mainConsole.scrollHeight;
        }

        sensitivitySlider.addEventListener('input', (e) => {
            sliderValue.innerText = e.target.value + '%';
        });

        log('Sistem siap. Ketuk 2x untuk mulai, ketuk 3x untuk konfigurasi.');

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            
            holdTimeout = setTimeout(() => {
                isHolding = true;
                if (currentMode === 'peek' && peekImageSrc) {
                    peekImg.src = peekImageSrc;
                    peekImg.style.display = 'block';
                    log('Menampilkan gambar hasil crop.');
                } else if (currentMode === 'ocr' && extractedText) {
                    resultText.innerText = extractedText;
                    resultText.style.display = 'block';
                    log('Menampilkan teks hasil Cloud OCR.');
                }
            }, 200);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                peekImg.style.display = 'none';
                peekImg.src = '';
                resultText.style.display = 'none';
                log('Tampilan disembunyikan kembali.');
                e.preventDefault();
            } else {
                if (e.type === 'pointerup') {
                    tapCount++;
                    clearTimeout(tapTimeout);
                    
                    if (tapCount === 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        cameraSelect.value = currentFacingMode;
                        modeSelect.value = currentMode;
                        sensitivitySlider.value = currentSensitivity;
                        sliderValue.innerText = currentSensitivity + '%';
                        tapCount = 0;
                        log('Menu konfigurasi dibuka.');
                    } else {
                        tapTimeout = setTimeout(() => {
                            if (tapCount === 2) {
                                if (scanIntervalId || video.srcObject) {
                                    log('Mematikan kamera...');
                                    stopCamera();
                                } else {
                                    log('Menghubungkan kamera...');
                                    startSystem();
                                }
                            }
                            tapCount = 0;
                        }, 250);
                    }
                }
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentFacingMode = cameraSelect.value;
            currentMode = modeSelect.value;
            currentSensitivity = parseInt(sensitivitySlider.value);

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerCamera', currentFacingMode);
            localStorage.setItem('stealthScannerMode', currentMode);
            localStorage.setItem('stealthScannerSensitivity', currentSensitivity);

            settingsModal.style.display = 'none';
            
            resultText.innerText = '';
            extractedText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            stealthDot.className = '';
            
            log(`Konfigurasi disimpan. Mode: ${currentMode}, Kamera: ${currentFacingMode}, Sensitivitas: ${currentSensitivity}%`);
            stopCamera();
        });

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            isProcessing = false;
            prevFrameData = null;
            motionDetected = false;
            stableFramesCount = 0;
            log('Kamera nonaktif.');
        }

        async function startSystem() {
            if (scanIntervalId) return;
            stealthDot.className = '';
            prevFrameData = null;
            motionDetected = false;
            stableFramesCount = 0;
            
            try {
                log(`Mengaktifkan kamera (${currentFacingMode})...`);
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;
                
                scanIntervalId = setInterval(analyzeMotion, 200);
                log('Sistem analisis gerakan aktif.');
            } catch (err) {
                log('Gagal mengakses kamera: ' + err.message, 'error');
                if (currentMode === 'ocr') {
                    stealthDot.className = 'dot-error';
                }
            }
        }

        function analyzeMotion() {
            if (!video.videoWidth || isProcessing) return;

            const mWidth = 40;
            const mHeight = 30;
            motionCanvas.width = mWidth;
            motionCanvas.height = mHeight;

            const mCtx = motionCanvas.getContext('2d');
            mCtx.drawImage(video, 0, 0, mWidth, mHeight);

            const frameData = mCtx.getImageData(0, 0, mWidth, mHeight);
            
            if (!prevFrameData) {
                prevFrameData = frameData;
                return;
            }

            let diffSum = 0;
            const len = frameData.data.length;

            for (let i = 0; i < len; i += 4) {
                const rDiff = Math.abs(frameData.data[i] - prevFrameData.data[i]);
                const gDiff = Math.abs(frameData.data[i+1] - prevFrameData.data[i+1]);
                const bDiff = Math.abs(frameData.data[i+2] - prevFrameData.data[i+2]);
                diffSum += (rDiff + gDiff + bDiff);
            }

            const diffNormalized = diffSum / (mWidth * mHeight * 3 * 255);
            prevFrameData = frameData;

            const motionThreshold = (100 - currentSensitivity) / 500;
            const stabilityThreshold = motionThreshold * 0.4;

            if (diffNormalized > motionThreshold) {
                if (!motionDetected) {
                    motionDetected = true;
                    log('Lapis 1: Perubahan objek terdeteksi.');
                }
                stableFramesCount = 0;
            } else if (motionDetected && diffNormalized < stabilityThreshold) {
                stableFramesCount++;
                if (stableFramesCount >= requiredStableFrames) {
                    log('Lapis 2: Posisi objek stabil. Mengambil snapshot tunggal.');
                    executeCoreCapture();
                }
            }
        }

        async function executeCoreCapture() {
            isProcessing = true;
            stopCamera();

            const scale = 480 / video.videoWidth;
            canvas.width = 480;
            canvas.height = video.videoHeight * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (currentMode === 'ocr') {
                const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                await sendToCloudVision(base64Image);
            } else if (currentMode === 'peek') {
                log('Memotong gambar berdasarkan analisis kontras lokal...');
                
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                let found = false;

                for (let y = 4; y < canvas.height - 4; y += 4) {
                    for (let x = 4; x < canvas.width - 4; x += 4) {
                        const idx = (y * canvas.width + x) * 4;
                        const r = data[idx];
                        const g = data[idx+1];
                        const b = data[idx+2];
                        const gray = 0.299 * r + 0.587 * g + 0.114 * b;

                        const rightIdx = (y * canvas.width + (x + 4)) * 4;
                        const rightGray = 0.299 * data[rightIdx] + 0.587 * data[rightIdx+1] + 0.114 * data[rightIdx+2];

                        const bottomIdx = ((y + 4) * canvas.width + x) * 4;
                        const bottomGray = 0.299 * data[bottomIdx] + 0.587 * data[bottomIdx+1] + 0.114 * data[bottomIdx+2];

                        const contrast = Math.abs(gray - rightGray) + Math.abs(gray - bottomGray);

                        if (contrast > 40) {
                            found = true;
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (found) {
                    const pad = 20;
                    minX = Math.max(0, minX - pad);
                    minY = Math.max(0, minY - pad);
                    maxX = Math.min(canvas.width, maxX + pad);
                    maxY = Math.min(canvas.height, maxY + pad);

                    const w = maxX - minX;
                    const h = maxY - minY;

                    if (w > 10 && h > 10) {
                        const cropCanvas = document.createElement('canvas');
                        cropCanvas.width = w;
                        cropCanvas.height = h;
                        const cropCtx = cropCanvas.getContext('2d');
                        cropCtx.drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
                        peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.9);
                        log('Pemotongan gambar tulisan selesai. Siap di-peeking.', 'success');
                    } else {
                        log('Area kontras terdeteksi terlalu kecil.');
                    }
                } else {
                    log('Tidak menemukan tulisan/kontur yang jelas.');
                }
                isProcessing = false;
            }
        }

        async function sendToCloudVision(base64String) {
            if (!visionApiKey) {
                log('Kunci API tidak ditemukan.', 'error');
                stealthDot.className = 'dot-error';
                isProcessing = false;
                return;
            }

            log('Menghubungi Cloud Vision API...');
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0].fullTextAnnotation) {
                    extractedText = data.responses[0].fullTextAnnotation.text;
                    stealthDot.className = 'dot-success';
                    log('Ekstraksi Cloud OCR berhasil.', 'success');
                } else {
                    stealthDot.className = 'dot-error';
                    log('Cloud OCR gagal mengenali teks.', 'error');
                }
            } catch (err) {
                stealthDot.className = 'dot-error';
                log('Koneksi Cloud OCR gagal: ' + err.message, 'error');
            }
            isProcessing = false;
        }
    </script>
</body>
</html>
