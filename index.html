<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    
    <!-- Trik Fullscreen & PWA Meta Tags ala iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F2F2F7"> 
    
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Font bawaan Apple (San Francisco) */
        html, body {
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            margin: 0; padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #F2F2F7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Area aman untuk notch/poni iPhone */
        .safe-padding-top { padding-top: max(1rem, env(safe-area-inset-top)); }
        .safe-padding-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

        /* Sembunyiin scrollbar */
        ::-webkit-scrollbar { display: none; }

        /* Animasi masuk */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-black w-screen h-screen flex flex-col select-none overflow-hidden">

    <!-- SCREEN 1: Dashboard / Gallery List -->
    <div id="dashboard-screen" class="flex-1 flex flex-col w-full h-full overflow-y-auto relative pb-28">
        
        <!-- Header -->
        <div class="px-6 pb-2 safe-padding-top bg-[#F2F2F7] sticky top-0 z-20 border-b border-gray-200/50 flex justify-between items-end">
            <h1 class="text-[34px] font-bold tracking-tight mt-4">Gallery</h1>
            <button onclick="openGlobalSettings()" class="w-10 h-10 mb-1 rounded-full bg-white shadow-sm flex items-center justify-center active:bg-gray-100 transition-colors border border-gray-200 text-[#007AFF]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-[22px] w-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>

        <div id="image-list" class="flex flex-col gap-6 w-full max-w-md mx-auto px-4 mt-5"></div>

        <div class="flex flex-col items-center justify-center cursor-pointer mt-6 mb-10 w-full max-w-md mx-auto px-4" onclick="document.getElementById('file-input').click()">
            <div class="w-full py-8 bg-white rounded-2xl flex flex-col items-center justify-center active:bg-gray-100 transition-colors shadow-sm border border-gray-100">
                <svg class="w-10 h-10 text-[#007AFF] mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4" /></svg>
                <p class="text-[17px] text-[#007AFF] font-medium">Add More Image</p>
            </div>
        </div>
        <input type="file" id="file-input" accept="image/*" class="hidden">
    </div>

    <!-- Toolbar Bawah -->
    <div class="fixed bottom-0 left-0 w-full bg-[#F9F9F9]/90 backdrop-blur-xl border-t border-gray-300/60 z-30 safe-padding-bottom">
        <div class="w-full max-w-md mx-auto px-4 py-3 flex gap-3">
            <button onclick="startPerform()" class="flex-1 bg-black text-white rounded-xl py-3.5 text-[17px] font-semibold active:bg-gray-800 transition-colors flex items-center justify-center gap-2 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
                Perform
            </button>
            <button onclick="openAIModal()" class="flex-1 bg-[#007AFF] text-white rounded-xl py-3.5 text-[17px] font-semibold active:bg-[#005bb5] transition-colors flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                Add AI
            </button>
        </div>
    </div>

    <!-- SCREEN 2: Fullscreen Image View -->
    <div id="image-screen" class="fixed inset-0 hidden bg-black z-40">
        <img id="display-image-1" class="absolute inset-0 w-full h-full object-cover pointer-events-none opacity-100" alt="Image View 1">
        <img id="display-image-2" class="absolute inset-0 w-full h-full object-cover pointer-events-none opacity-0" alt="Image View 2">
        <div id="touch-area" class="absolute inset-0 z-10 touch-none"></div>
        <div id="image-overlay-top" class="absolute top-0 left-0 w-full px-4 pb-3 flex justify-between items-end bg-gradient-to-b from-black/60 to-transparent transition-opacity duration-300 safe-padding-top h-[100px] z-20 pointer-events-none">
            <button onclick="closeFullscreen()" class="text-[#007AFF] flex items-center gap-1 text-[17px] active:opacity-50 pointer-events-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
                Gallery
            </button>
            <div class="flex gap-4 pointer-events-auto">
                <button id="btn-hapus" class="text-white active:opacity-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: GLOBAL SETTINGS -->
    <div id="global-settings-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-[#F2F2F7] rounded-[20px] w-full max-w-[340px] flex flex-col text-left overflow-hidden transform scale-95 transition-transform duration-300" id="global-settings-box">
            <div class="p-5 pb-4">
                <h3 class="text-[17px] font-semibold text-black mb-1 text-center">Global Settings</h3>
                <p class="text-[13px] text-gray-500 mb-5 text-center">Atur kunci API dan Model AI Studio.</p>
                
                <div class="mb-4">
                    <label class="text-[13px] text-gray-500 font-medium mb-1.5 block uppercase tracking-wide px-1">API Key</label>
                    <input type="password" id="global-api-key" class="w-full bg-white rounded-xl px-4 py-3 text-[15px] outline-none focus:ring-2 focus:ring-[#007AFF] transition-all shadow-sm border border-gray-200" placeholder="Masukkan Google API Key...">
                </div>

                <div class="mb-2">
                    <label class="text-[13px] text-gray-500 font-medium mb-1.5 block uppercase tracking-wide px-1">Model AI</label>
                    <input type="text" id="global-model-name" class="w-full bg-white rounded-xl px-4 py-3 text-[15px] outline-none focus:ring-2 focus:ring-[#007AFF] transition-all shadow-sm border border-gray-200" placeholder="gemini-3.1-flash-image-preview">
                    <p class="text-[11px] text-gray-400 mt-2 px-1 leading-snug">Default diatur ke gemini-3.1-flash-image-preview.</p>
                </div>
            </div>
            
            <div class="flex border-t border-gray-300/80 bg-white">
                <button onclick="closeGlobalSettings()" class="flex-1 py-3.5 text-[17px] text-[#007AFF] active:bg-gray-100 transition-colors border-r border-gray-200">Batal</button>
                <button onclick="saveGlobalSettings()" class="flex-1 py-3.5 text-[17px] font-semibold text-[#007AFF] active:bg-gray-100 transition-colors">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Generate AI Image -->
    <div id="ai-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[20px] w-full max-w-[340px] flex flex-col text-left overflow-hidden transform scale-95 transition-transform duration-300" id="ai-modal-box">
            <div class="p-5 pb-4">
                <h3 class="text-[17px] font-semibold text-black mb-1 text-center">AI Generator</h3>
                <p class="text-[13px] text-gray-500 mb-4 text-center">Deskripsikan gambar yang ingin dibuat.</p>
                <textarea id="ai-prompt" class="w-full bg-[#F2F2F7] rounded-xl p-3 outline-none text-[15px] resize-none text-black placeholder-gray-400 border border-transparent focus:border-[#007AFF] transition-colors" rows="3" placeholder="Cth: Buat suasana menjadi malam hari cyberpunk..."></textarea>
                
                <div class="mt-4" id="ai-ref-section">
                    <p class="text-[12px] text-gray-400 font-semibold mb-2 uppercase tracking-wide">Gambar Referensi (Opsional)</p>
                    <div id="ref-image-container" class="hidden relative w-16 h-16 mb-3">
                        <img id="ref-image-preview" class="w-full h-full object-cover rounded-[8px] border border-gray-200">
                        <button onclick="clearRefImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow active:scale-90">✕</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('ref-file-input').click()" class="bg-gray-100 text-[#007AFF] px-3 py-1.5 rounded-full text-[13px] font-medium active:bg-gray-200 flex items-center gap-1.5 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                            Upload Ref
                        </button>
                        <button onclick="showGalleryRefPicker()" class="bg-gray-100 text-[#007AFF] px-3 py-1.5 rounded-full text-[13px] font-medium active:bg-gray-200 flex items-center gap-1.5 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            Dari Galeri
                        </button>
                    </div>
                    <div id="gallery-ref-picker" class="hidden mt-3 w-full overflow-x-auto flex gap-2 pb-1 scroll-smooth"></div>
                </div>
                <input type="file" id="ref-file-input" accept="image/*" class="hidden">

                <div id="ai-loading" class="hidden flex-col items-center justify-center py-4">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#007AFF]"></div>
                    <p class="text-[13px] mt-3 text-gray-500">AI sedang memproses...</p>
                </div>
            </div>
            <div class="flex border-t border-gray-200" id="ai-actions">
                <button onclick="closeAIModal()" class="flex-1 py-3.5 text-[17px] text-[#007AFF] active:bg-gray-100 transition-colors border-r border-gray-200">Batal</button>
                <button onclick="generateAIImage()" class="flex-1 py-3.5 text-[17px] font-semibold text-[#007AFF] active:bg-gray-100 transition-colors">Buat</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-12 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none w-max max-w-[90%]"></div>

    <!-- FLOATING DEBUG CONSOLE -->
    <div id="debug-console" class="fixed bottom-0 left-0 w-full bg-black/95 backdrop-blur-md border-t border-gray-700 z-[9999] flex flex-col transition-transform duration-300 h-[280px] translate-y-[240px]">
        <div class="h-10 w-full bg-gray-900 flex justify-between items-center px-4 shrink-0 shadow-lg">
            <span class="text-[11px] font-bold text-gray-300 tracking-widest uppercase">API Console</span>
            <div class="flex gap-3">
                <button onclick="document.getElementById('debug-log').innerHTML=''" class="text-[10px] font-bold text-red-400 bg-red-400/10 px-2.5 py-1 rounded active:scale-95">CLEAR</button>
                <button onclick="toggleDebugConsole()" id="debug-toggle-btn" class="text-[10px] font-bold text-white bg-white/20 px-2.5 py-1 rounded active:scale-95">EXPAND</button>
            </div>
        </div>
        <div id="debug-log" class="flex-1 overflow-y-auto p-3 text-[10px] font-mono leading-relaxed space-y-1.5 break-words" style="overscroll-behavior: contain;">
            <div class="text-gray-500">[INFO] Console siap memantau request API...</div>
        </div>
    </div>

    <script>
        const manifestBlob = new Blob([JSON.stringify({
            name: "Gallery", short_name: "Gallery", start_url: location.href, display: "standalone", background_color: "#000000", theme_color: "#000000"
        })], {type: 'application/json'});
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

        // --- DEBUG CONSOLE LOGIC ---
        function logDebug(msg, type='info') {
            const logContainer = document.getElementById('debug-log');
            let colorClass = 'text-green-400';
            if (type === 'error') colorClass = 'text-red-400';
            if (type === 'warn') colorClass = 'text-yellow-400';
            if (type === 'info') colorClass = 'text-blue-300';
            
            const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
            logContainer.innerHTML += `<div class="${colorClass}">[${time}] ${msg}</div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function toggleDebugConsole(forceExpand = false) {
            const cons = document.getElementById('debug-console');
            const btn = document.getElementById('debug-toggle-btn');
            const isMinimized = cons.classList.contains('translate-y-[240px]');
            
            if (isMinimized || forceExpand) {
                cons.classList.remove('translate-y-[240px]');
                btn.innerText = 'MINIMIZE';
            } else if (!forceExpand) {
                cons.classList.add('translate-y-[240px]');
                btn.innerText = 'EXPAND';
            }
        }

        // --- GLOBAL SETTINGS LOGIC ---
        let appGlobalSettings = {
            apiKey: '',
            modelName: 'gemini-3.1-flash-image-preview'
        };

        function loadGlobalSettings() {
            const saved = localStorage.getItem('galleryGlobalSettings_v1');
            if (saved) {
                appGlobalSettings = JSON.parse(saved);
            }
        }

        function openGlobalSettings() {
            document.getElementById('global-api-key').value = appGlobalSettings.apiKey;
            document.getElementById('global-model-name').value = appGlobalSettings.modelName;
            
            const modal = document.getElementById('global-settings-modal');
            const box = document.getElementById('global-settings-box');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); }, 10);
        }

        function closeGlobalSettings() {
            const modal = document.getElementById('global-settings-modal');
            const box = document.getElementById('global-settings-box');
            modal.classList.add('opacity-0'); box.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        function saveGlobalSettings() {
            appGlobalSettings.apiKey = document.getElementById('global-api-key').value.trim();
            appGlobalSettings.modelName = document.getElementById('global-model-name').value.trim() || 'gemini-3.1-flash-image-preview';
            localStorage.setItem('galleryGlobalSettings_v1', JSON.stringify(appGlobalSettings));
            closeGlobalSettings();
            showToast("Pengaturan Global Tersimpan");
        }

        loadGlobalSettings();


        // --- KONFIGURASI INDEXEDDB ---
        const DB_NAME = 'ImageViewerDB_iOS_v2';
        const STORE_NAME = 'gallery_images';
        let globalImages = []; 
        let currentIndex = 0;
        let activeImageLayer = 1; 
        let isPerformMode = false;

        const DEFAULT_SETTINGS = { transition: 'fade', trigger: 'tap', duration: 0.5 };

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveImageToDB(file, isAI = false) {
            const db = await openDB();
            return new Promise((resolve) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.add({ file: file, timestamp: new Date().getTime(), isAI: isAI, settings: { ...DEFAULT_SETTINGS } });
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function updateImageInDB(record) {
            const db = await openDB();
            return new Promise((resolve) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put(record); 
                request.onsuccess = () => resolve();
            });
        }

        async function getAllImagesFromDB() {
            const db = await openDB();
            return new Promise((resolve) => {
                const transaction = db.transaction(STORE_NAME, 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result.sort((a,b) => a.timestamp - b.timestamp));
            });
        }

        async function deleteImageFromDB(id) {
            const db = await openDB();
            return new Promise((resolve) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
            });
        }

        const dashboardScreen = document.getElementById('dashboard-screen');
        const imageScreen = document.getElementById('image-screen');
        const fileInput = document.getElementById('file-input');
        const imageListContainer = document.getElementById('image-list');
        const toastContainer = document.getElementById('toast-container');
        const overlayTop = document.getElementById('image-overlay-top');

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = `bg-black/80 backdrop-blur-md text-white px-5 py-2.5 rounded-full shadow-lg text-[15px] flex items-center justify-center animate-slide-up pointer-events-auto z-50`;
            toast.innerHTML = `<span>${message}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function updateQuickSetting(id, key, value, element) {
            const imgRecord = globalImages.find(i => i.id === id);
            if (!imgRecord) return;
            if (!imgRecord.settings) imgRecord.settings = { ...DEFAULT_SETTINGS };

            if (key === 'duration') {
                imgRecord.settings[key] = value === '' ? 0 : parseFloat(value);
            } else {
                imgRecord.settings[key] = value;
                const parent = element.parentElement;
                const buttons = parent.querySelectorAll('button');
                buttons.forEach(btn => btn.className = 'flex-1 text-[13px] py-1.5 rounded-[6px] text-gray-500 bg-transparent transition-all');
                element.className = 'flex-1 text-[13px] py-1.5 rounded-[6px] bg-white shadow-sm font-semibold text-black transition-all';
            }
            await updateImageInDB(imgRecord);
        }

        async function loadDashboard() {
            imageListContainer.innerHTML = '';
            globalImages = await getAllImagesFromDB();
            if (globalImages.length === 0) return;

            globalImages.forEach((imgData, index) => {
                const objectUrl = URL.createObjectURL(imgData.file);
                const title = imgData.isAI ? `Image ${index + 1} (AI)` : `Image ${index + 1}`;
                const imgSet = imgData.settings || DEFAULT_SETTINGS;
                const isFade = imgSet.transition === 'fade';
                const isTap = imgSet.trigger === 'tap';
                const dur = imgSet.duration;
                
                const itemHTML = `
                    <div class="bg-white rounded-[14px] overflow-hidden shadow-sm animate-fade-in border border-black/5">
                        <div class="px-4 py-3 border-b border-black/5">
                            <h2 class="text-[17px] font-medium text-black">${title}</h2>
                        </div>
                        <div class="w-full h-60 bg-gray-100 cursor-pointer" onclick="openFullscreen(${index})">
                            <img src="${objectUrl}" class="w-full h-full object-cover" alt="${title}">
                        </div>
                        <div class="p-4 bg-[#FAFAFA] flex flex-col gap-3 border-t border-black/5">
                            <div class="flex justify-between items-center">
                                <span class="text-[14px] text-gray-600 font-medium">Transition</span>
                                <div class="flex bg-gray-200/80 rounded-[8px] p-0.5 w-[160px]">
                                    <button onclick="updateQuickSetting(${imgData.id}, 'transition', 'fade', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${isFade ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Fade</button>
                                    <button onclick="updateQuickSetting(${imgData.id}, 'transition', 'instant', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${!isFade ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Instant</button>
                                </div>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[14px] text-gray-600 font-medium">Trigger</span>
                                <div class="flex bg-gray-200/80 rounded-[8px] p-0.5 w-[160px]">
                                    <button onclick="updateQuickSetting(${imgData.id}, 'trigger', 'tap', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${isTap ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Tap</button>
                                    <button onclick="updateQuickSetting(${imgData.id}, 'trigger', 'swipe', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${!isTap ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Swipe</button>
                                </div>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[14px] text-gray-600 font-medium">Duration (sec)</span>
                                <input type="number" step="0.1" min="0" value="${dur}" onchange="updateQuickSetting(${imgData.id}, 'duration', this.value, this)" class="w-[160px] bg-white border border-gray-200 rounded-[8px] px-3 py-1.5 text-[14px] font-semibold outline-none focus:border-[#007AFF] focus:ring-1 focus:ring-[#007AFF] text-center shadow-sm transition-all">
                            </div>
                        </div>
                    </div>
                `;
                imageListContainer.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        async function startPerform() {
            if (globalImages.length === 0) {
                showToast("Tambahkan gambar ke galeri dulu!");
                return;
            }
            try {
                const elem = document.documentElement;
                if (elem.requestFullscreen) await elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) await elem.webkitRequestFullscreen();
            } catch (e) {}

            isPerformMode = true;
            overlayTop.classList.add('hidden'); 
            showToast("Perform Mode: Swipe kebawah dengan 2 Jari untuk keluar");
            openFullscreen(0); 
        }

        function openFullscreen(index) {
            if(globalImages.length === 0) return;
            currentIndex = index;
            const url = URL.createObjectURL(globalImages[currentIndex].file);
            
            const img1 = document.getElementById('display-image-1');
            const img2 = document.getElementById('display-image-2');
            
            img1.style.transitionDuration = '0s';
            img2.style.transitionDuration = '0s';
            img1.src = url; img1.style.opacity = 1;
            img2.style.opacity = 0; activeImageLayer = 1;

            dashboardScreen.classList.add('hidden');
            imageScreen.classList.remove('hidden');
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
        }

        function closeFullscreen() {
            imageScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F2F2F7");
            
            isPerformMode = false;
            overlayTop.classList.remove('hidden');
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        }

        function changeImage(direction = 'next') {
            if (globalImages.length <= 1) return;
            const currentImgSettings = globalImages[currentIndex].settings || DEFAULT_SETTINGS;
            if (direction === 'next') currentIndex = (currentIndex + 1) % globalImages.length;
            else currentIndex = (currentIndex - 1 + globalImages.length) % globalImages.length;

            const url = URL.createObjectURL(globalImages[currentIndex].file);
            const img1 = document.getElementById('display-image-1');
            const img2 = document.getElementById('display-image-2');

            let dur = currentImgSettings.transition === 'instant' ? 0 : parseFloat(currentImgSettings.duration);
            if (isNaN(dur) || dur < 0) dur = 0;

            img1.style.transitionDuration = `${dur}s`;
            img2.style.transitionDuration = `${dur}s`;

            if (activeImageLayer === 1) {
                img2.src = url; img2.style.opacity = 1; img1.style.opacity = 0; activeImageLayer = 2;
            } else {
                img1.src = url; img1.style.opacity = 1; img2.style.opacity = 0; activeImageLayer = 1;
            }
        }

        const touchArea = document.getElementById('touch-area');
        let startX = 0, startY = 0, isTwoFingerGesture = false, twoFingerStartY = null, activeTouches = 0;

        touchArea.addEventListener('touchstart', (e) => {
            activeTouches = e.touches.length;
            if (activeTouches === 2) {
                isTwoFingerGesture = true;
                twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                e.preventDefault(); 
            } else if (activeTouches === 1 && !isTwoFingerGesture) {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            }
        }, { passive: false });

        touchArea.addEventListener('touchmove', (e) => {
            if (isTwoFingerGesture || e.touches.length === 2) e.preventDefault();
        }, { passive: false });

        touchArea.addEventListener('touchend', (e) => {
            activeTouches = e.touches.length;
            if (isTwoFingerGesture) {
                if (activeTouches === 0 && twoFingerStartY !== null) {
                    if ((e.changedTouches[0].clientY - twoFingerStartY) > 50) closeFullscreen();
                    twoFingerStartY = null; isTwoFingerGesture = false;
                }
                return; 
            }
            if (e.changedTouches.length === 1 && !isTwoFingerGesture) {
                let diffX = startX - e.changedTouches[0].clientX;
                let diffY = startY - e.changedTouches[0].clientY;
                let distance = Math.sqrt(diffX*diffX + diffY*diffY);
                const activeTrigger = (globalImages[currentIndex].settings || DEFAULT_SETTINGS).trigger;

                if (distance < 10) { 
                    if (activeTrigger === 'tap') changeImage('next');
                } else { 
                    if (activeTrigger === 'swipe' && Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 40) {
                        if (diffY > 0) changeImage('next'); else changeImage('prev'); 
                    }
                }
            }
        });

        document.getElementById('btn-hapus').addEventListener('click', async () => {
            if (globalImages.length > 0 && confirm("Hapus gambar ini?")) {
                await deleteImageFromDB(globalImages[currentIndex].id);
                await loadDashboard(); 
                if (globalImages.length === 0) closeFullscreen();
                else {
                    currentIndex = currentIndex >= globalImages.length ? globalImages.length - 1 : currentIndex;
                    const url = URL.createObjectURL(globalImages[currentIndex].file);
                    const activeImg = activeImageLayer === 1 ? document.getElementById('display-image-1') : document.getElementById('display-image-2');
                    activeImg.src = url;
                }
                showToast('Terhapus');
            }
        });

        fileInput.addEventListener('change', async (e) => {
            if (e.target.files[0]) {
                await saveImageToDB(e.target.files[0], false);
                loadDashboard();
            }
            fileInput.value = ''; 
        });

        // --- REFERENCE IMAGE LOGIC ---
        let currentRefBase64 = null;
        let currentRefMime = null;

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve({ base64: reader.result.split(',')[1], mime: blob.type });
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function setRefImage(fileOrBlob) {
            const data = await blobToBase64(fileOrBlob);
            currentRefBase64 = data.base64;
            currentRefMime = data.mime;
            
            document.getElementById('ref-image-preview').src = URL.createObjectURL(fileOrBlob);
            document.getElementById('ref-image-container').classList.remove('hidden');
            document.getElementById('gallery-ref-picker').classList.add('hidden');
        }

        function clearRefImage() {
            currentRefBase64 = null;
            currentRefMime = null;
            document.getElementById('ref-image-container').classList.add('hidden');
        }

        document.getElementById('ref-file-input').addEventListener('change', async (e) => {
            if (e.target.files[0]) await setRefImage(e.target.files[0]);
            e.target.value = ''; 
        });

        function showGalleryRefPicker() {
            const picker = document.getElementById('gallery-ref-picker');
            picker.innerHTML = '';
            
            if (globalImages.length === 0) {
                picker.innerHTML = '<span class="text-[12px] text-gray-500 italic mt-1">Galeri kosong.</span>';
            } else {
                globalImages.forEach(imgData => {
                    const url = URL.createObjectURL(imgData.file);
                    const imgEl = document.createElement('img');
                    imgEl.src = url;
                    imgEl.className = 'w-14 h-14 rounded-lg object-cover flex-shrink-0 cursor-pointer border border-gray-300 active:opacity-50 transition-opacity';
                    imgEl.onclick = () => setRefImage(imgData.file);
                    picker.appendChild(imgEl);
                });
            }
            picker.classList.remove('hidden');
        }

        // --- AI GENERATOR (REVISI AMAN + LOG DEBUG) ---
        function openAIModal() {
            document.getElementById('ai-modal').classList.remove('hidden');
            document.getElementById('ai-modal').classList.add('flex');
            setTimeout(() => {
                document.getElementById('ai-modal').classList.remove('opacity-0');
                document.getElementById('ai-modal-box').classList.remove('scale-95');
            }, 10);
            document.getElementById('ai-prompt').value = '';
            clearRefImage(); 
            document.getElementById('gallery-ref-picker').classList.add('hidden');
        }

        function closeAIModal() {
            document.getElementById('ai-modal').classList.add('opacity-0');
            document.getElementById('ai-modal-box').classList.add('scale-95');
            setTimeout(() => {
                document.getElementById('ai-modal').classList.add('hidden');
                document.getElementById('ai-modal').classList.remove('flex');
            }, 300);
        }

        async function generateAIImage() {
            const promptText = document.getElementById('ai-prompt').value.trim();
            if (!promptText) return;

            document.getElementById('ai-actions').classList.add('hidden');
            document.getElementById('ai-prompt').classList.add('hidden');
            document.getElementById('ai-ref-section').classList.add('hidden');
            document.getElementById('ai-loading').classList.remove('hidden');
            document.getElementById('ai-loading').classList.add('flex');

            logDebug("--- Memulai request AI ---", "info");
            toggleDebugConsole(true); // Buka otomatis kalau mulai jalan biar keliatan

            try {
                const systemApiKey = ""; 
                const activeApiKey = appGlobalSettings.apiKey || systemApiKey;
                const rawModelName = appGlobalSettings.modelName || 'gemini-3.1-flash-image-preview';

                if (!activeApiKey) {
                    throw new Error("API Key kosong. Silahkan isi di Settings.");
                }

                logDebug(`Model yang dipakai: ${rawModelName}`, "info");

                let url, payload;

                // Logika Penentuan Endpoint yang bener-bener anti gagal:
                // Imagen WAJIB pake :predict, Gemini Flash WAJIB pake :generateContent
                if (rawModelName.toLowerCase().includes('imagen') && !currentRefBase64) {
                    logDebug("Tipe Model: Imagen (Text-to-Image murni)", "info");
                    url = `https://generativelanguage.googleapis.com/v1beta/models/${rawModelName}:predict?key=${activeApiKey}`;
                    payload = { instances: { prompt: promptText }, parameters: { sampleCount: 1 } };
                } else {
                    logDebug(currentRefBase64 ? "Tipe Model: Gemini (Image-to-Image)" : "Tipe Model: Gemini (Text-to-Image)", "info");
                    url = `https://generativelanguage.googleapis.com/v1beta/models/${rawModelName}:generateContent?key=${activeApiKey}`;
                    
                    let parts = [{ text: promptText }];
                    if (currentRefBase64) {
                        parts.push({ inlineData: { mimeType: currentRefMime, data: currentRefBase64 } });
                    }
                    payload = {
                        contents: [{ parts: parts }],
                        generationConfig: { responseModalities: ["IMAGE"] } 
                    };
                }

                // Log aman (tanpa print seluruh base64 image biar nggak macet browsernya)
                let safeLogPayload = JSON.parse(JSON.stringify(payload));
                if (safeLogPayload.contents?.[0]?.parts?.[1]?.inlineData?.data) {
                    safeLogPayload.contents[0].parts[1].inlineData.data = "<BASE64_TERSEMBUNYI_BIAR_GAK_LAG>";
                }
                logDebug(`Endpoint: ${url.split('?')[0]}`, "info");
                logDebug(`Payload dikirim: ${JSON.stringify(safeLogPayload)}`, "info");
                
                logDebug("Menunggu respon dari Google...", "info");

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                logDebug(`Status Respon: HTTP ${response.status} ${response.statusText}`, response.ok ? "success" : "error");

                const result = await response.json();
                
                // Print Full Error Body kalau gagal
                if (!response.ok) {
                    logDebug(`Isi Error Body: ${JSON.stringify(result)}`, "error");
                    throw new Error(`API Error: HTTP ${response.status}`);
                }

                let base64DataStr = null;

                // Cari data base64 image (struktur Imagen vs Gemini beda)
                if (result.predictions && result.predictions[0]?.bytesBase64Encoded) {
                    base64DataStr = result.predictions[0].bytesBase64Encoded;
                } else if (result.candidates?.[0]?.content?.parts) {
                    const imgPart = result.candidates[0].content.parts.find(p => p.inlineData);
                    if (imgPart) base64DataStr = imgPart.inlineData.data;
                }

                if (base64DataStr) {
                    logDebug("Berhasil ekstrak base64! Konversi ke gambar...", "success");
                    
                    // Cara paling aman convert base64 ke File Blob (anti error di iOS)
                    const dataUrl = `data:image/jpeg;base64,${base64DataStr}`;
                    const fetchRes = await fetch(dataUrl);
                    const blob = await fetchRes.blob();
                    
                    await saveImageToDB(blob, true);
                    closeAIModal();
                    loadDashboard();
                    setTimeout(() => dashboardScreen.scrollTo({ top: dashboardScreen.scrollHeight, behavior: 'smooth' }), 100);
                    showToast('Gambar berhasil dibuat!');
                    logDebug("Selesai! Gambar sukses disimpan.", "success");
                } else {
                    logDebug(`Tidak nemu data gambar di respon. Isi JSON asli: ${JSON.stringify(result)}`, "warn");
                    throw new Error("Invalid Format JSON");
                }

            } catch (error) { 
                logDebug(`Gagal Total: ${error.message}`, "error");
                showToast("Gagal. Lihat API Console di bawah."); 
                console.error(error);
            } finally {
                document.getElementById('ai-actions').classList.remove('hidden');
                document.getElementById('ai-prompt').classList.remove('hidden');
                document.getElementById('ai-ref-section').classList.remove('hidden');
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-loading').classList.remove('flex');
            }
        }

        // Init App
        loadDashboard();
    </script>
</body>
</html>
