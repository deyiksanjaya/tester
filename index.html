<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>
  <link rel="shortcut icon" href="https://www.google.com/favicon.ico" type="image/x-icon" />
  <!-- Menggunakan Tailwind CSS untuk styling agar dalam satu file -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: arial, sans-serif;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen text-[#202124]">
  <!-- Header -->
  <header class="flex justify-end items-center p-4 space-x-4 text-sm">
    <a href="#" class="hover:underline hidden sm:block">Gmail</a>
    <a href="#" class="hover:underline hidden sm:block">Images</a>
    
    <!-- Apps Icon -->
    <button class="p-2 hover:bg-gray-100 rounded-full transition-colors" aria-label="Google apps">
      <svg class="w-6 h-6 text-gray-600" focusable="false" viewBox="0 0 24 24">
        <path d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z" fill="currentColor"></path>
      </svg>
    </button>
    
    <!-- Sign In Button -->
    <button class="bg-[#1a73e8] text-white px-6 py-2 rounded-md font-medium hover:bg-[#1b66c9] hover:shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
      Sign in
    </button>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex flex-col items-center mt-12 sm:mt-24 px-4 w-full">
    <!-- Google Logo -->
    <img 
      class="w-[272px] object-contain mb-8" 
      src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" 
      alt="Google" 
    />

    <!-- Search Bar -->
    <div class="flex items-center w-full max-w-[584px] border border-[#dfe1e5] rounded-full px-4 py-[10px] hover:shadow-[0_1px_6px_rgba(32,33,36,.28)] focus-within:shadow-[0_1px_6px_rgba(32,33,36,.28)] transition-shadow">
      <!-- Search Icon -->
      <span class="mr-3 text-[#9aa0a6]">
        <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
        </svg>
      </span>

      <!-- Input Field -->
      <input type="text" class="flex-grow focus:outline-none text-base" title="Search" aria-label="Search" />

      <!-- Mic Icon -->
      <span class="ml-3 cursor-pointer" aria-label="Search by voice">
        <svg focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
          <path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path>
          <path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path>
          <path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.8-2.05-4.67h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"></path>
          <path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"></path>
        </svg>
      </span>
    </div>

    <!-- Buttons -->
    <div class="flex space-x-3 mt-7">
      <button class="bg-[#f8f9fa] border border-[#f8f9fa] hover:border-[#dadce0] hover:shadow-sm text-[#3c4043] px-4 py-2 rounded text-sm focus:outline-none">
        Google Search
      </button>
      <button class="bg-[#f8f9fa] border border-[#f8f9fa] hover:border-[#dadce0] hover:shadow-sm text-[#3c4043] px-4 py-2 rounded text-sm focus:outline-none">
        I'm Feeling Lucky
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#f2f2f2] text-[#70757a] text-[15px] mt-auto">
    <!-- Top Footer Section -->
    <div class="px-8 py-3 border-b border-[#dadce0]">
      Indonesia
    </div>

    <!-- Bottom Footer Section -->
    <div class="flex flex-col md:flex-row justify-between px-4 md:px-8 py-3 space-y-4 md:space-y-0 text-sm">
      <div class="flex flex-wrap justify-center md:justify-start space-x-6">
        <a href="#" class="hover:underline">About</a>
        <a href="#" class="hover:underline">Advertising</a>
        <a href="#" class="hover:underline">Business</a>
        <a href="#" class="hover:underline">How Search works</a>
      </div>

      <div class="flex flex-wrap justify-center md:justify-end space-x-6">
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Terms</a>
        <a href="#" class="hover:underline">Settings</a>
      </div>
    </div>
  </footer>
</body>
</html>
