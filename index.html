<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>QR Scanner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: black;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
}
video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-overlay-play-button,
video::-webkit-media-controls-start-playback-button {
    display: none !important;
    -webkit-appearance: none !important;
}
#video {
    pointer-events: none;
}
#overlay {
    pointer-events: none;
}
.scan-area {
    width: 260px;
    height: 260px;
    position: relative;
}
.corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: rgba(255, 255, 255, 0.9);
    border-style: solid;
}
.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 16px; }
.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 16px; }
.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 16px; }
.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 16px; }
#ui-layer {
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    padding-bottom: env(safe-area-inset-bottom, 24px);
}
.hidden-panel {
    transform: translateY(200%);
}
.glass {
    background: rgba(15, 15, 15, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
button {
    pointer-events: auto;
    cursor: pointer;
}
</style>
</head>
<body class="text-white select-none">

<video id="video" autoplay playsinline muted class="fixed inset-0 w-full h-full object-cover z-0"></video>
<canvas id="canvas" class="hidden"></canvas>

<div id="overlay" class="fixed inset-0 z-10 flex flex-col justify-center items-center">
    <div class="scan-area">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
    </div>
</div>

<div id="ui-layer" class="fixed bottom-0 left-0 w-full z-20 px-6 pt-6 hidden-panel pointer-events-none flex flex-col gap-4">
    <div class="glass rounded-3xl p-6 w-full max-w-md mx-auto pointer-events-auto flex flex-col gap-4">
        <div class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">Scanned Result</div>
        <div id="result-text" class="text-white text-[15px] break-all font-mono leading-relaxed"></div>
        
        <div class="flex gap-3 mt-2">
            <button id="btn-copy" class="flex-1 bg-white/10 hover:bg-white/20 active:bg-white/30 text-white rounded-xl py-3.5 text-sm font-semibold transition-all border border-white/10">Copy</button>
            <button id="btn-action" class="flex-1 bg-white text-black hover:bg-gray-100 active:bg-gray-200 rounded-xl py-3.5 text-sm font-bold transition-all hidden shadow-[0_4px_15px_rgba(255,255,255,0.2)]">Open</button>
        </div>
        <button id="btn-rescan" class="w-full bg-transparent border border-white/20 text-white hover:bg-white/5 active:bg-white/10 rounded-xl py-3.5 text-sm font-semibold transition-all">Scan Again</button>
    </div>
</div>

<script>
const video = document.getElementById("video");
const canvasElement = document.getElementById("canvas");
const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
const uiLayer = document.getElementById("ui-layer");
const resultText = document.getElementById("result-text");
const btnCopy = document.getElementById("btn-copy");
const btnAction = document.getElementById("btn-action");
const btnRescan = document.getElementById("btn-rescan");
const overlay = document.getElementById("overlay");
let scanning = true;
let stream = null;

async function startCamera() {
    try {
        const s = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        });
        stream = s;
        video.srcObject = stream;
        video.play();
        requestAnimationFrame(tick);
    } catch (err) {
        resultText.innerText = "Camera access denied or unavailable.";
        showUI();
    }
}

function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if (code) {
            scanning = false;
            handleResult(code.data);
        }
    }
    requestAnimationFrame(tick);
}

function handleResult(data) {
    overlay.style.display = "none";
    resultText.innerText = data;
    
    btnAction.classList.add("hidden");
    btnAction.onclick = null;

    if (data.startsWith("http://") || data.startsWith("https://")) {
        btnAction.classList.remove("hidden");
        btnAction.innerText = "Open Link";
        btnAction.onclick = () => window.open(data, "_blank");
    } else if (data.startsWith("mailto:")) {
        btnAction.classList.remove("hidden");
        btnAction.innerText = "Send Email";
        btnAction.onclick = () => window.location.href = data;
    } else if (data.startsWith("tel:")) {
        btnAction.classList.remove("hidden");
        btnAction.innerText = "Call";
        btnAction.onclick = () => window.location.href = data;
    }

    btnCopy.onclick = () => {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(data).then(showCopiedStatus);
        } else {
            const tempInput = document.createElement("textarea");
            tempInput.value = data;
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showCopiedStatus();
        }
    };

    showUI();
}

function showCopiedStatus() {
    const originalText = btnCopy.innerText;
    btnCopy.innerText = "Copied!";
    setTimeout(() => { btnCopy.innerText = originalText; }, 2000);
}

function showUI() {
    uiLayer.classList.remove("hidden-panel");
}

function hideUI() {
    uiLayer.classList.add("hidden-panel");
}

btnRescan.onclick = () => {
    hideUI();
    overlay.style.display = "flex";
    scanning = true;
    requestAnimationFrame(tick);
};

window.addEventListener('load', () => {
    startCamera();
});
</script>
</body>
</html>
