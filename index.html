<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        #canvas {
            display: none;
        }
        
        #aod-container {
            position: absolute;
            top: 15%;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            pointer-events: none;
        }
        #aod-time {
            font-size: 72px;
            font-weight: 200;
            letter-spacing: 2px;
            color: #eee;
            margin-bottom: 8px;
        }
        #aod-date {
            font-size: 16px;
            font-weight: 400;
            color: #888;
            opacity: 0.8;
            max-width: 85%;
            text-align: center;
            white-space: pre-wrap;
            line-height: 1.5;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        #peek-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 95%;
            max-height: 70%;
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 8px;
            transition: opacity 0.2s ease;
        }
        #stealth-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
            transition: background 0.2s ease-out;
        }
        .dot-ready {
            background: #444 !important;
        }
        .dot-success {
            background: #22c55e !important;
        }
        .dot-error {
            background: #ef4444 !important;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 28px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #222;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 24px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #555;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1a1a1a;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #fff;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        #sun-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: opacity 0.1s;
        }
        #opacity-val-text {
            font-size: 13px;
            color: #888;
            min-width: 35px;
            text-align: right;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="aod-container">
        <div id="aod-time">00:00</div>
        <div id="aod-date">Memuat...</div>
    </div>

    <img id="peek-img" src="" alt="">
    <div id="stealth-dot"></div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">System Configuration</div>
            <div class="input-group">
                <span class="input-label">API Credentials</span>
                <input type="text" id="api-key-input" placeholder="Cloud Vision Key" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Operation Mode</span>
                <select id="mode-select">
                    <option value="ocr">Text Extraction</option>
                    <option value="peek">Image Capture</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Scan Interval</span>
                <select id="interval-select">
                    <option value="1000">1 Second</option>
                    <option value="2000">2 Seconds</option>
                    <option value="3000">3 Seconds</option>
                    <option value="5000">5 Seconds</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Peek Opacity</span>
                <div class="slider-container">
                    <svg id="sun-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <input type="range" id="opacity-slider" min="10" max="100" value="80">
                    <span id="opacity-val-text">80%</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Close</button>
                <button class="btn-primary" id="save-btn">Save</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const aodTime = document.getElementById('aod-time');
        const aodDate = document.getElementById('aod-date');
        const peekImg = document.getElementById('peek-img');
        const stealthDot = document.getElementById('stealth-dot');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const modeSelect = document.getElementById('mode-select');
        const intervalSelect = document.getElementById('interval-select');
        const opacitySlider = document.getElementById('opacity-slider');
        const sunIcon = document.getElementById('sun-icon');
        const opacityValText = document.getElementById('opacity-val-text');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let currentInterval = parseInt(localStorage.getItem('stealthScannerInterval')) || 2000;
        let currentOpacity = parseInt(localStorage.getItem('stealthScannerOpacity')) || 80;
        
        let scanIntervalId = null;
        let isProcessing = false;
        let peekImageSrc = '';
        let extractedText = '';
        let realDateString = '';
        
        let tapCount = 0;
        let lastTapTime = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        document.addEventListener('contextmenu', e => e.preventDefault());

        function updateClock() {
            const now = new Date();
            aodTime.innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            realDateString = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
            
            if (!isHolding || currentMode !== 'ocr') {
                aodDate.innerText = realDateString;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        opacitySlider.addEventListener('input', (e) => {
            const val = e.target.value;
            opacityValText.innerText = val + '%';
            sunIcon.style.opacity = val / 100;
        });

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal')) return;
            
            isHolding = false;
            holdTimeout = setTimeout(() => {
                isHolding = true;
                const op = currentOpacity / 100;
                
                if (currentMode === 'peek' && peekImageSrc) {
                    peekImg.src = peekImageSrc;
                    peekImg.style.opacity = op;
                    peekImg.style.display = 'block';
                } else if (currentMode === 'ocr' && extractedText) {
                    aodDate.innerText = extractedText;
                    aodDate.style.color = '#fff';
                    aodDate.style.opacity = op;
                }
            }, 300);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                if (currentMode === 'peek') {
                    peekImg.style.display = 'none';
                } else if (currentMode === 'ocr') {
                    aodDate.innerText = realDateString;
                    aodDate.style.color = '#888';
                    aodDate.style.opacity = 0.8;
                }
                e.preventDefault();
                e.stopPropagation();
                return;
            }

            if (e.type === 'pointerup') {
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    tapCount++;
                } else {
                    tapCount = 1;
                }
                lastTapTime = now;

                clearTimeout(tapTimeout);
                tapTimeout = setTimeout(() => {
                    if (tapCount >= 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        modeSelect.value = currentMode;
                        intervalSelect.value = currentInterval.toString();
                        opacitySlider.value = currentOpacity;
                        opacityValText.innerText = currentOpacity + '%';
                        sunIcon.style.opacity = currentOpacity / 100;
                    } else if (tapCount === 2) {
                        toggleSystem();
                    }
                    tapCount = 0;
                }, 220);
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentMode = modeSelect.value;
            currentInterval = parseInt(intervalSelect.value);
            currentOpacity = parseInt(opacitySlider.value);

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerMode', currentMode);
            localStorage.setItem('stealthScannerInterval', currentInterval);
            localStorage.setItem('stealthScannerOpacity', currentOpacity);

            settingsModal.style.display = 'none';
            resetState();
            stopCamera();
        });

        function resetState() {
            extractedText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            aodDate.innerText = realDateString;
            aodDate.style.color = '#888';
            aodDate.style.opacity = 0.8;
            stealthDot.className = '';
            isProcessing = false;
        }

        async function toggleSystem() {
            if (scanIntervalId || video.srcObject) {
                stopCamera();
            } else {
                startSystem();
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            if (stealthDot.className === 'dot-ready' || stealthDot.className === 'dot-error') {
                stealthDot.className = '';
            }
        }

        async function startSystem() {
            if (scanIntervalId) return;
            resetState();
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    scanIntervalId = setInterval(executeCloudVisionCapture, currentInterval);
                    stealthDot.className = 'dot-ready';
                };
            } catch (err) {
                stealthDot.className = 'dot-error';
            }
        }

        async function executeCloudVisionCapture() {
            if (!video.videoWidth || isProcessing || !visionApiKey) return;
            isProcessing = true;

            try {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                await sendToCloudVision(base64Image);
            } catch (err) {
                stealthDot.className = 'dot-error';
                isProcessing = false;
            }
        }

        async function sendToCloudVision(base64String) {
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0] && data.responses[0].fullTextAnnotation) {
                    const responseObj = data.responses[0];
                    const textResult = responseObj.fullTextAnnotation.text;
                    const cleanText = textResult.replace(/[^a-zA-Z0-9 ]/g, '').trim();
                    
                    if (cleanText.length >= 3) {
                        if (currentMode === 'ocr') {
                            extractedText = textResult;
                            stealthDot.className = 'dot-success';
                            stopCamera();
                        } else if (currentMode === 'peek') {
                            const annotations = responseObj.textAnnotations;
                            if (annotations && annotations.length > 0) {
                                const vertices = annotations[0].boundingPoly.vertices;
                                let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                                
                                vertices.forEach(v => {
                                    const x = v.x || 0;
                                    const y = v.y || 0;
                                    if (x < minX) minX = x;
                                    if (y < minY) minY = y;
                                    if (x > maxX) maxX = x;
                                    if (y > maxY) maxY = y;
                                });

                                const pad = 30;
                                minX = Math.max(0, minX - pad);
                                minY = Math.max(0, minY - pad);
                                maxX = Math.min(canvas.width, maxX + pad);
                                maxY = Math.min(canvas.height, maxY + pad);

                                const w = maxX - minX;
                                const h = maxY - minY;

                                if (w > 0 && h > 0) {
                                    const cropCanvas = document.createElement('canvas');
                                    cropCanvas.width = w;
                                    cropCanvas.height = h;
                                    cropCanvas.getContext('2d').drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
                                    
                                    peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.95);
                                    stealthDot.className = 'dot-success';
                                    stopCamera();
                                }
                            }
                        }
                    } else {
                        stealthDot.className = 'dot-ready';
                    }
                } else {
                    stealthDot.className = 'dot-ready';
                }
            } catch (err) {
                stealthDot.className = 'dot-error';
            }
            isProcessing = false;
        }
    </script>
</body>
</html>
