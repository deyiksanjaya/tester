<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>QR Scanner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
#video {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: 1;
}
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
.scan-area {
    width: 260px;
    height: 260px;
    position: relative;
}
.corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: rgba(255, 255, 255, 0.9);
    border-style: solid;
}
.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 16px; }
.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 16px; }
.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 16px; }
.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 16px; }
#ui-layer {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 24px);
    left: 24px;
    right: 24px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.hidden-panel {
    transform: translateY(200%);
}
.glass {
    background: rgba(15, 15, 15, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 24px;
    color: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
button {
    pointer-events: auto;
    cursor: pointer;
}
</style>
</head>
<body>

<video id="video" playsinline></video>
<canvas id="canvas" hidden></canvas>

<div id="overlay">
    <div class="scan-area">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
    </div>
</div>

<div id="ui-layer" class="hidden-panel">
    <div class="glass flex flex-col gap-4">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Hasil Pindaian</div>
        <div id="result-text" class="text-white text-base break-all font-mono"></div>
        
        <div class="flex gap-3 mt-3">
            <button id="btn-copy" class="flex-1 bg-white/10 hover:bg-white/20 active:bg-white/30 text-white rounded-2xl py-3.5 text-sm font-semibold transition-all">Salin</button>
            <button id="btn-action" class="flex-1 bg-white text-black hover:bg-gray-100 active:bg-gray-200 rounded-2xl py-3.5 text-sm font-semibold transition-all hidden">Buka Tautan</button>
        </div>
        <button id="btn-rescan" class="w-full bg-transparent border border-white/20 text-white hover:bg-white/5 active:bg-white/10 rounded-2xl py-3.5 text-sm font-semibold transition-all mt-1">Pindai Ulang</button>
    </div>
</div>

<script>
const video = document.getElementById("video");
const canvasElement = document.getElementById("canvas");
const canvas = canvasElement.getContext("2d");
const uiLayer = document.getElementById("ui-layer");
const resultText = document.getElementById("result-text");
const btnCopy = document.getElementById("btn-copy");
const btnAction = document.getElementById("btn-action");
const btnRescan = document.getElementById("btn-rescan");
const overlay = document.getElementById("overlay");
let scanning = true;
let stream = null;

function startCamera() {
    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" } 
    }).then(function(s) {
        stream = s;
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(tick);
    }).catch(function(err) {
        resultText.innerText = "Akses kamera ditolak atau tidak tersedia.";
        showUI();
    });
}

function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
        var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if (code) {
            scanning = false;
            handleResult(code.data);
        }
    }
    requestAnimationFrame(tick);
}

function handleResult(data) {
    overlay.style.display = "none";
    resultText.innerText = data;
    
    btnAction.classList.add("hidden");
    btnAction.onclick = null;

    if (data.startsWith("http://") || data.startsWith("https://")) {
        btnAction.classList.remove("hidden");
        btnAction.innerText = "Buka Tautan";
        btnAction.onclick = () => window.open(data, "_blank");
    } else if (data.startsWith("mailto:")) {
        btnAction.classList.remove("hidden");
        btnAction.innerText = "Kirim Email";
        btnAction.onclick = () => window.location.href = data;
    } else if (data.startsWith("tel:")) {
        btnAction.classList.remove("hidden");
        btnAction.innerText = "Panggil";
        btnAction.onclick = () => window.location.href = data;
    }

    btnCopy.onclick = () => {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(data).then(showCopiedStatus);
        } else {
            const tempInput = document.createElement("textarea");
            tempInput.value = data;
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showCopiedStatus();
        }
    };

    showUI();
}

function showCopiedStatus() {
    const originalText = btnCopy.innerText;
    btnCopy.innerText = "Disalin!";
    setTimeout(() => { btnCopy.innerText = originalText; }, 2000);
}

function showUI() {
    uiLayer.classList.remove("hidden-panel");
}

function hideUI() {
    uiLayer.classList.add("hidden-panel");
}

btnRescan.onclick = () => {
    hideUI();
    overlay.style.display = "flex";
    scanning = true;
    requestAnimationFrame(tick);
};

startCamera();
</script>
</body>
</html>
