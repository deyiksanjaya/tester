<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Input</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            color: #f3f4f6;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
    </style>
</head>
<body class="flex flex-col">
    <main class="flex-1 w-full h-full p-8 overflow-y-auto">
        <div id="display" class="text-base font-mono whitespace-pre-wrap break-words leading-relaxed text-gray-300"></div>
    </main>

    <script>
        const display = document.getElementById('display');
        let record = '';

        window.addEventListener('keydown', (event) => {
            const key = event.key;

            if (key === 'Backspace') {
                record = record.slice(0, -1);
            } else if (key === 'Enter') {
                record += '\n';
            } else if (key.length === 1) {
                record += key;
            }

            display.textContent = record;
        });
    </script>
</body>
</html>
