<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stealth Scanner</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #canvas { display: none; }
        #display-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; align-items: center; justify-content: center; background: #000; }
        #peek-img { max-width: 95%; max-height: 95%; object-fit: contain; display: none; }
        #peek-text { color: #fff; padding: 20px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; display: none; width: 90%; }
        #stealth-dot { position: absolute; top: 15px; right: 15px; width: 6px; height: 6px; border-radius: 50%; z-index: 100; transition: background 0.3s; }
        .dot-ready { background: #555; }
        .dot-success { background: #22c55e; }
        .dot-error { background: #ef4444; }
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: #111; padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; border: 1px solid #333; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; background: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="stealth-dot" class="dot-ready"></div>
    <div id="display-layer">
        <img id="peek-img">
        <div id="peek-text"></div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <input type="text" id="api-key" placeholder="API Key">
            <select id="mode"><option value="ocr">Teks (OCR)</option><option value="peek">Gambar (Peek)</option></select>
            <button id="save-btn">Simpan</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video'), canvas = document.getElementById('canvas');
        const displayLayer = document.getElementById('display-layer'), peekImg = document.getElementById('peek-img'), peekText = document.getElementById('peek-text');
        const dot = document.getElementById('stealth-dot'), settings = document.getElementById('settings-modal');
        
        let apiKey = localStorage.getItem('sKey') || '', mode = localStorage.getItem('sMode') || 'ocr';
        let scanId = null, isProcessing = false;

        document.body.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.modal')) return;
            const hold = setTimeout(() => {
                if (peekImg.src || peekText.innerText) displayLayer.style.display = 'flex';
            }, 500);
            document.body.onpointerup = () => { clearTimeout(hold); displayLayer.style.display = 'none'; };
        });

        let taps = 0;
        document.body.addEventListener('click', () => {
            taps++;
            if (taps === 2) toggleCamera();
            if (taps === 3) settings.style.display = 'flex';
            setTimeout(() => taps = 0, 500);
        });

        document.getElementById('save-btn').onclick = () => {
            apiKey = document.getElementById('api-key').value;
            mode = document.getElementById('mode').value;
            localStorage.setItem('sKey', apiKey); localStorage.setItem('sMode', mode);
            settings.style.display = 'none';
        };

        async function toggleCamera() {
            if (scanId) { stopCam(); return; }
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            scanId = setInterval(process, 1500);
            dot.className = 'dot-ready';
        }

        function stopCam() {
            clearInterval(scanId); scanId = null;
            video.srcObject.getTracks().forEach(t => t.stop());
            dot.className = '';
        }

        async function process() {
            if (isProcessing) return;
            isProcessing = true;
            canvas.width = 800; canvas.height = video.videoHeight * (800 / video.videoWidth);
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const res = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`, {
                method: 'POST',
                body: JSON.stringify({ requests: [{ image: { content: canvas.toDataURL('image/jpeg', 0.8).split(',')[1] }, features: [{ type: "DOCUMENT_TEXT_DETECTION" }] }] })
            }).then(r => r.json());

            if (res.responses?.[0]?.fullTextAnnotation) {
                const txt = res.responses[0].fullTextAnnotation.text;
                if (mode === 'ocr') { peekText.innerText = txt; peekImg.style.display = 'none'; peekText.style.display = 'block'; }
                else {
                    const verts = res.responses[0].textAnnotations[0].boundingPoly.vertices;
                    const crop = document.createElement('canvas');
                    crop.width = verts[2].x - verts[0].x + 40; crop.height = verts[2].y - verts[0].y + 40;
                    crop.getContext('2d').drawImage(canvas, verts[0].x - 20, verts[0].y - 20, crop.width, crop.height, 0, 0, crop.width, crop.height);
                    peekImg.src = crop.toDataURL(); peekText.style.display = 'none'; peekImg.style.display = 'block';
                }
                dot.className = 'dot-success'; stopCam();
            } else dot.className = 'dot-error';
            isProcessing = false;
        }
    </script>
</body>
</html>
