<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas {
            display: none;
        }
        #display-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            z-index: 1;
        }
        #result-text {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 90vh;
            overflow-y: auto;
            width: 100%;
            text-align: left;
            pointer-events: none;
            display: none;
        }
        #peek-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
        }
        #stealth-dot {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
            transition: background 0.3s;
        }
        .dot-ready {
            background: #555 !important;
        }
        .dot-success {
            background: #22c55e !important;
        }
        .dot-error {
            background: #ef4444 !important;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 28px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #222;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 24px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #555;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="stealth-dot"></div>

    <div id="display-area">
        <img id="peek-img" src="" alt="">
        <div id="result-text"></div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">System Configuration</div>
            <div class="input-group">
                <span class="input-label">API Credentials</span>
                <input type="text" id="api-key-input" placeholder="Cloud Vision Key" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Lens Module</span>
                <select id="camera-select">
                    <option value="environment">Main Camera</option>
                    <option value="user">Front Camera</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Operation Mode</span>
                <select id="mode-select">
                    <option value="ocr">Text Extraction</option>
                    <option value="peek">Image Capture</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Scan Interval</span>
                <select id="interval-select">
                    <option value="1000">1 Second</option>
                    <option value="2000">2 Seconds</option>
                    <option value="3000">3 Seconds</option>
                    <option value="5000">5 Seconds</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Close</button>
                <button class="btn-primary" id="save-btn">Save</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultText = document.getElementById('result-text');
        const peekImg = document.getElementById('peek-img');
        const stealthDot = document.getElementById('stealth-dot');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const cameraSelect = document.getElementById('camera-select');
        const modeSelect = document.getElementById('mode-select');
        const intervalSelect = document.getElementById('interval-select');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentFacingMode = localStorage.getItem('stealthScannerCamera') || 'environment';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let currentInterval = parseInt(localStorage.getItem('stealthScannerInterval')) || 2000;
        
        let scanIntervalId = null;
        let isProcessing = false;
        let peekImageSrc = '';
        let extractedText = '';
        
        let tapCount = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        document.addEventListener('contextmenu', e => e.preventDefault());

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal')) return;
            
            isHolding = false;
            holdTimeout = setTimeout(() => {
                isHolding = true;
                if (currentMode === 'peek' && peekImageSrc) {
                    peekImg.src = peekImageSrc;
                    peekImg.style.display = 'block';
                } else if (currentMode === 'ocr' && extractedText) {
                    resultText.innerText = extractedText;
                    resultText.style.display = 'block';
                }
            }, 350);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                peekImg.style.display = 'none';
                resultText.style.display = 'none';
                e.preventDefault();
                e.stopPropagation();
                return;
            }

            if (e.type === 'pointerup') {
                tapCount++;
                clearTimeout(tapTimeout);
                
                tapTimeout = setTimeout(() => {
                    if (tapCount === 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        cameraSelect.value = currentFacingMode;
                        modeSelect.value = currentMode;
                        intervalSelect.value = currentInterval.toString();
                    } else if (tapCount === 2) {
                        toggleSystem();
                    }
                    tapCount = 0;
                }, 350);
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentFacingMode = cameraSelect.value;
            currentMode = modeSelect.value;
            currentInterval = parseInt(intervalSelect.value);

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerCamera', currentFacingMode);
            localStorage.setItem('stealthScannerMode', currentMode);
            localStorage.setItem('stealthScannerInterval', currentInterval);

            settingsModal.style.display = 'none';
            resetState();
            stopCamera();
        });

        function resetState() {
            resultText.innerText = '';
            extractedText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            stealthDot.className = '';
            isProcessing = false;
        }

        async function toggleSystem() {
            if (scanIntervalId || video.srcObject) {
                stopCamera();
            } else {
                startSystem();
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            if (stealthDot.className === 'dot-ready' || stealthDot.className === 'dot-error') {
                stealthDot.className = '';
            }
        }

        async function startSystem() {
            if (scanIntervalId) return;
            resetState();
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;
                
                scanIntervalId = setInterval(executeCloudVisionCapture, currentInterval);
                stealthDot.className = 'dot-ready';
            } catch (err) {
                stealthDot.className = 'dot-error';
            }
        }

        async function executeCloudVisionCapture() {
            if (!video.videoWidth || isProcessing || !visionApiKey) return;
            isProcessing = true;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            await sendToCloudVision(base64Image);
        }

        async function sendToCloudVision(base64String) {
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0] && data.responses[0].fullTextAnnotation) {
                    const responseObj = data.responses[0];
                    const textResult = responseObj.fullTextAnnotation.text;
                    const cleanText = textResult.replace(/[^a-zA-Z0-9 ]/g, '').trim();
                    
                    if (cleanText.length >= 3) {
                        if (currentMode === 'ocr') {
                            extractedText = textResult;
                            stealthDot.className = 'dot-success';
                            stopCamera();
                        } else if (currentMode === 'peek') {
                            const annotations = responseObj.textAnnotations;
                            if (annotations && annotations.length > 0) {
                                const vertices = annotations[0].boundingPoly.vertices;
                                let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                                
                                vertices.forEach(v => {
                                    const x = v.x || 0;
                                    const y = v.y || 0;
                                    if (x < minX) minX = x;
                                    if (y < minY) minY = y;
                                    if (x > maxX) maxX = x;
                                    if (y > maxY) maxY = y;
                                });

                                const pad = 30;
                                minX = Math.max(0, minX - pad);
                                minY = Math.max(0, minY - pad);
                                maxX = Math.min(canvas.width, maxX + pad);
                                maxY = Math.min(canvas.height, maxY + pad);

                                const w = maxX - minX;
                                const h = maxY - minY;

                                if (w > 0 && h > 0) {
                                    const cropCanvas = document.createElement('canvas');
                                    cropCanvas.width = w;
                                    cropCanvas.height = h;
                                    cropCanvas.getContext('2d').drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
                                    
                                    peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.95);
                                    stealthDot.className = 'dot-success';
                                    stopCamera();
                                }
                            }
                        }
                    } else {
                        stealthDot.className = 'dot-ready';
                    }
                } else {
                    stealthDot.className = 'dot-ready';
                }
            } catch (err) {
                stealthDot.className = 'dot-error';
            }
            isProcessing = false;
        }
    </script>
</body>
</html>
