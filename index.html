<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: black;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
    }
    video { pointer-events: none; }
    .scanner-overlay {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: white;
      border-style: solid;
    }
    .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
    .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }
    .scan-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0) 100%);
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0.9;
      box-shadow: 0 1px 6px rgba(255,255,255,0.4);
      will-change: top;
      animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes scan {
      0% { top: 0; }
      50% { top: calc(100% - 3px); }
      100% { top: 0; }
    }
    .drawer-open {
      transform: translateY(0);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden text-white select-none bg-black">

  <video id="video" class="fixed inset-0 w-full h-full object-cover z-0" playsinline autoplay muted></video>
  <canvas id="canvas" class="hidden"></canvas>

  <div id="ui-layer" class="fixed inset-0 z-10 flex flex-col items-center justify-center pointer-events-none transition-opacity duration-300">
    <div class="relative w-64 h-64 sm:w-80 sm:h-80 scanner-overlay rounded-xl">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line"></div>
    </div>
  </div>

  <div id="loading" class="fixed inset-0 z-50 bg-black flex items-center justify-center text-white transition-opacity duration-300">
    <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-white"></i>
  </div>

  <div id="redirecting" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center text-white opacity-0 pointer-events-none transition-opacity duration-300">
    <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-white"></i>
  </div>

  <div id="result-drawer" class="fixed bottom-0 left-0 right-0 z-40 bg-white rounded-t-3xl p-6 pb-safe pt-5 transform translate-y-full transition-transform duration-500 ease-in-out shadow-2xl">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
    
    <div id="result-text" class="text-lg text-gray-900 break-words mb-8 font-medium leading-relaxed max-h-32 overflow-y-auto"></div>
    
    <div class="flex gap-3">
      <button id="btn-copy" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-900 py-3.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2 transition-colors">
        <i data-lucide="copy" class="w-5 h-5"></i>
        <span>Copy</span>
      </button>
    </div>
    
    <button id="btn-rescan" class="w-full mt-3 bg-transparent text-gray-500 py-3.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-gray-50 transition-colors">
      <i data-lucide="refresh-cw" class="w-5 h-5"></i>
      <span>Rescan</span>
    </button>
  </div>

  <script>
    lucide.createIcons();

    const video = document.getElementById("video");
    const canvasElement = document.getElementById("canvas");
    const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
    const loading = document.getElementById("loading");
    const uiLayer = document.getElementById("ui-layer");
    const resultDrawer = document.getElementById("result-drawer");
    const resultText = document.getElementById("result-text");
    const btnCopy = document.getElementById("btn-copy");
    const btnRescan = document.getElementById("btn-rescan");
    const redirectingLayer = document.getElementById("redirecting");

    let scanning = true;
    let currentResult = "";

    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      } 
    })
      .then(function(stream) {
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(tick);
      })
      .catch(function(err) {
        loading.innerHTML = '<span class="text-sm text-red-400">Camera unavailable</span>';
      });

    function tick() {
      if (!scanning) return;
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        loading.style.opacity = "0";
        setTimeout(() => loading.style.display = "none", 300);

        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        
        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          handleResult(code.data);
        } else {
          requestAnimationFrame(tick);
        }
      } else {
        requestAnimationFrame(tick);
      }
    }

    function handleResult(data) {
      scanning = false;
      currentResult = data;
      
      if (navigator.vibrate) navigator.vibrate(50);
      
      video.pause();
      
      if (data.startsWith('http://') || data.startsWith('https://')) {
        uiLayer.style.opacity = "0";
        redirectingLayer.style.opacity = "1";
        redirectingLayer.style.pointerEvents = "auto";
        
        setTimeout(() => {
          window.location.href = data;
        }, 800);
      } else {
        uiLayer.style.opacity = "0";
        resultText.innerText = data;
        resultDrawer.classList.add('drawer-open');
      }
    }

    btnCopy.addEventListener('click', () => {
      const el = document.createElement('textarea');
      el.value = currentResult;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      
      const originalText = btnCopy.querySelector('span').innerText;
      btnCopy.querySelector('span').innerText = 'Copied';
      setTimeout(() => {
        btnCopy.querySelector('span').innerText = originalText;
      }, 2000);
    });

    btnRescan.addEventListener('click', () => {
      resultDrawer.classList.remove('drawer-open');
      uiLayer.style.opacity = "1";
      currentResult = "";
      scanning = true;
      video.play();
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
