<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Teks Real-time</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tesseract.js untuk OCR di Browser -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        /* Sembunyikan scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Garis Scanner */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            top: 0;
            left: 0;
            animation: scan 2s linear infinite;
            display: none;
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .scanning .scan-line {
            display: block;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen p-4 flex flex-col items-center justify-center font-sans text-slate-800">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-blue-600 p-5 text-white flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="scan" class="w-6 h-6"></i>
                    Live Scanner
                </h1>
                <p class="text-blue-200 text-xs mt-1">Arahkan kamera ke teks</p>
            </div>
            <!-- Pilih Bahasa -->
            <select id="language" class="bg-blue-700 text-white text-xs p-2 rounded-lg border border-blue-500 outline-none focus:ring-2 focus:ring-blue-300" onchange="changeLanguage()">
                <option value="eng">English</option>
                <option value="ind">Indonesia</option>
            </select>
        </div>

        <div class="p-4 space-y-4">
            
            <!-- Area Kamera -->
            <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                <!-- Video Stream -->
                <video id="videoElement" class="w-full h-full object-cover hidden" autoplay playsinline></video>
                
                <!-- Efek Garis Scan -->
                <div id="scanOverlay" class="absolute inset-0 pointer-events-none">
                    <div class="scan-line"></div>
                </div>

                <!-- Pesan Kamera -->
                <div id="cameraMessage" class="absolute text-center text-slate-400 p-4">
                    <i data-lucide="camera-off" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                    <p class="text-sm font-medium">Kamera belum aktif</p>
                </div>
                
                <!-- Hidden Canvas untuk nge-capture frame video -->
                <canvas id="canvasElement" class="hidden"></canvas>
            </div>

            <!-- Kontrol Utama -->
            <div class="flex gap-3">
                <button id="toggleCameraBtn" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2" onclick="toggleCamera()">
                    <i data-lucide="video" class="w-5 h-5"></i>
                    <span id="btnText">Nyalakan Kamera</span>
                </button>
            </div>

            <!-- Status Pembacaan OCR -->
            <div id="ocrStatus" class="hidden items-center justify-center gap-2 text-sm text-blue-600 bg-blue-50 p-2 rounded-lg font-medium">
                <span class="loader border-blue-200 border-top-blue-600 w-4 h-4"></span>
                <span id="statusText">Menyiapkan mesin AI...</span>
            </div>

            <!-- Area Hasil -->
            <div class="flex flex-col space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-700 flex items-center gap-1">
                        <i data-lucide="align-left" class="w-4 h-4"></i> Teks Terdeteksi:
                    </label>
                    <button onclick="copyToClipboard()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 px-3 rounded-lg flex items-center gap-1 transition">
                        <i data-lucide="copy" class="w-3 h-3"></i> Salin
                    </button>
                </div>
                <textarea id="resultText" class="w-full h-32 p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl outline-none resize-none no-scrollbar focus:ring-2 focus:ring-blue-500 transition-colors" placeholder="Hasil scan akan muncul di sini secara real-time..." readonly></textarea>
            </div>

        </div>
    </div>

    <script>
        // Inisialisasi ikon UI
        lucide.createIcons();

        // Variabel global
        let videoStream = null;
        let isScanning = false;
        let isCameraOn = false;
        let scanInterval;
        let workerReady = false;

        // Elemen DOM
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const toggleBtn = document.getElementById('toggleCameraBtn');
        const btnText = document.getElementById('btnText');
        const scanOverlay = document.getElementById('scanOverlay');
        const cameraMessage = document.getElementById('cameraMessage');
        const resultText = document.getElementById('resultText');
        const ocrStatus = document.getElementById('ocrStatus');
        const statusText = document.getElementById('statusText');
        const languageSelect = document.getElementById('language');

        // Fungsi nyalakan/matikan kamera
        async function toggleCamera() {
            if (isCameraOn) {
                stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            try {
                // Minta akses kamera (prioritaskan kamera belakang kalau di HP)
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                
                video.srcObject = videoStream;
                video.classList.remove('hidden');
                cameraMessage.classList.add('hidden');
                
                isCameraOn = true;
                btnText.textContent = "Matikan Kamera";
                toggleBtn.classList.replace('bg-slate-800', 'bg-red-600');
                toggleBtn.classList.replace('hover:bg-slate-900', 'hover:bg-red-700');
                toggleBtn.innerHTML = `<i data-lucide="video-off" class="w-5 h-5"></i><span>Matikan Kamera</span>`;
                lucide.createIcons();

                // Mulai proses scanning
                startScanning();

            } catch (error) {
                console.error("Gagal akses kamera:", error);
                alert("Nggak bisa akses kamera nih. Pastiin lo udah kasih izin ya!");
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            video.classList.add('hidden');
            cameraMessage.classList.remove('hidden');
            
            isCameraOn = false;
            stopScanning();

            btnText.textContent = "Nyalakan Kamera";
            toggleBtn.classList.replace('bg-red-600', 'bg-slate-800');
            toggleBtn.classList.replace('hover:bg-red-700', 'hover:bg-slate-900');
            toggleBtn.innerHTML = `<i data-lucide="video" class="w-5 h-5"></i><span>Nyalakan Kamera</span>`;
            lucide.createIcons();
            ocrStatus.classList.add('hidden');
        }

        // Mulai loop membaca frame
        function startScanning() {
            isScanning = true;
            scanOverlay.classList.add('scanning');
            ocrStatus.classList.remove('hidden');
            ocrStatus.classList.replace('text-green-600', 'text-blue-600');
            ocrStatus.classList.replace('bg-green-50', 'bg-blue-50');
            statusText.textContent = "Sedang mencari teks...";
            
            // Loop scanning (panggil OCR berulang kali)
            scanLoop();
        }

        function stopScanning() {
            isScanning = false;
            scanOverlay.classList.remove('scanning');
        }

        // Fungsi utama buat ngambil gambar dari video dan baca teksnya
        async function scanLoop() {
            if (!isScanning || !isCameraOn) return;

            // Pastikan video udah main
            if (video.videoWidth === 0) {
                setTimeout(scanLoop, 500);
                return;
            }

            // Set ukuran canvas sama dengan video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Gambar frame video ke canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const selectedLang = languageSelect.value;

            try {
                // Tesseract v5 API - Baca dari canvas
                const result = await Tesseract.recognize(canvas, selectedLang);
                
                const text = result.data.text.trim();
                
                // Kalau ada teks terdeteksi dan agak panjang (biar nggak nangkep noise)
                if (text.length > 3) {
                    // Update UI
                    resultText.value = text;
                    resultText.classList.add('bg-green-50', 'border-green-300');
                    setTimeout(() => resultText.classList.remove('bg-green-50', 'border-green-300'), 500);
                    
                    statusText.textContent = "Teks ditemukan!";
                    ocrStatus.classList.replace('text-blue-600', 'text-green-600');
                    ocrStatus.classList.replace('bg-blue-50', 'bg-green-50');
                } else {
                    statusText.textContent = "Mencari teks...";
                    ocrStatus.classList.replace('text-green-600', 'text-blue-600');
                    ocrStatus.classList.replace('bg-green-50', 'bg-blue-50');
                }
            } catch (error) {
                console.error("OCR Error:", error);
            }

            // Kasih jeda sedikit biar HP/Laptop nggak nge-hang, lalu lanjut scan frame berikutnya
            if (isScanning) {
                setTimeout(scanLoop, 1000); // Scan tiap 1 detik
            }
        }

        function changeLanguage() {
            if (isScanning) {
                statusText.textContent = "Mengganti bahasa OCR...";
            }
        }

        // Fungsi salin teks
        function copyToClipboard() {
            if (!resultText.value) return;
            
            resultText.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            
            const originalText = statusText.textContent;
            statusText.textContent = "Teks tersalin!";
            ocrStatus.classList.remove('hidden');
            
            setTimeout(() => {
                if (isScanning) {
                    statusText.textContent = "Mencari teks...";
                } else {
                    ocrStatus.classList.add('hidden');
                }
            }, 2000);
        }

    </script>
</body>
</html>
