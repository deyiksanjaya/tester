<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas {
            display: none;
        }
        #display-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            z-index: 1;
        }
        #result-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            opacity: 0.8;
            max-height: 100%;
            overflow-y: auto;
            width: 100%;
            text-align: left;
            pointer-events: none;
        }
        #peek-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 24px;
            border-radius: 8px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #333;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #eee;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #666;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="peek-img" src="" alt="">

    <div id="display-area">
        <div id="result-text"></div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">Konfigurasi Sistem</div>
            <div class="input-group">
                <span class="input-label">Kredensial API</span>
                <input type="text" id="api-key-input" placeholder="Google Cloud Vision" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Modul Kamera</span>
                <select id="camera-select">
                    <option value="environment">Kamera Utama</option>
                    <option value="user">Kamera Depan</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Metode Operasi</span>
                <select id="mode-select">
                    <option value="ocr">Cloud OCR</option>
                    <option value="peek">Peek Picture</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Tutup</button>
                <button class="btn-primary" id="save-btn">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultText = document.getElementById('result-text');
        const peekImg = document.getElementById('peek-img');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const cameraSelect = document.getElementById('camera-select');
        const modeSelect = document.getElementById('mode-select');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentFacingMode = localStorage.getItem('stealthScannerCamera') || 'environment';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let scanIntervalId = null;
        let ocrWorker = null;
        let isProcessing = false;
        let peekImageSrc = '';
        
        let tapCount = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        document.addEventListener('contextmenu', e => e.preventDefault());

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal')) return;
            
            holdTimeout = setTimeout(() => {
                if (scanIntervalId || video.srcObject) {
                    isHolding = true;
                    if (currentMode === 'peek' && peekImageSrc) {
                        peekImg.src = peekImageSrc;
                        peekImg.style.display = 'block';
                    }
                }
            }, 250);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                peekImg.style.display = 'none';
                peekImg.src = '';
            } else {
                if (e.type === 'pointerup') {
                    tapCount++;
                    clearTimeout(tapTimeout);
                    
                    if (tapCount === 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        cameraSelect.value = currentFacingMode;
                        modeSelect.value = currentMode;
                        tapCount = 0;
                    } else {
                        tapTimeout = setTimeout(() => {
                            if (tapCount === 2) {
                                if (scanIntervalId || video.srcObject) {
                                    stopCamera();
                                } else {
                                    startSystem();
                                }
                            }
                            tapCount = 0;
                        }, 300);
                    }
                }
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentFacingMode = cameraSelect.value;
            currentMode = modeSelect.value;

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerCamera', currentFacingMode);
            localStorage.setItem('stealthScannerMode', currentMode);

            settingsModal.style.display = 'none';
            
            resultText.innerText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            
            stopCamera();
        });

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            isProcessing = false;
        }

        async function startSystem() {
            if (scanIntervalId) return;
            
            try {
                if (!ocrWorker) {
                    ocrWorker = await Tesseract.createWorker('eng');
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;
                
                scanIntervalId = setInterval(processFrame, 4000);
            } catch (err) {
                console.error(err);
            }
        }

        async function processFrame() {
            if (!video.videoWidth || isProcessing) return;
            isProcessing = true;

            const scale = 480 / video.videoWidth;
            canvas.width = 480;
            canvas.height = video.videoHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            try {
                const { data } = await ocrWorker.recognize(canvas);
                
                if (data.text.trim().length > 3) {
                    if (currentMode === 'ocr') {
                        const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                        await sendToCloudVision(base64Image);
                    } else if (currentMode === 'peek') {
                        let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                        
                        data.lines.forEach(line => {
                            if (line.text.trim().length > 0) {
                                if (line.bbox.x0 < minX) minX = line.bbox.x0;
                                if (line.bbox.y0 < minY) minY = line.bbox.y0;
                                if (line.bbox.x1 > maxX) maxX = line.bbox.x1;
                                if (line.bbox.y1 > maxY) maxY = line.bbox.y1;
                            }
                        });

                        const pad = 15;
                        minX = Math.max(0, minX - pad);
                        minY = Math.max(0, minY - pad);
                        maxX = Math.min(canvas.width, maxX + pad);
                        maxY = Math.min(canvas.height, maxY + pad);

                        const w = maxX - minX;
                        const h = maxY - minY;

                        if (w > 0 && h > 0) {
                            const cropCanvas = document.createElement('canvas');
                            cropCanvas.width = w;
                            cropCanvas.height = h;
                            const cropCtx = cropCanvas.getContext('2d');
                            cropCtx.drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
                            peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.9);
                        }
                    }
                }
            } catch (err) {
                console.error(err);
            }
            
            isProcessing = false;
        }

        async function sendToCloudVision(base64String) {
            if (!visionApiKey) return;

            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0].fullTextAnnotation) {
                    resultText.innerText = data.responses[0].fullTextAnnotation.text;
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
