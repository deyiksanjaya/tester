<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mentalist Tool - Progressive Anagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
        }
    </style>
</head>
<body class="bg-black text-gray-300 h-screen w-screen overflow-hidden select-none touch-none">

    <div class="h-full w-full flex flex-col items-center justify-between py-[15vh]">
        <!-- Area Rahasia Atas: Stealth Tap untuk Filter Panjang Kata -->
        <div id="top-stealth-zone" class="w-full h-[12vh] fixed top-0 left-0 z-50 cursor-pointer"></div>

        <div id="display-text" class="text-6xl md:text-8xl font-light tracking-[0.2em] text-center px-4 uppercase transition-opacity duration-200 my-auto">
            <!-- Teks dimuat dinamis -->
        </div>

        <div class="flex flex-col items-center gap-1">
            <div id="debug-info" class="text-xs text-gray-800 tracking-widest uppercase transition-opacity duration-200">
                <!-- Status Sisa & Panjang Kata -->
            </div>
            <div id="db-name" class="text-[10px] text-gray-800 tracking-[0.3em] uppercase transition-opacity duration-200">
                <!-- Nama DB -->
            </div>
        </div>
    </div>

    <script>
        const dbList = [
            { name: "Kota Indonesia", file: "city_indonesia.lst" },
            { name: "Negara", file: "nation_database.lst" },
            { name: "Provinsi Indonesia", file: "provinsi_indonesia.lst" }
        ];

        let currentDbIndex = 0;
        let rawWordDatabase = []; // { word: string, mask: number, length: number }
        let possibleWords = [];
        
        let yesMask = 0;
        let noMask = 0;
        let askedMask = 0;
        let selectedLength = 0; // 0 = Semua Panjang Kata

        let currentTargetBit = -1;
        let isGameOver = false;

        const displayEl = document.getElementById('display-text');
        const debugEl = document.getElementById('debug-info');
        const dbNameEl = document.getElementById('db-name');
        const topStealthEl = document.getElementById('top-stealth-zone');

        const VOWEL_MASK = (1 << 0) | (1 << 4) | (1 << 8) | (1 << 14) | (1 << 20); // A, E, I, O, U

        async function loadDatabase(index) {
            const dbInfo = dbList[index];
            displayEl.style.opacity = 0;
            dbNameEl.textContent = `MEMUAT ${dbInfo.name}...`;
            
            try {
                const response = await fetch(`database/${dbInfo.file}`);
                if (!response.ok) throw new Error("File tidak ditemukan");
                
                const text = await response.text();
                const rawWords = text.split('\n');
                const uniqueSet = new Set();
                rawWordDatabase = [];

                for (let i = 0; i < rawWords.length; i++) {
                    const cleanWord = rawWords[i].trim().toUpperCase();
                    if (!cleanWord || uniqueSet.has(cleanWord)) continue;
                    uniqueSet.add(cleanWord);

                    let mask = 0;
                    let letterCount = 0;
                    for (let j = 0; j < cleanWord.length; j++) {
                        const code = cleanWord.charCodeAt(j);
                        if (code >= 65 && code <= 90) { // A-Z
                            mask |= (1 << (code - 65));
                            letterCount++;
                        }
                    }

                    if (mask > 0) {
                        rawWordDatabase.push({ 
                            word: cleanWord, 
                            mask: mask,
                            length: cleanWord.replace(/[^A-Z]/g, '').length 
                        });
                    }
                }
                
                dbNameEl.textContent = `DB: ${dbInfo.name}`;
                initGame();
            } catch (error) {
                displayEl.textContent = "ERR";
                displayEl.style.opacity = 1;
                displayEl.classList.remove('text-gray-300', 'text-green-500');
                displayEl.classList.add('text-red-900');
                dbNameEl.textContent = `GAGAL: database/${dbInfo.file}`;
                console.error("Error database:", error);
            }
        }

        function initGame() {
            yesMask = 0;
            noMask = 0;
            askedMask = 0;
            isGameOver = false;
            filterPossibleWords();
        }

        function filterPossibleWords() {
            possibleWords = rawWordDatabase.filter(item => {
                // Filter berdasarkan jawaban YA
                if ((item.mask & yesMask) !== yesMask) return false;
                // Filter berdasarkan jawaban TIDAK
                if ((item.mask & noMask) !== 0) return false;
                // Filter berdasarkan Panjang Kata Rahasia
                if (selectedLength > 0 && item.length !== selectedLength) return false;
                return true;
            });

            updateGameState();
        }

        function calculateNextBestLetterBit() {
            const total = possibleWords.length;
            if (total <= 1) return -1;

            // Cek apakah semua sisa kata memiliki bitmask huruf yang IDENTIK
            const firstMask = possibleWords[0].mask;
            let allIdentical = true;
            for (let i = 1; i < total; i++) {
                if (possibleWords[i].mask !== firstMask) {
                    allIdentical = false;
                    break;
                }
            }
            // Jika semua sisa kata hurufnya identik, tidak ada pertanyaan yang bisa memisahkan lagi!
            if (allIdentical) return -1;

            // Hitung kandidat huruf yang tersedia
            const candidateBits = [];
            for (let b = 0; b < 26; b++) {
                if ((askedMask & (1 << b)) === 0) {
                    let count = 0;
                    for (let i = 0; i < total; i++) {
                        if (possibleWords[i].mask & (1 << b)) count++;
                    }
                    if (count > 0 && count < total) {
                        candidateBits.push({ bit: b, count: count });
                    }
                }
            }

            if (candidateBits.length === 0) return -1;

            // Lookahead 2-Langkah (Minimax): Cari huruf yang membuat cabang terburuk (worst-case branch) sekecil mungkin
            let bestBit = -1;
            let bestScore = Infinity;

            for (let i = 0; i < candidateBits.length; i++) {
                const b = candidateBits[i].bit;
                const yesCount = candidateBits[i].count;
                const noCount = total - yesCount;

                // Evaluasi cabang terburuk (Max of Yes vs No branch size)
                const worstBranchSize = Math.max(yesCount, noCount);
                
                // Bobot penyeimbang untuk memperhitungkan split ideal 50/50 & Vokal
                let score = worstBranchSize;
                
                // Beri sedikit keunggulan psikologis pada vokal jika nilainya setara
                if ((VOWEL_MASK & (1 << b)) !== 0) {
                    score -= 0.1;
                }

                if (score < bestScore) {
                    bestScore = score;
                    bestBit = b;
                }
            }

            return bestBit; 
        }

        function updateGameState() {
            if (possibleWords.length === 0) {
                displayEl.textContent = "ERR";
                displayEl.classList.remove('text-green-500', 'font-bold');
                displayEl.classList.add('text-red-900', 'font-light');
                isGameOver = true;
                return;
            }

            currentTargetBit = calculateNextBestLetterBit();

            displayEl.style.opacity = 0;
            
            setTimeout(() => {
                if (currentTargetBit === -1 || possibleWords.length === 1) {
                    // Sisa kata ditemukan atau tidak ada pertanyaan membedakan lagi
                    const results = possibleWords.map(w => w.word);
                    displayEl.textContent = results.join(' / ');
                    displayEl.classList.add('text-green-500', 'font-bold');
                    displayEl.classList.remove('text-gray-300', 'font-light');
                    isGameOver = true;
                } else {
                    const letterStr = String.fromCharCode(65 + currentTargetBit);
                    displayEl.textContent = letterStr;
                    displayEl.classList.remove('text-green-500', 'font-bold');
                    displayEl.classList.add('text-gray-300', 'font-light');
                }
                displayEl.style.opacity = 1;

                // Informasi Rahasia untuk Mentalis (Sisa Kata & Filter Panjang)
                const lenText = selectedLength > 0 ? ` | P:${selectedLength}` : '';
                debugEl.textContent = `SISA: ${possibleWords.length}${lenText}`;
            }, 100);
        }

        function handleAnswer(isYes) {
            if (currentTargetBit === -1) return;

            const bitFlag = (1 << currentTargetBit);
            askedMask |= bitFlag;

            if (isYes) {
                yesMask |= bitFlag;
            } else {
                noMask |= bitFlag;
            }

            filterPossibleWords();
        }

        function processInput(isYes) {
            if (isGameOver) {
                initGame();
                return;
            }
            handleAnswer(isYes);
        }

        function handleDatabaseChange(direction) {
            currentDbIndex += direction;
            if (currentDbIndex >= dbList.length) currentDbIndex = 0;
            if (currentDbIndex < 0) currentDbIndex = dbList.length - 1;
            selectedLength = 0; // Reset filter panjang saat ganti DB
            loadDatabase(currentDbIndex);
        }

        // --- INPUT STEALTH REGION (TAP ATAS UNTUK FILTER PANJANG KATA) ---
        topStealthEl.addEventListener('click', (e) => {
            e.stopPropagation(); // Mencegah terdeteksi sebagai Klik Biasa
            // Siklus panjang kata: ALL -> 3 -> 4 -> 5 -> 6 -> 7 -> 8 -> 9 -> 10 -> ALL
            if (selectedLength === 0) selectedLength = 3;
            else if (selectedLength < 10) selectedLength++;
            else selectedLength = 0;

            filterPossibleWords();
        });

        // --- INPUT MOUSE ---
        document.addEventListener('click', (e) => {
            if (e.target === topStealthEl) return;
            if (e.button === 0) processInput(true); // Klik Kiri = YA
        });

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            processInput(false); // Klik Kanan = TIDAK
        });

        // --- INPUT TOUCH (SWIPE) ---
        let touchStartX = 0;
        let touchStartY = 0;
        let isProcessingTouch = false;
        const SWIPE_THRESHOLD = 30;

        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (isProcessingTouch) return;

            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;

            let deltaX = touchEndX - touchStartX;
            let deltaY = touchEndY - touchStartY;

            // Jika tap biasa di area stealth atas
            if (touchStartY < window.innerHeight * 0.12 && Math.abs(deltaX) < SWIPE_THRESHOLD && Math.abs(deltaY) < SWIPE_THRESHOLD) {
                if (selectedLength === 0) selectedLength = 3;
                else if (selectedLength < 10) selectedLength++;
                else selectedLength = 0;

                filterPossibleWords();
                return;
            }

            if (Math.abs(deltaX) < SWIPE_THRESHOLD && Math.abs(deltaY) < SWIPE_THRESHOLD) {
                if (isGameOver) initGame();
                return;
            }

            isProcessingTouch = true;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 0) {
                    handleDatabaseChange(1);  // Swipe Kanan
                } else {
                    handleDatabaseChange(-1); // Swipe Kiri
                }
            } else {
                if (deltaY > 0) {
                    processInput(true);  // Swipe Bawah = YA
                } else {
                    processInput(false); // Swipe Atas = TIDAK
                }
            }

            setTimeout(() => { isProcessingTouch = false; }, 150);
        }, { passive: false });

        document.addEventListener('DOMContentLoaded', () => {
            loadDatabase(currentDbIndex);
        });
    </script>
</body>
</html>
