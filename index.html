<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mentalist Tool - Most Hits Anagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
            touch-action: none; /* Mencegah pull-to-refresh & scroll */
            background-color: #000; 
        }
    </style>
</head>
<body class="text-gray-300 h-screen w-screen overflow-hidden select-none" oncontextmenu="return false;">

    <div class="h-full w-full flex flex-col items-center justify-between py-[10vh] px-4 relative">
        
        <!-- Area Sentuh Tersembunyi untuk UNDO / RESET (Pojok Atas) -->
        <div id="btn-undo" class="absolute top-0 left-0 w-24 h-24 z-50"></div>
        <div id="btn-reset" class="absolute top-0 right-0 w-24 h-24 z-50"></div>

        <!-- Teks Utama -->
        <div id="display-text" class="text-6xl md:text-8xl font-light tracking-[0.2em] text-center uppercase transition-opacity duration-200 my-auto break-words max-w-full leading-tight select-none">
            <!-- Kosong di awal agar aman -->
        </div>

        <!-- Panel Informasi & Navigasi Database di Bawah -->
        <div class="flex items-center justify-center gap-4 z-50 w-full mb-4 text-[#555] font-bold">
            <!-- Tombol Kiri (Sebelumnya) -->
            <div id="btn-prev" class="p-4 text-2xl cursor-pointer select-none">&lt;</div>
            
            <!-- Teks Informasi -->
            <div class="flex flex-col items-center gap-1 min-w-[150px]">
                <div id="debug-info" class="text-[10px] tracking-widest uppercase transition-opacity duration-200 select-none">
                    <!-- Status Sisa Kata -->
                </div>
                <div id="db-name" class="text-[10px] tracking-[0.2em] uppercase transition-opacity duration-200 select-none">
                    <!-- Nama Database -->
                </div>
            </div>

            <!-- Tombol Kanan (Selanjutnya) -->
            <div id="btn-next" class="p-4 text-2xl cursor-pointer select-none">&gt;</div>
        </div>
    </div>

    <script>
        const dbList = [
            { name: "Provinsi Indonesia", file: "provinsi_indonesia.lst" },
            { name: "Kota Indonesia", file: "city_indonesia.lst" },
            { name: "Negara", file: "nation_database.lst" }
        ];

        const VOWEL_MASK = (1 << 0) | (1 << 4) | (1 << 8) | (1 << 14) | (1 << 20); // A, E, I, O, U
        
        let currentDbIndex = 0;
        let rawWordDatabase = []; 
        let possibleWords = [];
        
        let yesMask = 0;
        let noMask = 0;
        let askedMask = 0;
        let selectedLength = 0;
        let selectedWordCount = 0;
        let currentTargetBit = -1;
        let historyStack = [];

        const GAME_STATE = { INIT_WORD: 0, INIT_LENGTH: 1, PENDING_CLOCK: 2, PLAYING: 3, GAMEOVER: 4 };
        let currentState = GAME_STATE.INIT_WORD;
        let clockFirstArea = null;

        const displayEl = document.getElementById('display-text');
        const debugEl = document.getElementById('debug-info');
        const dbNameEl = document.getElementById('db-name');

        async function loadDatabase(index) {
            const dbInfo = dbList[index];
            displayEl.textContent = "";
            dbNameEl.textContent = dbInfo.name;
            
            try {
                const response = await fetch(`database/${dbInfo.file}`);
                if (!response.ok) throw new Error("File tidak ditemukan");
                
                const text = await response.text();
                const rawWords = text.split('\n');
                const uniqueSet = new Set();
                rawWordDatabase = [];

                for (let i = 0; i < rawWords.length; i++) {
                    const originalWord = rawWords[i].trim().toUpperCase();
                    if (!originalWord) continue;

                    const wordsArray = originalWord.split(/\s+/);
                    const wCount = wordsArray.length;
                    
                    // Untuk MASK (scan SEMUA huruf dalam seluruh kata)
                    const justLetters = originalWord.replace(/[^A-Z]/g, '');
                    
                    // Untuk PANJANG KATA (hanya hitung huruf KATA PERTAMA saja)
                    const firstWordLetters = wordsArray[0].replace(/[^A-Z]/g, '');
                    
                    if (!justLetters || uniqueSet.has(originalWord)) continue;
                    uniqueSet.add(originalWord);

                    let mask = 0;
                    for (let j = 0; j < justLetters.length; j++) {
                        const code = justLetters.charCodeAt(j);
                        if (code >= 65 && code <= 90) mask |= (1 << (code - 65));
                    }

                    rawWordDatabase.push({ 
                        word: originalWord, 
                        mask: mask,
                        length: firstWordLetters.length, // Ubah ke length kata pertama
                        wCount: wCount
                    });
                }
                
                fullReset(); 
            } catch (error) {
                displayEl.textContent = "ERR";
                dbNameEl.textContent = `GAGAL: database/${dbInfo.file}`;
            }
        }

        function fullReset() {
            yesMask = 0;
            noMask = 0;
            askedMask = 0;
            selectedLength = 0;
            selectedWordCount = 0;
            historyStack = [];
            clockFirstArea = null;
            currentState = GAME_STATE.INIT_WORD;
            
            // Visual Panduan Tipe Kata
            displayEl.className = "text-3xl md:text-5xl font-light tracking-widest text-center uppercase transition-opacity duration-200 my-auto text-[#555] select-none";
            displayEl.innerHTML = "TIPE KATA?<br><span class='text-sm md:text-lg mt-4 block text-[#444]'>(&uarr;: 1 Kata | &darr;: Multi | Click: Bebas)</span>";
            
            debugEl.textContent = "READY";
            dbNameEl.textContent = dbList[currentDbIndex].name;
        }

        function promptLength() {
            currentState = GAME_STATE.INIT_LENGTH;
            displayEl.className = "text-3xl md:text-5xl font-light tracking-widest text-center uppercase transition-opacity duration-200 my-auto text-[#555] select-none";
            
            if (selectedWordCount === 2) {
                // Notifikasi visual spesifik untuk multi kata agar input kata pertama
                displayEl.innerHTML = "PANJANG KATA<br><span class='text-white font-bold tracking-widest'>PERTAMA?</span><br><span class='text-sm md:text-lg mt-4 block text-[#444]'>(Ketik Angka / Swipe Jam)</span>";
            } else {
                displayEl.innerHTML = "PANJANG KATA?<br><span class='text-sm md:text-lg mt-4 block text-[#444]'>(Ketik Angka / Swipe Jam)</span>";
            }
        }

        function startGameFromInit() {
            currentState = GAME_STATE.PLAYING;
            filterPossibleWords();
        }

        function calculateNextBestLetterBit() {
            if (possibleWords.length <= 1) return -1;
            
            let bestBit = -1;
            let maxMatches = -1;

            for (let bit = 0; bit < 26; bit++) {
                const bitFlag = (1 << bit);
                
                if ((askedMask & bitFlag) !== 0) continue;

                let matches = 0;
                for (let i = 0; i < possibleWords.length; i++) {
                    if ((possibleWords[i].mask & bitFlag) !== 0) {
                        matches++;
                    }
                }

                if (matches === 0 || matches === possibleWords.length) continue;

                if (matches > maxMatches) {
                    maxMatches = matches;
                    bestBit = bit;
                }
            }
            return bestBit;
        }

        function filterPossibleWords() {
            possibleWords = rawWordDatabase.filter(item => {
                if ((item.mask & yesMask) !== yesMask) return false;
                if ((item.mask & noMask) !== 0) return false;
                if (selectedLength > 0 && item.length !== selectedLength) return false;
                if (selectedWordCount === 1 && item.wCount > 1) return false;
                if (selectedWordCount === 2 && item.wCount === 1) return false;
                return true;
            });
            updateGameState();
        }

        function updateGameState() {
            if (possibleWords.length === 0) {
                displayEl.innerHTML = "ERR";
                displayEl.className = "text-6xl font-bold text-red-900 text-center uppercase my-auto";
                currentState = GAME_STATE.GAMEOVER;
                return;
            }

            currentTargetBit = calculateNextBestLetterBit();
            
            if (currentTargetBit === -1 || possibleWords.length === 1) {
                currentState = GAME_STATE.GAMEOVER;
                displayEl.innerHTML = ""; 
                displayEl.className = "flex flex-col items-center justify-center w-full my-auto select-none";

                const mainWord = possibleWords[0].word;
                const mainDiv = document.createElement('div');
                mainDiv.className = "font-bold text-center uppercase text-[#0f0] break-words max-w-full px-2";
                
                const len = mainWord.length;
                if (len <= 8) mainDiv.classList.add('text-6xl', 'md:text-8xl', 'tracking-[0.1em]', 'leading-tight');
                else if (len <= 15) mainDiv.classList.add('text-4xl', 'md:text-6xl', 'tracking-normal', 'leading-snug');
                else mainDiv.classList.add('text-3xl', 'md:text-5xl', 'tracking-normal', 'leading-snug');
                
                mainDiv.textContent = mainWord;
                displayEl.appendChild(mainDiv);

                if (possibleWords.length > 1) {
                    const altDiv = document.createElement('div');
                    altDiv.className = "mt-6 md:mt-8 flex flex-col items-center gap-2 text-[#555] font-bold text-2xl md:text-4xl uppercase tracking-widest text-center";
                    
                    const maxAlts = Math.min(possibleWords.length, 5);
                    for (let i = 1; i < maxAlts; i++) {
                        const p = document.createElement('div');
                        p.textContent = possibleWords[i].word;
                        altDiv.appendChild(p);
                    }
                    
                    if (possibleWords.length > 5) {
                        const pMore = document.createElement('div');
                        pMore.className = "text-lg text-[#333] mt-2 tracking-normal";
                        pMore.textContent = `+${possibleWords.length - 5} lainnya...`;
                        altDiv.appendChild(pMore);
                    }

                    displayEl.appendChild(altDiv);
                }
            } else {
                const letterStr = String.fromCharCode(65 + currentTargetBit);
                displayEl.innerHTML = "";
                displayEl.className = "text-6xl md:text-8xl font-light tracking-[0.2em] text-center uppercase transition-opacity duration-200 my-auto text-gray-300";
                displayEl.textContent = letterStr;
            }

            let lenText = '';
            if (selectedWordCount === 1) lenText += ' | 1K';
            if (selectedWordCount === 2) lenText += ' | MK';
            if (selectedLength > 0) lenText += ` | P1:${selectedLength}`;
            
            debugEl.textContent = `SISA: ${possibleWords.length}${lenText}`;
        }

        function processInput(isYes) {
            if (currentTargetBit === -1) return;
            historyStack.push({ yesMask, noMask, askedMask });
            const bitFlag = (1 << currentTargetBit);
            askedMask |= bitFlag;
            if (isYes) yesMask |= bitFlag;
            else noMask |= bitFlag;
            filterPossibleWords();
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;
            const last = historyStack.pop();
            yesMask = last.yesMask;
            noMask = last.noMask;
            askedMask = last.askedMask;
            currentState = GAME_STATE.PLAYING;
            filterPossibleWords();
        }

        function handleDatabaseChange(direction) {
            currentDbIndex += direction;
            if (currentDbIndex >= dbList.length) currentDbIndex = 0;
            if (currentDbIndex < 0) currentDbIndex = dbList.length - 1;
            loadDatabase(currentDbIndex);
        }

        function resolveClockNumber(area, swipe2) {
            if (area === 'UP') {
                if (swipe2 === 'LEFT') return 11;
                if (swipe2 === 'UP') return 12;
                if (swipe2 === 'RIGHT') return 1;
            } else if (area === 'RIGHT') {
                if (swipe2 === 'UP') return 2;
                if (swipe2 === 'RIGHT') return 3;
                if (swipe2 === 'DOWN') return 4;
            } else if (area === 'DOWN') {
                if (swipe2 === 'RIGHT') return 5;
                if (swipe2 === 'DOWN') return 6;
                if (swipe2 === 'LEFT') return 7;
            } else if (area === 'LEFT') {
                if (swipe2 === 'DOWN') return 8;
                if (swipe2 === 'LEFT') return 9;
                if (swipe2 === 'UP') return 10;
            }
            return -1; 
        }

        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        function triggerPrev(e) { e.preventDefault(); e.stopPropagation(); handleDatabaseChange(-1); }
        function triggerNext(e) { e.preventDefault(); e.stopPropagation(); handleDatabaseChange(1); }
        btnPrev.addEventListener('touchstart', triggerPrev, {passive: false});
        btnPrev.addEventListener('mousedown', triggerPrev);
        btnNext.addEventListener('touchstart', triggerNext, {passive: false});
        btnNext.addEventListener('mousedown', triggerNext);

        document.getElementById('btn-undo').addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            if(currentState === GAME_STATE.PLAYING) undoLastAction();
        }, {passive: false});

        document.getElementById('btn-reset').addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            fullReset();
        }, {passive: false});

        let touchStartX = 0;
        let touchStartY = 0;
        const SWIPE_THRESHOLD = 35;

        document.addEventListener('touchstart', (e) => {
            if(['btn-undo', 'btn-reset', 'btn-prev', 'btn-next'].includes(e.target.id)) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if(['btn-undo', 'btn-reset', 'btn-prev', 'btn-next'].includes(e.target.id)) return;
            
            const endX = e.changedTouches[0].screenX;
            const endY = e.changedTouches[0].screenY;
            const deltaX = endX - touchStartX;
            const deltaY = endY - touchStartY;
            
            const isSwipe = Math.max(Math.abs(deltaX), Math.abs(deltaY)) > SWIPE_THRESHOLD;
            
            let swipeDir = null;
            if (isSwipe) {
                if (Math.abs(deltaX) > Math.abs(deltaY)) swipeDir = deltaX > 0 ? 'RIGHT' : 'LEFT';
                else swipeDir = deltaY > 0 ? 'DOWN' : 'UP';
            }

            if (currentState === GAME_STATE.INIT_WORD) {
                if (isSwipe) {
                    if (swipeDir === 'UP') {
                        selectedWordCount = 1;
                        debugEl.textContent = "1 KATA";
                        promptLength();
                    } else if (swipeDir === 'DOWN') {
                        selectedWordCount = 2;
                        debugEl.textContent = "MULTI KATA";
                        promptLength();
                    }
                } else {
                    selectedWordCount = 0;
                    debugEl.textContent = "KATA BEBAS";
                    promptLength();
                }
                return;
            }

            if (currentState === GAME_STATE.INIT_LENGTH) {
                if (isSwipe) {
                    clockFirstArea = swipeDir; 
                    currentState = GAME_STATE.PENDING_CLOCK;
                    debugEl.textContent = `JAM: ${swipeDir}`; 
                    
                    // Indikator visual swipe jam ke-1
                    displayEl.innerHTML = `<span class='text-[#555]'>JAM:<br></span><span class='text-white'>${swipeDir}</span><br><span class='text-sm md:text-lg mt-4 block text-[#444]'>(Tunggu Swipe ke-2)</span>`;
                } else {
                    selectedLength = 0; 
                    startGameFromInit(); 
                }
                return;
            }

            if (currentState === GAME_STATE.PENDING_CLOCK) {
                if (isSwipe) {
                    const num = resolveClockNumber(clockFirstArea, swipeDir);
                    selectedLength = num > 0 ? num : 0;
                } else {
                    selectedLength = 0; 
                }
                startGameFromInit();
                return;
            }

            if (currentState === GAME_STATE.PLAYING) {
                if (isSwipe) {
                    if (swipeDir === 'DOWN') processInput(true); 
                    else if (swipeDir === 'UP') processInput(false); 
                }
                return;
            }

            if (currentState === GAME_STATE.GAMEOVER) {
                fullReset();
            }
        }, { passive: false });

        document.addEventListener('mousedown', (e) => {
            if(['btn-undo', 'btn-reset', 'btn-prev', 'btn-next'].includes(e.target.id)) return;
            if (e.button !== 0 && e.button !== 2) return; 
            
            if (currentState === GAME_STATE.PLAYING) {
                if (e.button === 0) processInput(true); 
                else if (e.button === 2) processInput(false); 
            } else if (currentState === GAME_STATE.GAMEOVER) {
                fullReset();
            } else if (currentState === GAME_STATE.INIT_WORD) {
                selectedWordCount = 0;
                debugEl.textContent = "KATA BEBAS";
                promptLength();
            } else if (currentState === GAME_STATE.INIT_LENGTH) {
                selectedLength = 0; 
                startGameFromInit();
            }
        });

        let keyBuffer = '';
        let keyTimeout = null;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { handleDatabaseChange(-1); return; }
            if (e.key === 'ArrowRight') { handleDatabaseChange(1); return; }

            if (currentState === GAME_STATE.PLAYING) {
                if (e.key === 'ArrowDown') { processInput(true); return; }
                if (e.key === 'ArrowUp') { processInput(false); return; }
            }

            if (currentState === GAME_STATE.INIT_WORD) {
                if (e.key === 'ArrowUp') { 
                    selectedWordCount = 1; 
                    debugEl.textContent = "1 KATA"; 
                    promptLength();
                    return; 
                }
                if (e.key === 'ArrowDown') { 
                    selectedWordCount = 2; 
                    debugEl.textContent = "MULTI KATA"; 
                    promptLength();
                    return; 
                }
                if (e.key === 'Enter' || e.key === ' ') {
                    selectedWordCount = 0;
                    debugEl.textContent = "KATA BEBAS";
                    promptLength();
                    return;
                }
            }

            if (e.key >= '0' && e.key <= '9') {
                if (currentState === GAME_STATE.INIT_WORD || currentState === GAME_STATE.INIT_LENGTH || currentState === GAME_STATE.GAMEOVER) {
                    if (currentState === GAME_STATE.GAMEOVER) fullReset();
                    
                    if (currentState === GAME_STATE.INIT_WORD) {
                        selectedWordCount = 0;
                        currentState = GAME_STATE.INIT_LENGTH;
                    }
                    
                    keyBuffer += e.key;
                    clearTimeout(keyTimeout);
                    
                    // Tampilkan angka yang sedang diketik di layar dengan jelas
                    displayEl.className = "text-6xl md:text-8xl font-light tracking-[0.2em] text-center uppercase transition-opacity duration-200 my-auto text-white";
                    displayEl.textContent = keyBuffer;
                    
                    keyTimeout = setTimeout(() => {
                        selectedLength = parseInt(keyBuffer, 10);
                        keyBuffer = '';
                        startGameFromInit();
                    }, 500);
                }
                return;
            }

            if (e.key === 'Enter' && keyBuffer.length > 0) {
                clearTimeout(keyTimeout);
                selectedLength = parseInt(keyBuffer, 10);
                keyBuffer = '';
                startGameFromInit();
                return;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadDatabase(currentDbIndex);
        });
    </script>
</body>
</html>
