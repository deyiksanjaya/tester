<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web OCR</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan Lucide Icons untuk ikon web -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Animasi loading kustom */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Sembunyikan scrollbar untuk area hasil */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex items-center justify-center font-sans text-slate-800">

    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <i data-lucide="scan-line" class="w-12 h-12 mx-auto mb-2 opacity-90"></i>
            <h1 class="text-2xl font-bold">Ekstraksi Teks (OCR)</h1>
            <p class="text-blue-100 text-sm mt-1">Ubah gambar menjadi teks dalam hitungan detik</p>
        </div>

        <div class="p-6 space-y-5">
            
            <!-- Pengaturan API & Bahasa -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">API Key</label>
                    <input type="text" id="apiKey" value="helloworld" class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan API Key">
                    <p class="text-[10px] text-slate-400 mt-1">*helloworld untuk uji coba</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Bahasa Dokumen</label>
                    <select id="language" class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="eng">Inggris (eng)</option>
                        <option value="ind">Indonesia (ind)</option>
                    </select>
                </div>
            </div>

            <!-- Area Upload -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-2">Pilih Gambar</label>
                <div id="uploadArea" class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition cursor-pointer flex flex-col items-center justify-center relative overflow-hidden" onclick="document.getElementById('imageInput').click()">
                    
                    <!-- Input File Asli (Disembunyikan) -->
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                    
                    <!-- State Belum Ada Gambar -->
                    <div id="uploadState" class="flex flex-col items-center">
                        <i data-lucide="image-plus" class="w-10 h-10 text-slate-400 mb-2"></i>
                        <span class="text-sm font-medium text-slate-600">Klik untuk memilih gambar</span>
                        <span class="text-xs text-slate-400 mt-1">Maksimal 5MB (JPG/PNG)</span>
                    </div>

                    <!-- State Preview Gambar -->
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-contain bg-slate-100" />
                    
                    <!-- Tombol Hapus Gambar -->
                    <button id="removeImageBtn" class="hidden absolute top-2 right-2 bg-red-500 text-white p-1.5 rounded-full hover:bg-red-600 shadow-md transition" onclick="removeImage(event)" title="Hapus Gambar">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Proses -->
            <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 disabled:bg-slate-300 disabled:cursor-not-allowed" disabled onclick="processOCR()">
                <i data-lucide="zap" class="w-5 h-5"></i>
                <span id="btnText">Mulai Ekstraksi</span>
                <span id="loadingIcon" class="loader hidden"></span>
            </button>

            <!-- Pesan Status -->
            <div id="statusMessage" class="hidden p-3 rounded-lg text-sm text-center"></div>

            <!-- Area Hasil -->
            <div id="resultContainer" class="hidden flex flex-col space-y-2 border-t pt-4 mt-2">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-700">Hasil Teks:</label>
                    <button onclick="copyToClipboard()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 py-1 px-3 rounded-lg flex items-center gap-1 transition">
                        <i data-lucide="copy" class="w-3 h-3"></i> Salin
                    </button>
                </div>
                <textarea id="resultText" class="w-full h-32 p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl outline-none resize-none no-scrollbar focus:ring-2 focus:ring-blue-500" readonly></textarea>
            </div>

        </div>
    </div>

    <script>
        // Inisialisasi Ikon
        lucide.createIcons();

        // Variabel Global
        let selectedFile = null;
        
        // Elemen DOM
        const imageInput = document.getElementById('imageInput');
        const uploadState = document.getElementById('uploadState');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const processBtn = document.getElementById('processBtn');
        const btnText = document.getElementById('btnText');
        const loadingIcon = document.getElementById('loadingIcon');
        const statusMessage = document.getElementById('statusMessage');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');

        // Fungsi saat gambar dipilih
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validasi ukuran file (Max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showStatus("Ukuran file terlalu besar! Maksimal 5MB.", "error");
                removeImage(event);
                return;
            }

            selectedFile = file;
            
            // Tampilkan Preview Gambar
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.classList.remove('hidden');
                uploadState.classList.add('hidden');
                removeImageBtn.classList.remove('hidden');
                processBtn.disabled = false;
                hideStatus();
                resultContainer.classList.add('hidden'); // Sembunyikan hasil lama
            }
            reader.readAsDataURL(file);
        }

        // Fungsi menghapus gambar
        function removeImage(event) {
            if (event) event.stopPropagation(); // Mencegah memicu klik pada parent (uploadArea)
            
            selectedFile = null;
            imageInput.value = '';
            imagePreview.src = '';
            
            imagePreview.classList.add('hidden');
            uploadState.classList.remove('hidden');
            removeImageBtn.classList.add('hidden');
            processBtn.disabled = true;
            resultContainer.classList.add('hidden');
            hideStatus();
        }

        // Fungsi Proses API OCR
        async function processOCR() {
            if (!selectedFile) return;

            const apiKey = document.getElementById('apiKey').value || 'helloworld';
            const language = document.getElementById('language').value;

            // Menyiapkan UI untuk state loading
            setLoadingState(true);
            hideStatus();
            resultContainer.classList.add('hidden');

            // Menyiapkan Data Form
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('apikey', apiKey);
            formData.append('language', language);
            formData.append('isTable', 'true'); // Membantu membaca format yang terstruktur

            try {
                // Request ke API OCR.space
                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.IsErroredOnProcessing || data.OCRExitCode !== 1) {
                    // API mengembalikan error
                    const errorMsg = data.ErrorMessage ? data.ErrorMessage.join(', ') : 'Gagal memproses gambar.';
                    showStatus(`Error: ${errorMsg}`, "error");
                } else {
                    // Sukses
                    const parsedText = data.ParsedResults[0].ParsedText;
                    if (parsedText.trim() === '') {
                        showStatus("Proses berhasil, tetapi tidak ada teks yang terdeteksi pada gambar.", "warning");
                    } else {
                        showStatus("Ekstraksi teks berhasil!", "success");
                        resultText.value = parsedText;
                        resultContainer.classList.remove('hidden');
                    }
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                showStatus("Gagal terhubung ke server. Periksa koneksi internet Anda.", "error");
            } finally {
                setLoadingState(false);
            }
        }

        // Fungsi menyalin teks ke clipboard
        function copyToClipboard() {
            resultText.select();
            document.execCommand('copy');
            
            // Feedback visual sementara
            const originalText = resultText.value;
            showStatus("Teks berhasil disalin!", "success");
            setTimeout(() => hideStatus(), 3000);
            
            // Hapus seleksi
            window.getSelection().removeAllRanges();
        }

        // --- Fungsi Helper UI ---

        function setLoadingState(isLoading) {
            processBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = "Memproses...";
                loadingIcon.classList.remove('hidden');
                document.getElementById('uploadArea').classList.add('opacity-50', 'pointer-events-none');
            } else {
                btnText.textContent = "Mulai Ekstraksi";
                loadingIcon.classList.add('hidden');
                document.getElementById('uploadArea').classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-700');
            
            if (type === 'error') {
                statusMessage.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                statusMessage.classList.add('bg-green-100', 'text-green-700');
            } else if (type === 'warning') {
                statusMessage.classList.add('bg-yellow-100', 'text-yellow-700');
            }
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
        }

    </script>
</body>
</html>
