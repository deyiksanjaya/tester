<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Teks Presisi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Garis Scanner */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #10b981;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            top: 0;
            left: 0;
            animation: scan 2.5s ease-in-out infinite;
            display: none;
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .scanning .scan-line {
            display: block;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Frame kotak fokus biar user tau di mana harus ngepasin tulisan */
        .focus-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen p-4 flex flex-col items-center justify-center font-sans text-slate-800">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-slate-800 p-5 text-white flex items-center justify-between border-b border-slate-700">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="focus" class="w-6 h-6 text-emerald-400"></i>
                    Smart Scanner
                </h1>
                <p class="text-slate-400 text-xs mt-1">Fokus pada teks di latar solid</p>
            </div>
            <select id="language" class="bg-slate-700 text-white text-xs p-2 rounded-lg border border-slate-600 outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="eng">English</option>
                <option value="ind">Indonesia</option>
            </select>
        </div>

        <div class="p-4 space-y-4">
            
            <!-- Area Kamera -->
            <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                <video id="videoElement" class="w-full h-full object-cover hidden" autoplay playsinline></video>
                
                <!-- Overlay Focus Frame & Scanner -->
                <div id="scanOverlay" class="absolute inset-0 pointer-events-none hidden">
                    <div class="focus-frame"></div>
                    <div class="scan-line"></div>
                </div>

                <!-- Pesan Kamera -->
                <div id="cameraMessage" class="absolute text-center text-slate-400 p-4">
                    <i data-lucide="camera" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                    <p class="text-sm font-medium">Kamera belum aktif</p>
                </div>
                
                <!-- Hidden Canvas buat image processing (hitam putih & kontras) -->
                <canvas id="canvasElement" class="hidden"></canvas>
            </div>

            <!-- Kontrol Utama -->
            <button id="toggleCameraBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2" onclick="toggleCamera()">
                <i data-lucide="power" class="w-5 h-5"></i>
                <span id="btnText">Mulai Scan</span>
            </button>

            <!-- Status -->
            <div id="ocrStatus" class="hidden items-center justify-center gap-2 text-sm text-emerald-600 bg-emerald-50 border border-emerald-100 p-2 rounded-lg font-medium transition-all">
                <span id="spinner" class="loader w-4 h-4"></span>
                <span id="statusText">Menyiapkan lensa...</span>
            </div>

            <!-- Area Hasil -->
            <div class="flex flex-col space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-700 flex items-center gap-1">
                        <i data-lucide="text-cursor-input" class="w-4 h-4"></i> Hasil Ekstraksi:
                    </label>
                    <button onclick="copyToClipboard()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 px-3 rounded-lg flex items-center gap-1 transition">
                        <i data-lucide="copy" class="w-3 h-3"></i> Salin
                    </button>
                </div>
                <!-- Pakai textarea biar gampang dicopy -->
                <textarea id="resultText" class="w-full h-32 p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl outline-none resize-none no-scrollbar focus:ring-2 focus:ring-emerald-500 transition-colors" placeholder="Arahkan kotak fokus ke teks yang ada di latar solid. Hasil yang sudah difilter akan muncul di sini..." readonly></textarea>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        let videoStream = null;
        let isScanning = false;
        let isCameraOn = false;

        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const toggleBtn = document.getElementById('toggleCameraBtn');
        const btnText = document.getElementById('btnText');
        const scanOverlay = document.getElementById('scanOverlay');
        const cameraMessage = document.getElementById('cameraMessage');
        const resultText = document.getElementById('resultText');
        const ocrStatus = document.getElementById('ocrStatus');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const languageSelect = document.getElementById('language');

        async function toggleCamera() {
            if (isCameraOn) {
                stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' } // Prioritas kamera belakang
                });
                
                video.srcObject = videoStream;
                video.classList.remove('hidden');
                cameraMessage.classList.add('hidden');
                scanOverlay.classList.remove('hidden');
                
                isCameraOn = true;
                btnText.textContent = "Matikan Scanner";
                toggleBtn.classList.replace('bg-emerald-600', 'bg-red-500');
                toggleBtn.classList.replace('hover:bg-emerald-700', 'hover:bg-red-600');
                
                startScanning();

            } catch (error) {
                console.error("Kamera error:", error);
                alert("Gagal akses kamera. Pastikan izin kamera sudah diberikan.");
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            video.classList.add('hidden');
            cameraMessage.classList.remove('hidden');
            scanOverlay.classList.add('hidden');
            
            isCameraOn = false;
            stopScanning();

            btnText.textContent = "Mulai Scan";
            toggleBtn.classList.replace('bg-red-500', 'bg-emerald-600');
            toggleBtn.classList.replace('hover:bg-red-600', 'hover:bg-emerald-700');
            ocrStatus.classList.add('hidden');
        }

        function startScanning() {
            isScanning = true;
            scanOverlay.classList.add('scanning');
            ocrStatus.classList.remove('hidden');
            updateStatus('Mencari teks yang jelas...', 'loading');
            
            scanLoop();
        }

        function stopScanning() {
            isScanning = false;
            scanOverlay.classList.remove('scanning');
        }

        async function scanLoop() {
            if (!isScanning || !isCameraOn) return;

            if (video.videoWidth === 0) {
                setTimeout(scanLoop, 500);
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // FILTER GAMBAR: Bikin hitam-putih dan naikkan kontras drastis.
            // Ini ngebantu banget ngehilangin noise background dan nebelin teks di latar solid.
            ctx.filter = 'grayscale(100%) contrast(250%) brightness(120%)';
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none'; // Reset filter

            const selectedLang = languageSelect.value;

            try {
                const result = await Tesseract.recognize(canvas, selectedLang);
                
                // FILTER CONFIDENCE: Jangan ambil semua teks!
                // Cuma ambil kata yang AI-nya yakin di atas 65% aja. (Ini ngehilangin karakter ngaco)
                let validWords = [];
                if (result.data && result.data.words) {
                    result.data.words.forEach(word => {
                        if (word.confidence > 65 && word.text.trim().length > 1) {
                            validWords.push(word.text);
                        }
                    });
                }
                
                const cleanText = validWords.join(' ').trim();
                
                if (cleanText.length > 0) {
                    // Cuma update kalau teksnya bener-bener berubah biar nggak kedap-kedip parah
                    if (resultText.value !== cleanText) {
                        resultText.value = cleanText;
                        resultText.classList.add('bg-emerald-50', 'border-emerald-300');
                        setTimeout(() => resultText.classList.remove('bg-emerald-50', 'border-emerald-300'), 500);
                    }
                    updateStatus('Teks terdeteksi!', 'success');
                } else {
                    updateStatus('Mencari teks yang jelas...', 'loading');
                }
            } catch (error) {
                console.error("OCR Error:", error);
            }

            // Timeout scan ditaruh di 800ms biar ngasih napas ke prosesor HP
            if (isScanning) {
                setTimeout(scanLoop, 800);
            }
        }

        // Fungsi buat ngatur UI status
        function updateStatus(message, state) {
            statusText.textContent = message;
            if (state === 'success') {
                spinner.classList.add('hidden');
                ocrStatus.classList.replace('text-slate-600', 'text-emerald-700');
                ocrStatus.classList.replace('bg-slate-50', 'bg-emerald-100');
            } else {
                spinner.classList.remove('hidden');
                ocrStatus.classList.replace('text-emerald-700', 'text-slate-600');
                ocrStatus.classList.replace('bg-emerald-100', 'bg-slate-50');
            }
        }

        function copyToClipboard() {
            if (!resultText.value) return;
            
            resultText.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            
            updateStatus('Teks disalin!', 'success');
            setTimeout(() => {
                if (isScanning) updateStatus('Mencari teks yang jelas...', 'loading');
            }, 2000);
        }

    </script>
</body>
</html>
