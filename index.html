<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mentalist Tool - Most Hits Anagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
            touch-action: none; /* Mencegah pull-to-refresh & scroll */
            background-color: #000; 
        }
    </style>
</head>
<body class="text-gray-300 h-screen w-screen overflow-hidden select-none" oncontextmenu="return false;">

    <div class="h-full w-full flex flex-col items-center justify-between py-[10vh] px-4 relative">
        
        <!-- Area Sentuh Tersembunyi untuk UNDO / RESET (Pojok Atas) -->
        <div id="btn-undo" class="absolute top-0 left-0 w-24 h-24 z-50"></div>
        <div id="btn-reset" class="absolute top-0 right-0 w-24 h-24 z-50"></div>

        <!-- Teks Utama -->
        <div id="display-text" class="text-6xl md:text-8xl font-light tracking-[0.2em] text-center uppercase transition-opacity duration-200 my-auto break-words max-w-full leading-tight select-none">
            <!-- Kosong di awal agar aman -->
        </div>

        <!-- Panel Informasi & Navigasi Database di Bawah -->
        <!-- Warna diubah ke #555 agar lebih mudah dibaca performer tapi tetap stealth -->
        <div class="flex items-center justify-center gap-4 z-50 w-full mb-4 text-[#555] font-bold">
            <!-- Tombol Kiri (Sebelumnya) -->
            <div id="btn-prev" class="p-4 text-2xl cursor-pointer select-none">&lt;</div>
            
            <!-- Teks Informasi -->
            <div class="flex flex-col items-center gap-1 min-w-[150px]">
                <div id="debug-info" class="text-[10px] tracking-widest uppercase transition-opacity duration-200 select-none">
                    <!-- Status Sisa Kata -->
                </div>
                <div id="db-name" class="text-[10px] tracking-[0.2em] uppercase transition-opacity duration-200 select-none">
                    <!-- Nama Database -->
                </div>
            </div>

            <!-- Tombol Kanan (Selanjutnya) -->
            <div id="btn-next" class="p-4 text-2xl cursor-pointer select-none">&gt;</div>
        </div>
    </div>

    <script>
        const dbList = [
            { name: "Provinsi Indonesia", file: "provinsi_indonesia.lst" },
            { name: "Kota Indonesia", file: "city_indonesia.lst" },
            { name: "Negara", file: "nation_database.lst" }
        ];

        const VOWEL_MASK = (1 << 0) | (1 << 4) | (1 << 8) | (1 << 14) | (1 << 20); // A, E, I, O, U
        
        let currentDbIndex = 0;
        let rawWordDatabase = []; 
        let possibleWords = [];
        
        let yesMask = 0;
        let noMask = 0;
        let askedMask = 0;
        let selectedLength = 0;
        let currentTargetBit = -1;
        let historyStack = [];

        const GAME_STATE = { INIT: 0, PENDING_CLOCK: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = GAME_STATE.INIT;
        let clockFirstArea = null;

        const displayEl = document.getElementById('display-text');
        const debugEl = document.getElementById('debug-info');
        const dbNameEl = document.getElementById('db-name');

        async function loadDatabase(index) {
            const dbInfo = dbList[index];
            displayEl.textContent = "";
            dbNameEl.textContent = dbInfo.name;
            
            try {
                const response = await fetch(`database/${dbInfo.file}`);
                if (!response.ok) throw new Error("File tidak ditemukan");
                
                const text = await response.text();
                const rawWords = text.split('\n');
                const uniqueSet = new Set();
                rawWordDatabase = [];

                for (let i = 0; i < rawWords.length; i++) {
                    const cleanWord = rawWords[i].trim().toUpperCase();
                    const justLetters = cleanWord.replace(/[^A-Z]/g, '');
                    if (!justLetters || uniqueSet.has(cleanWord)) continue;
                    uniqueSet.add(cleanWord);

                    let mask = 0;
                    for (let j = 0; j < cleanWord.length; j++) {
                        const code = cleanWord.charCodeAt(j);
                        if (code >= 65 && code <= 90) mask |= (1 << (code - 65));
                    }

                    rawWordDatabase.push({ 
                        word: cleanWord, 
                        mask: mask,
                        length: justLetters.length 
                    });
                }
                
                fullReset(); 
            } catch (error) {
                displayEl.textContent = "ERR";
                dbNameEl.textContent = `GAGAL: database/${dbInfo.file}`;
            }
        }

        function fullReset() {
            yesMask = 0;
            noMask = 0;
            askedMask = 0;
            selectedLength = 0;
            historyStack = [];
            clockFirstArea = null;
            currentState = GAME_STATE.INIT;
            
            displayEl.textContent = ""; 
            debugEl.textContent = "READY";
            dbNameEl.textContent = dbList[currentDbIndex].name;
            
            displayEl.className = "text-6xl md:text-8xl font-light tracking-[0.2em] text-center uppercase transition-opacity duration-200 my-auto text-gray-300 break-words max-w-full leading-tight";
        }

        function startGameFromInit() {
            currentState = GAME_STATE.PLAYING;
            filterPossibleWords();
        }

        function filterPossibleWords() {
            possibleWords = rawWordDatabase.filter(item => {
                if ((item.mask & yesMask) !== yesMask) return false;
                if ((item.mask & noMask) !== 0) return false;
                if (selectedLength > 0 && item.length !== selectedLength) return false;
                return true;
            });
            updateGameState();
        }

        function calculateNextBestLetterBit() {
            const total = possibleWords.length;
            if (total <= 1) return -1;

            const firstMask = possibleWords[0].mask;
            let allIdentical = true;
            for (let i = 1; i < total; i++) {
                if (possibleWords[i].mask !== firstMask) {
                    allIdentical = false; break;
                }
            }
            if (allIdentical) return -1;

            const candidateBits = [];
            for (let b = 0; b < 26; b++) {
                if ((askedMask & (1 << b)) === 0) {
                    let count = 0;
                    for (let i = 0; i < total; i++) {
                        if (possibleWords[i].mask & (1 << b)) count++;
                    }
                    if (count > 0 && count < total) {
                        candidateBits.push({ bit: b, count: count });
                    }
                }
            }

            if (candidateBits.length === 0) return -1;

            let bestBit = -1;
            let bestScore = -1; 

            // ALGORITMA "MOST HITS" (Mencari X terbanyak di G-SPAT The Jerx)
            for (let i = 0; i < candidateBits.length; i++) {
                const b = candidateBits[i].bit;
                const yesCount = candidateBits[i].count;
                
                let score = yesCount; 
                
                // Bonus sangat kecil untuk vokal agar jika seri, vokal diutamakan
                if ((VOWEL_MASK & (1 << b)) !== 0) score += 0.1;

                if (score > bestScore) {
                    bestScore = score;
                    bestBit = b;
                }
            }
            return bestBit; 
        }

        function updateGameState() {
            if (possibleWords.length === 0) {
                displayEl.textContent = "ERR";
                displayEl.className = "text-6xl font-bold text-red-900 text-center uppercase my-auto";
                currentState = GAME_STATE.GAMEOVER;
                return;
            }

            currentTargetBit = calculateNextBestLetterBit();
            
            if (currentTargetBit === -1 || possibleWords.length === 1) {
                const results = possibleWords.map(w => w.word);
                const textToDisplay = results.join(' / ');
                
                displayEl.className = "font-bold text-center uppercase transition-opacity duration-200 my-auto text-[#0f0] break-words max-w-full px-2";
                
                const len = textToDisplay.length;
                if (len <= 8) displayEl.classList.add('text-6xl', 'md:text-8xl', 'tracking-[0.1em]', 'leading-tight');
                else if (len <= 15) displayEl.classList.add('text-4xl', 'md:text-6xl', 'tracking-normal', 'leading-snug');
                else displayEl.classList.add('text-3xl', 'md:text-5xl', 'tracking-normal', 'leading-snug');

                displayEl.textContent = textToDisplay;
                currentState = GAME_STATE.GAMEOVER;
            } else {
                const letterStr = String.fromCharCode(65 + currentTargetBit);
                displayEl.className = "text-6xl md:text-8xl font-light tracking-[0.2em] text-center uppercase transition-opacity duration-200 my-auto text-gray-300";
                displayEl.textContent = letterStr;
            }

            const lenText = selectedLength > 0 ? ` | P:${selectedLength}` : '';
            debugEl.textContent = `SISA: ${possibleWords.length}${lenText}`;
        }

        function processInput(isYes) {
            if (currentTargetBit === -1) return;
            
            historyStack.push({ yesMask, noMask, askedMask });

            const bitFlag = (1 << currentTargetBit);
            askedMask |= bitFlag;
            if (isYes) yesMask |= bitFlag;
            else noMask |= bitFlag;

            filterPossibleWords();
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;
            const last = historyStack.pop();
            yesMask = last.yesMask;
            noMask = last.noMask;
            askedMask = last.askedMask;
            currentState = GAME_STATE.PLAYING;
            filterPossibleWords();
        }

        function handleDatabaseChange(direction) {
            currentDbIndex += direction;
            if (currentDbIndex >= dbList.length) currentDbIndex = 0;
            if (currentDbIndex < 0) currentDbIndex = dbList.length - 1;
            loadDatabase(currentDbIndex);
        }

        // SISTEM INPUT JAM (2x Swipe)
        function resolveClockNumber(area, swipe2) {
            if (area === 'UP') {
                if (swipe2 === 'LEFT') return 11;
                if (swipe2 === 'UP') return 12;
                if (swipe2 === 'RIGHT') return 1;
            } else if (area === 'RIGHT') {
                if (swipe2 === 'UP') return 2;
                if (swipe2 === 'RIGHT') return 3;
                if (swipe2 === 'DOWN') return 4;
            } else if (area === 'DOWN') {
                if (swipe2 === 'RIGHT') return 5;
                if (swipe2 === 'DOWN') return 6;
                if (swipe2 === 'LEFT') return 7;
            } else if (area === 'LEFT') {
                if (swipe2 === 'DOWN') return 8;
                if (swipe2 === 'LEFT') return 9;
                if (swipe2 === 'UP') return 10;
            }
            return -1; 
        }

        // Event Listener untuk Tombol Navigasi Database
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function triggerPrev(e) { e.preventDefault(); e.stopPropagation(); handleDatabaseChange(-1); }
        function triggerNext(e) { e.preventDefault(); e.stopPropagation(); handleDatabaseChange(1); }

        btnPrev.addEventListener('touchstart', triggerPrev, {passive: false});
        btnPrev.addEventListener('mousedown', triggerPrev);
        
        btnNext.addEventListener('touchstart', triggerNext, {passive: false});
        btnNext.addEventListener('mousedown', triggerNext);

        // Event Listener untuk Undo & Reset Area
        document.getElementById('btn-undo').addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            if(currentState === GAME_STATE.PLAYING) undoLastAction();
        }, {passive: false});

        document.getElementById('btn-reset').addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            fullReset();
        }, {passive: false});

        // Main Touch Logic
        let touchStartX = 0;
        let touchStartY = 0;
        const SWIPE_THRESHOLD = 35;

        document.addEventListener('touchstart', (e) => {
            if(['btn-undo', 'btn-reset', 'btn-prev', 'btn-next'].includes(e.target.id)) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if(['btn-undo', 'btn-reset', 'btn-prev', 'btn-next'].includes(e.target.id)) return;
            
            const endX = e.changedTouches[0].screenX;
            const endY = e.changedTouches[0].screenY;
            const deltaX = endX - touchStartX;
            const deltaY = endY - touchStartY;
            
            const isSwipe = Math.max(Math.abs(deltaX), Math.abs(deltaY)) > SWIPE_THRESHOLD;
            
            let swipeDir = null;
            if (isSwipe) {
                if (Math.abs(deltaX) > Math.abs(deltaY)) swipeDir = deltaX > 0 ? 'RIGHT' : 'LEFT';
                else swipeDir = deltaY > 0 ? 'DOWN' : 'UP';
            }

            if (currentState === GAME_STATE.INIT) {
                if (isSwipe) {
                    clockFirstArea = swipeDir; 
                    currentState = GAME_STATE.PENDING_CLOCK;
                    debugEl.textContent = `JAM: ${swipeDir}`; // Feedback visual kecil
                } else {
                    selectedLength = 0; startGameFromInit(); 
                }
                return;
            }

            if (currentState === GAME_STATE.PENDING_CLOCK) {
                if (isSwipe) {
                    const num = resolveClockNumber(clockFirstArea, swipeDir);
                    selectedLength = num > 0 ? num : 0;
                } else {
                    selectedLength = 0; 
                }
                startGameFromInit();
                return;
            }

            if (currentState === GAME_STATE.PLAYING) {
                if (isSwipe) {
                    if (swipeDir === 'DOWN') processInput(true); 
                    else if (swipeDir === 'UP') processInput(false); 
                }
                return;
            }

            if (currentState === GAME_STATE.GAMEOVER) {
                fullReset();
            }
        }, { passive: false });

        document.addEventListener('mousedown', (e) => {
            if(['btn-undo', 'btn-reset', 'btn-prev', 'btn-next'].includes(e.target.id)) return;
            if (e.button !== 0 && e.button !== 2) return; 
            
            if (currentState === GAME_STATE.PLAYING) {
                if (e.button === 0) processInput(true); // Kiri = YES
                else if (e.button === 2) processInput(false); // Kanan = NO
            } else if (currentState === GAME_STATE.GAMEOVER) {
                fullReset();
            } else if (currentState === GAME_STATE.INIT) {
                selectedLength = 0; startGameFromInit();
            }
        });

        let keyBuffer = '';
        let keyTimeout = null;

        document.addEventListener('keydown', (e) => {
            // Navigasi Database dengan Panah Kiri/Kanan
            if (e.key === 'ArrowLeft') {
                handleDatabaseChange(-1);
                return;
            }
            if (e.key === 'ArrowRight') {
                handleDatabaseChange(1);
                return;
            }

            // Input Angka Panjang Kata menggunakan Keyboard (0-9)
            if (e.key >= '0' && e.key <= '9') {
                if (currentState === GAME_STATE.INIT || currentState === GAME_STATE.GAMEOVER) {
                    // Jika game sudah selesai, reset otomatis dan langsung masuk angka baru
                    if (currentState === GAME_STATE.GAMEOVER) fullReset();
                    
                    keyBuffer += e.key;
                    clearTimeout(keyTimeout);
                    
                    // Tunggu 500ms untuk memungkinkan user mengetik 2 digit (misal: 1 lalu 2 untuk 12)
                    keyTimeout = setTimeout(() => {
                        selectedLength = parseInt(keyBuffer, 10);
                        keyBuffer = '';
                        startGameFromInit();
                    }, 500);
                }
                return;
            }

            // Tombol Enter untuk langsung memproses angka (tanpa nunggu 500ms)
            if (e.key === 'Enter' && keyBuffer.length > 0) {
                clearTimeout(keyTimeout);
                selectedLength = parseInt(keyBuffer, 10);
                keyBuffer = '';
                startGameFromInit();
                return;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadDatabase(currentDbIndex);
        });
    </script>
</body>
</html>
