<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas, #analysis-canvas, #warp-canvas {
            display: none;
        }
        #display-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            z-index: 1;
        }
        #result-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            opacity: 0.8;
            max-height: calc(100% - 160px);
            overflow-y: auto;
            width: 100%;
            text-align: left;
            pointer-events: none;
            display: none;
        }
        #peek-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: calc(90% - 140px);
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
        }
        #debug-preview {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 85%;
            max-height: 55%;
            border: 2px solid #333;
            border-radius: 8px;
            display: none;
            z-index: 3;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #stealth-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
            transition: background 0.3s;
        }
        .dot-success {
            background: #22c55e !important;
            opacity: 0.3;
        }
        .dot-error {
            background: #ef4444 !important;
            opacity: 0.4;
        }
        #main-console {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #38bdf8;
            z-index: 4;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }
        .console-line {
            margin-bottom: 4px;
            line-height: 1.4;
            word-break: break-all;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #222;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #eee;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #fff;
        }
        #slider-value {
            font-size: 14px;
            color: #fff;
            min-width: 30px;
            text-align: right;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #555;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <canvas id="analysis-canvas"></canvas>
    <canvas id="warp-canvas"></canvas>
    <img id="peek-img" src="" alt="">
    <img id="debug-preview" src="" alt="">

    <div id="stealth-dot"></div>

    <div id="display-area">
        <div id="result-text"></div>
    </div>

    <div id="main-console"></div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">Konfigurasi</div>
            <div class="input-group">
                <span class="input-label">Kredensial API</span>
                <input type="text" id="api-key-input" placeholder="Google Cloud Vision Key" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Modul Kamera</span>
                <select id="camera-select">
                    <option value="environment">Kamera Utama</option>
                    <option value="user">Kamera Depan</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Metode Operasi</span>
                <select id="mode-select">
                    <option value="ocr">Cloud OCR</option>
                    <option value="peek">Peek Picture</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Sensitivitas Kertas Putih</span>
                <div class="slider-container">
                    <input type="range" id="sensitivity-slider" min="120" max="220" step="5">
                    <span id="slider-value">170</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Tutup</button>
                <button class="btn-primary" id="save-btn">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const analysisCanvas = document.getElementById('analysis-canvas');
        const warpCanvas = document.getElementById('warp-canvas');
        const resultText = document.getElementById('result-text');
        const peekImg = document.getElementById('peek-img');
        const debugPreview = document.getElementById('debug-preview');
        const stealthDot = document.getElementById('stealth-dot');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const cameraSelect = document.getElementById('camera-select');
        const modeSelect = document.getElementById('mode-select');
        const sensitivitySlider = document.getElementById('sensitivity-slider');
        const sliderValue = document.getElementById('slider-value');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');
        const mainConsole = document.getElementById('main-console');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentFacingMode = localStorage.getItem('stealthScannerCamera') || 'environment';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let currentSensitivity = parseInt(localStorage.getItem('stealthScannerSensitivity')) || 170;
        
        let scanIntervalId = null;
        let isProcessing = false;
        let peekImageSrc = '';
        let extractedText = '';
        let lastCaptureHash = '';
        
        let tapCount = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        let stableFrames = 0;
        let prevCorners = null;

        sensitivitySlider.value = currentSensitivity;
        sliderValue.innerText = currentSensitivity;

        document.addEventListener('contextmenu', e => e.preventDefault());

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#38bdf8';
            if (type === 'error') color = '#f87171';
            if (type === 'success') color = '#4ade80';
            mainConsole.innerHTML += `<div class="console-line" style="color: ${color};">[${time}] ${msg}</div>`;
            mainConsole.scrollTop = mainConsole.scrollHeight;
        }

        sensitivitySlider.addEventListener('input', (e) => {
            sliderValue.innerText = e.target.value;
        });

        debugPreview.addEventListener('click', () => {
            debugPreview.style.display = 'none';
            log('Pratinjau gambar ditutup.');
        });

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console') || e.target.closest('#debug-preview')) return;
            
            holdTimeout = setTimeout(() => {
                isHolding = true;
                if (currentMode === 'peek' && peekImageSrc) {
                    peekImg.src = peekImageSrc;
                    peekImg.style.display = 'block';
                    log('Menampilkan gambar hasil crop.');
                } else if (currentMode === 'ocr' && extractedText) {
                    resultText.innerText = extractedText;
                    resultText.style.display = 'block';
                    log('Menampilkan hasil teks.');
                }
            }, 200);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console') || e.target.closest('#debug-preview')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                peekImg.style.display = 'none';
                peekImg.src = '';
                resultText.style.display = 'none';
                log('Tampilan disembunyikan kembali.');
                e.preventDefault();
            } else {
                if (e.type === 'pointerup') {
                    tapCount++;
                    clearTimeout(tapTimeout);
                    
                    if (tapCount === 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        cameraSelect.value = currentFacingMode;
                        modeSelect.value = currentMode;
                        sensitivitySlider.value = currentSensitivity;
                        sliderValue.innerText = currentSensitivity;
                        tapCount = 0;
                        log('Menu konfigurasi dibuka.');
                    } else {
                        tapTimeout = setTimeout(() => {
                            if (tapCount === 2) {
                                if (scanIntervalId || video.srcObject) {
                                    log('Mematikan kamera...');
                                    stopCamera();
                                } else {
                                    log('Menghubungkan kamera...');
                                    startSystem();
                                }
                            }
                            tapCount = 0;
                        }, 250);
                    }
                }
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentFacingMode = cameraSelect.value;
            currentMode = modeSelect.value;
            currentSensitivity = parseInt(sensitivitySlider.value);

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerCamera', currentFacingMode);
            localStorage.setItem('stealthScannerMode', currentMode);
            localStorage.setItem('stealthScannerSensitivity', currentSensitivity);

            settingsModal.style.display = 'none';
            
            resultText.innerText = '';
            extractedText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            debugPreview.style.display = 'none';
            debugPreview.src = '';
            stealthDot.className = '';
            lastCaptureHash = '';
            
            log(`Konfigurasi disimpan. Mode: ${currentMode}, Kamera: ${currentFacingMode}, Kecerahan Kertas: ${currentSensitivity}`);
            stopCamera();
        });

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            stableFrames = 0;
            prevCorners = null;
            log('Kamera nonaktif.');
        }

        async function startSystem() {
            if (scanIntervalId) return;
            stealthDot.className = '';
            stableFrames = 0;
            prevCorners = null;
            debugPreview.style.display = 'none';
            debugPreview.src = '';
            isProcessing = false;
            
            try {
                log(`Mengaktifkan kamera video (${currentFacingMode})...`);
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;
                
                scanIntervalId = setInterval(analyzePaperFrame, 250);
                log('Sistem pelacak kertas aktif.');
            } catch (err) {
                log('Gagal mengakses kamera: ' + err.message, 'error');
                stealthDot.className = 'dot-error';
            }
        }

        function analyzePaperFrame() {
            if (!video.videoWidth || isProcessing) return;

            const aWidth = 160;
            const aHeight = 120;
            analysisCanvas.width = aWidth;
            analysisCanvas.height = aHeight;

            const ctx = analysisCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, aWidth, aHeight);

            const frameData = ctx.getImageData(0, 0, aWidth, aHeight);
            const data = frameData.data;

            const visited = new Uint8Array(aWidth * aHeight);
            const binary = new Uint8Array(aWidth * aHeight);

            for (let i = 0; i < binary.length; i++) {
                const idx = i * 4;
                const r = data[idx];
                const g = data[idx+1];
                const b = data[idx+2];
                const gray = r * 0.299 + g * 0.587 + b * 0.114;
                binary[i] = (gray > currentSensitivity) ? 1 : 0;
            }

            let largestComp = [];
            for (let y = 0; y < aHeight; y++) {
                for (let x = 0; x < aWidth; x++) {
                    const idx = y * aWidth + x;
                    if (binary[idx] === 1 && visited[idx] === 0) {
                        const comp = [];
                        const queue = [idx];
                        visited[idx] = 1;
                        let head = 0;
                        while (head < queue.length) {
                            const curr = queue[head++];
                            comp.push(curr);
                            const cx = curr % aWidth;
                            const cy = Math.floor(curr / aWidth);

                            const neighbors = [
                                {x: cx - 1, y: cy},
                                {x: cx + 1, y: cy},
                                {x: cx, y: cy - 1},
                                {x: cx, y: cy + 1}
                            ];
                            for (let n of neighbors) {
                                if (n.x >= 0 && n.x < aWidth && n.y >= 0 && n.y < aHeight) {
                                    const nidx = n.y * aWidth + n.x;
                                    if (binary[nidx] === 1 && visited[nidx] === 0) {
                                        visited[nidx] = 1;
                                        queue.push(nidx);
                                    }
                                }
                            }
                        }
                        if (comp.length > largestComp.length) {
                            largestComp = comp;
                        }
                    }
                }
            }

            if (largestComp.length > 800) {
                let minSum = Infinity, maxSum = -Infinity;
                let minDiff = Infinity, maxDiff = -Infinity;
                let tl = null, tr = null, br = null, bl = null;

                for (let idx of largestComp) {
                    const x = idx % aWidth;
                    const y = Math.floor(idx / aWidth);
                    const sum = x + y;
                    const diff = x - y;

                    if (sum < minSum) { minSum = sum; tl = {x, y}; }
                    if (sum > maxSum) { maxSum = sum; br = {x, y}; }
                    if (diff < minDiff) { minDiff = diff; bl = {x, y}; }
                    if (diff > maxDiff) { maxDiff = diff; tr = {x, y}; }
                }

                if (tl && tr && br && bl) {
                    let strokeEdges = 0;
                    for (let y = Math.min(tl.y, tr.y) + 2; y < Math.max(bl.y, br.y) - 2; y += 2) {
                        for (let x = Math.min(tl.x, bl.x) + 2; x < Math.max(tr.x, br.x) - 2; x += 2) {
                            const idx = (y * aWidth + x) * 4;
                            const r = data[idx], g = data[idx+1], b = data[idx+2];
                            const gray = r * 0.299 + g * 0.587 + b * 0.114;

                            const rightIdx = (y * aWidth + (x + 1)) * 4;
                            const rightGray = data[rightIdx]*0.299 + data[rightIdx+1]*0.587 + data[rightIdx+2]*0.114;

                            const bottomIdx = ((y + 1) * aWidth + x) * 4;
                            const bottomGray = data[bottomIdx]*0.299 + data[bottomIdx+1]*0.587 + data[bottomIdx+2]*0.114;

                            const diff = Math.abs(gray - rightGray) + Math.abs(gray - bottomGray);
                            if (diff > 45) {
                                strokeEdges++;
                            }
                        }
                    }

                    log(`Kertas terdeteksi | Stroke tinta: ${strokeEdges}`);

                    if (strokeEdges > 10) {
                        if (prevCorners) {
                            const shiftTL = Math.abs(tl.x - prevCorners.tl.x) + Math.abs(tl.y - prevCorners.tl.y);
                            const shiftTR = Math.abs(tr.x - prevCorners.tr.x) + Math.abs(tr.y - prevCorners.tr.y);
                            const shiftBR = Math.abs(br.x - prevCorners.br.x) + Math.abs(br.y - prevCorners.br.y);
                            const shiftBL = Math.abs(bl.x - prevCorners.bl.x) + Math.abs(bl.y - prevCorners.bl.y);

                            if (shiftTL < 8 && shiftTR < 8 && shiftBR < 8 && shiftBL < 8) {
                                stableFrames++;
                                if (stableFrames >= 4) {
                                    log('Kertas stabil terdeteksi. Memulai deskew homografi...');
                                    executeCapture(tl, tr, br, bl);
                                }
                            } else {
                                stableFrames = 0;
                            }
                        }
                        prevCorners = { tl, tr, br, bl };
                    } else {
                        stableFrames = 0;
                        prevCorners = null;
                    }
                }
            } else {
                stableFrames = 0;
                prevCorners = null;
            }
        }

        async function executeCapture(tl, tr, br, bl) {
            isProcessing = true;
            stopCamera();

            const nativeW = video.videoWidth;
            const nativeH = video.videoHeight;

            canvas.width = nativeW;
            canvas.height = nativeH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, nativeW, nativeH);

            const scaleX = nativeW / 160;
            const scaleY = nativeH / 120;

            const s0 = { x: tl.x * scaleX, y: tl.y * scaleY };
            const s1 = { x: tr.x * scaleX, y: tr.y * scaleY };
            const s2 = { x: br.x * scaleX, y: br.y * scaleY };
            const s3 = { x: bl.x * scaleX, y: bl.y * scaleY };

            const warpW = 800;
            const warpH = 600;
            warpCanvas.width = warpW;
            warpCanvas.height = warpH;
            const wCtx = warpCanvas.getContext('2d');

            const srcData = ctx.getImageData(0, 0, nativeW, nativeH);
            const dstData = wCtx.createImageData(warpW, warpH);

            for (let vd = 0; vd < warpH; vd++) {
                const v = vd / warpH;
                for (let ud = 0; ud < warpW; ud++) {
                    const u = ud / warpW;

                    const x = Math.round((1 - u) * (1 - v) * s0.x + u * (1 - v) * s1.x + u * v * s2.x + (1 - u) * v * s3.x);
                    const y = Math.round((1 - u) * (1 - v) * s0.y + u * (1 - v) * s1.y + u * v * s2.y + (1 - u) * v * s3.y);

                    if (x >= 0 && x < nativeW && y >= 0 && y < nativeH) {
                        const srcIdx = (y * nativeW + x) * 4;
                        const dstIdx = (vd * warpW + ud) * 4;
                        dstData.data[dstIdx] = srcData.data[srcIdx];
                        dstData.data[dstIdx+1] = srcData.data[srcIdx+1];
                        dstData.data[dstIdx+2] = srcData.data[srcIdx+2];
                        dstData.data[dstIdx+3] = 255;
                    }
                }
            }
            wCtx.putImageData(dstData, 0, 0);

            const checkData = wCtx.getImageData(0, 0, warpW, warpH);
            const d = checkData.data;

            let centerSum = 0;
            let centerCount = 0;
            const startX = Math.round(warpW * 0.1);
            const endX = Math.round(warpW * 0.9);
            const startY = Math.round(warpH * 0.1);
            const endY = Math.round(warpH * 0.9);

            for (let y = startY; y < endY; y += 2) {
                for (let x = startX; x < endX; x += 2) {
                    const idx = (y * warpW + x) * 4;
                    const r = d[idx], g = d[idx+1], b = d[idx+2];
                    const gray = r * 0.299 + g * 0.587 + b * 0.114;
                    centerSum += gray;
                    centerCount++;
                }
            }

            const avgLuminance = centerCount > 0 ? (centerSum / centerCount) : 180;
            const inkThreshold = avgLuminance - 40;

            let inkMinX = warpW, inkMinY = warpH, inkMaxX = 0, inkMaxY = 0;
            let inkFound = false;

            for (let y = startY; y < endY; y++) {
                for (let x = startX; x < endX; x++) {
                    const idx = (y * warpW + x) * 4;
                    const r = d[idx], g = d[idx+1], b = d[idx+2];
                    const gray = r * 0.299 + g * 0.587 + b * 0.114;

                    if (gray < inkThreshold) {
                        inkFound = true;
                        if (x < inkMinX) inkMinX = x;
                        if (y < inkMinY) inkMinY = y;
                        if (x > inkMaxX) inkMaxX = x;
                        if (y > inkMaxY) inkMaxY = y;
                    }
                }
            }

            if (inkFound) {
                const pad = 20;
                inkMinX = Math.max(0, inkMinX - pad);
                inkMinY = Math.max(0, inkMinY - pad);
                inkMaxX = Math.min(warpW, inkMaxX + pad);
                inkMaxY = Math.min(warpH, inkMaxY + pad);

                const finalCropW = inkMaxX - inkMinX;
                const finalCropH = inkMaxY - inkMinY;

                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = 1000;
                cropCanvas.height = Math.round((finalCropH / finalCropW) * 1000);

                const cCtx = cropCanvas.getContext('2d');
                cCtx.drawImage(warpCanvas, inkMinX, inkMinY, finalCropW, finalCropH, 0, 0, cropCanvas.width, cropCanvas.height);

                const cropData = cCtx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
                const cd = cropData.data;

                let minL = 255;
                let maxL = 0;
                for (let i = 0; i < cd.length; i += 4) {
                    const gray = cd[i]*0.299 + cd[i+1]*0.587 + cd[i+2]*0.114;
                    if (gray < minL) minL = gray;
                    if (gray > maxL) maxL = gray;
                }

                const range = maxL - minL;
                for (let i = 0; i < cd.length; i += 4) {
                    let gray = cd[i]*0.299 + cd[i+1]*0.587 + cd[i+2]*0.114;
                    if (range > 10) {
                        gray = ((gray - minL) / range) * 255;
                    }
                    cd[i] = cd[i+1] = cd[i+2] = Math.round(gray);
                }
                cCtx.putImageData(cropData, 0, 0);

                const currentHash = computeImageHash(cropCanvas);
                if (lastCaptureHash && calculateHammingDistance(lastCaptureHash, currentHash) < 5) {
                    log('Gambar identik dengan sebelumnya. Melewati pemanggilan API Google Cloud.', 'success');
                    debugPreview.src = cropCanvas.toDataURL('image/jpeg', 0.85);
                    debugPreview.style.display = 'block';
                    stealthDot.className = 'dot-success';
                    isProcessing = false;
                    return;
                }

                lastCaptureHash = currentHash;
                const base64Url = cropCanvas.toDataURL('image/jpeg', 0.85);
                debugPreview.src = base64Url;
                debugPreview.style.display = 'block';

                const base64Image = base64Url.split(',')[1];
                await sendToCloudVision(base64Image, cropCanvas);
            } else {
                log('Kertas terdeteksi kosong tanpa goresan tinta yang jelas.', 'error');
                isProcessing = false;
            }
        }

        function computeImageHash(srcCanvas) {
            const hCanvas = document.createElement('canvas');
            hCanvas.width = 8;
            hCanvas.height = 8;
            const hCtx = hCanvas.getContext('2d');
            hCtx.drawImage(srcCanvas, 0, 0, 8, 8);

            const imgData = hCtx.getImageData(0, 0, 8, 8);
            const d = imgData.data;

            let sum = 0;
            const grays = [];
            for (let i = 0; i < 64; i++) {
                const idx = i * 4;
                const gray = d[idx]*0.299 + d[idx+1]*0.587 + d[idx+2]*0.114;
                grays.push(gray);
                sum += gray;
            }

            const avg = sum / 64;
            let hash = '';
            for (let i = 0; i < 64; i++) {
                hash += grays[i] >= avg ? '1' : '0';
            }
            return hash;
        }

        function calculateHammingDistance(h1, h2) {
            let dist = 0;
            for (let i = 0; i < 64; i++) {
                if (h1[i] !== h2[i]) dist++;
            }
            return dist;
        }

        async function sendToCloudVision(base64String, finalCropCanvas) {
            if (!visionApiKey) {
                log('Kunci API tidak ditemukan.', 'error');
                stealthDot.className = 'dot-error';
                isProcessing = false;
                return;
            }

            log('Menghubungi Cloud Vision API...');
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0].fullTextAnnotation) {
                    const textResult = data.responses[0].fullTextAnnotation.text;
                    log('Respons Cloud OCR diterima.', 'success');
                    
                    if (currentMode === 'ocr') {
                        extractedText = textResult;
                        stealthDot.className = 'dot-success';
                        log('Teks berhasil disimpan. Siap di-peeking.', 'success');
                    } else if (currentMode === 'peek') {
                        const annotations = data.responses[0].textAnnotations;
                        if (annotations && annotations.length > 0) {
                            const vertices = annotations[0].boundingPoly.vertices;
                            let minX = finalCropCanvas.width, minY = finalCropCanvas.height, maxX = 0, maxY = 0;
                            
                            vertices.forEach(v => {
                                const x = v.x || 0;
                                const y = v.y || 0;
                                if (x < minX) minX = x;
                                if (y < minY) minY = y;
                                if (x > maxX) maxX = x;
                                if (y > maxY) maxY = y;
                            });

                            const pad = 10;
                            minX = Math.max(0, minX - pad);
                            minY = Math.max(0, minY - pad);
                            maxX = Math.min(finalCropCanvas.width, maxX + pad);
                            maxY = Math.min(finalCropCanvas.height, maxY + pad);

                            const w = maxX - minX;
                            const h = maxY - minY;

                            if (w > 0 && h > 0) {
                                const cropCanvas = document.createElement('canvas');
                                cropCanvas.width = w;
                                cropCanvas.height = h;
                                const cropCtx = cropCanvas.getContext('2d');
                                cropCtx.drawImage(finalCropCanvas, minX, minY, w, h, 0, 0, w, h);
                                peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.95);
                                stealthDot.className = 'dot-success';
                                log('Pemotongan gambar tulisan selesai. Siap di-peeking.', 'success');
                            }
                        }
                    }
                } else {
                    stealthDot.className = 'dot-error';
                    log('Cloud OCR gagal mengenali teks di kertas.', 'error');
                }
            } catch (err) {
                stealthDot.className = 'dot-error';
                log('Koneksi Cloud OCR gagal: ' + err.message, 'error');
            }
            isProcessing = false;
        }
    </script>
