<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bulan & Tarot</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #000;
    overflow: hidden;
    overscroll-behavior-y: none;
  }
</style>
</head>
<body class="text-white font-sans selection:bg-white/20">

<div class="fixed top-12 left-1/2 -translate-x-1/2 z-50 flex items-center p-1 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full shadow-2xl">
  <button id="tab-btn-bulan" onclick="switchTab('bulan')" class="px-6 py-2 rounded-full text-xs tracking-widest uppercase font-medium transition-all duration-300 bg-white text-black">
    Bulan Lahir
  </button>
  <button id="tab-btn-tarot" onclick="switchTab('tarot')" class="px-6 py-2 rounded-full text-xs tracking-widest uppercase font-medium transition-all duration-300 text-white/50 hover:text-white">
    Tarot
  </button>
</div>

<div class="relative w-screen h-[100dvh] overflow-hidden m-0 p-0">
  
  <div id="view-bulan" class="absolute inset-0 w-full h-full z-20 transition-opacity duration-500 opacity-100">
    <div id="carousel" class="flex w-full h-full overflow-x-auto snap-x snap-mandatory hide-scrollbar overscroll-x-contain"></div>
    <div id="dots" class="absolute bottom-12 left-1/2 -translate-x-1/2 z-30 flex justify-center items-center gap-2.5 px-5 py-3 rounded-full bg-white/10 backdrop-blur-md border border-white/10 shadow-2xl pointer-events-none"></div>
  </div>

  <div id="view-tarot" class="absolute inset-0 w-full h-full z-10 overflow-y-auto hide-scrollbar opacity-0 pointer-events-none transition-opacity duration-500 flex flex-col items-center justify-center pt-40 pb-40 px-8 bg-black">
    
    <div class="flex flex-col items-center justify-center max-w-2xl text-center w-full min-h-[60vh]">
      
      <div id="tarot-text-container" class="opacity-0 transition-opacity duration-1000 w-full flex flex-col items-center hidden mb-14">
        <div class="opacity-30 mb-10">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l3 6 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1 3-6z"></path>
          </svg>
        </div>
        <h2 id="tarot-name" class="text-4xl md:text-6xl font-light tracking-tight mb-5 text-white"></h2>
        <span id="tarot-character" class="text-[10px] md:text-xs tracking-[0.2em] uppercase font-medium opacity-50 mb-12 text-white"></span>
        <div class="w-16 h-px bg-white/20 mx-auto mb-12"></div>
        <p id="tarot-meaning" class="text-lg md:text-xl font-light text-white/70 leading-relaxed max-w-xl"></p>
      </div>

      <button id="btn-draw" onclick="drawTarotCard()" class="px-8 py-3 rounded-full border border-white/20 bg-white/5 backdrop-blur-sm hover:bg-white/10 hover:border-white/40 transition-all duration-300 text-xs tracking-widest uppercase font-medium shrink-0">
        Tarik Kartu
      </button>
      
    </div>

  </div>

</div>

<script>
const tarotDeck = {
  "ace": [
    { name: "Ace of Wands", meaning: "Awal baru yang penuh energi, inspirasi kreatif, dan potensi besar untuk memulai sesuatu yang kamu impikan." },
    { name: "Ace of Cups", meaning: "Cinta yang meluap, kedamaian spiritual, dan kebahagiaan emosional yang segera memenuhi harimu." },
    { name: "Ace of Swords", meaning: "Kejelasan mental, kemenangan atas kesulitan, dan kekuatan pikiran untuk memutus kebingungan." },
    { name: "Ace of Pentacles", meaning: "Peluang finansial baru, kemakmuran materi, dan pondasi yang kuat untuk masa depan yang stabil." }
  ],
  "2": [
    { name: "Two of Wands", meaning: "Perencanaan masa depan, keberanian untuk melangkah keluar, dan eksplorasi peluang di luar zona nyaman." },
    { name: "Two of Cups", meaning: "Kemitraan yang harmonis, keseimbangan dalam hubungan, dan rasa saling menghargai yang mendalam." },
    { name: "Two of Swords", meaning: "Kebutuhan untuk membuat keputusan sulit, mencari jalan tengah, dan menyeimbangkan logika serta perasaan." },
    { name: "Two of Pentacles", meaning: "Kemampuan mengelola prioritas, adaptasi terhadap perubahan, dan menjaga keseimbangan di tengah kesibukan." }
  ],
  "3": [
    { name: "Three of Wands", meaning: "Perluasan visi, kesuksesan yang mulai terlihat di ufuk, dan buah dari kerja keras yang segera tiba." },
    { name: "Three of Cups", meaning: "Perayaan bersama teman dekat, kebahagiaan kolektif, dan dukungan sosial yang menguatkan jiwamu." },
    { name: "Three of Swords", meaning: "Pelepasan luka lama, pemulihan emosional, dan keberanian untuk menghadapi kenyataan pahit demi pertumbuhan." },
    { name: "Three of Pentacles", meaning: "Kolaborasi yang produktif, pengakuan atas keahlianmu, dan hasil kerja tim yang sangat memuaskan." }
  ],
  "4": [
    { name: "Four of Wands", meaning: "Stabilitas rumah tangga, perayaan pencapaian kecil, dan rasa aman yang menyelimuti lingkungan terdekatmu." },
    { name: "Four of Cups", meaning: "Momen kontemplasi, perlunya melihat peluang baru yang ada di depan mata, dan evaluasi diri yang mendalam." },
    { name: "Four of Swords", meaning: "Waktu untuk beristirahat sejenak, memulihkan energi fisik, dan menjauhkan diri dari kebisingan dunia." },
    { name: "Four of Pentacles", meaning: "Keinginan untuk menjaga apa yang sudah dimiliki, stabilitas keuangan, dan perlunya sikap lebih terbuka." }
  ],
  "5": [
    { name: "Five of Wands", meaning: "Persaingan yang sehat, tantangan yang memacu adrenalin, dan perlunya fokus untuk memenangkan kompetisi." },
    { name: "Five of Cups", meaning: "Belajar dari masa lalu, melihat sisa harapan yang masih ada, dan bangkit dari kekecewaan dengan lebih bijak." },
    { name: "Five of Swords", meaning: "Kemenangan yang butuh evaluasi, menghindari konflik yang tidak perlu, dan fokus pada perdamaian diri." },
    { name: "Five of Pentacles", meaning: "Dukungan yang datang di saat sulit, pentingnya mencari bantuan, dan ketangguhan mental menghadapi rintangan." }
  ],
  "6": [
    { name: "Six of Wands", meaning: "Keberhasilan yang diakui publik, kepercayaan diri yang meningkat, dan momen kemenangan yang layak dirayakan." },
    { name: "Six of Cups", meaning: "Nostalgia yang manis, pertemuan dengan sosok masa lalu, dan kebaikan hati yang kembali kepadamu." },
    { name: "Six of Swords", meaning: "Transisi menuju kondisi yang lebih tenang, meninggalkan beban lama, dan perjalanan menuju kedamaian." },
    { name: "Six of Pentacles", meaning: "Kemurahan hati, berbagi rezeki yang adil, dan keseimbangan antara memberi serta menerima bantuan." }
  ],
  "7": [
    { name: "Seven of Wands", meaning: "Keteguhan dalam mempertahankan prinsip, keberanian menghadapi tekanan, dan kekuatan untuk tetap berdiri tegak." },
    { name: "Seven of Cups", meaning: "Banyak pilihan menarik di depan, perlunya fokus pada satu tujuan, dan kemampuan membedakan realita dari ilusi." },
    { name: "Seven of Swords", meaning: "Kebutuhan akan strategi cerdik, kemandirian dalam bertindak, dan kewaspadaan terhadap situasi di sekitarmu." },
    { name: "Seven of Pentacles", meaning: "Kesabaran menunggu hasil panen, investasi jangka panjang, dan evaluasi atas kemajuan yang sudah dicapai." }
  ],
  "8": [
    { name: "Eight of Wands", meaning: "Pergerakan cepat, berita baik yang segera tiba, dan momentum positif yang tidak boleh disia siakan." },
    { name: "Eight of Cups", meaning: "Perjalanan mencari makna lebih dalam, melepaskan hal yang tidak lagi berguna, dan pertumbuhan spiritual yang pesat." },
    { name: "Eight of Swords", meaning: "Menyadari bahwa batasan hanya ada di pikiran, keberanian untuk membebaskan diri, dan perspektif baru yang mencerahkan." },
    { name: "Eight of Pentacles", meaning: "Dedikasi pada keahlian, proses belajar yang tekun, dan fokus pada kualitas hasil karya yang kamu buat." }
  ],
  "9": [
    { name: "Nine of Wands", meaning: "Ketangguhan di garis finis, perlindungan terhadap pencapaianmu, dan kekuatan cadangan yang segera keluar." },
    { name: "Nine of Cups", meaning: "Kepuasan batin yang mendalam, harapan yang menjadi kenyataan, dan rasa syukur atas segala berkah hidup." },
    { name: "Nine of Swords", meaning: "Menghadapi rasa cemas dengan logika, menyadari bahwa ketakutan tidak nyata, dan ketenangan yang kembali hadir." },
    { name: "Nine of Pentacles", meaning: "Kemandirian finansial, menikmati hasil kerja keras dengan elegan, dan rasa bangga atas pencapaian pribadi." }
  ],
  "10": [
    { name: "Ten of Wands", meaning: "Tanggung jawab besar yang segera tuntas, perlunya delegasi tugas, dan akhir dari perjuangan yang melelahkan." },
    { name: "Ten of Cups", meaning: "Kebahagiaan keluarga yang sempurna, keselarasan hubungan, dan rasa memiliki yang sangat kuat." },
    { name: "Ten of Swords", meaning: "Akhir dari siklus buruk, fajar baru yang segera menyingsing, dan kelegaan setelah melewati masa sulit." },
    { name: "Ten of Pentacles", meaning: "Warisan yang berharga, kemakmuran keluarga jangka panjang, dan pondasi hidup yang sangat kokoh." }
  ],
  "knight": [
    { name: "Knight of Wands", meaning: "Aksi penuh gairah, keberanian mengambil risiko besar, dan semangat petualangan yang membara dalam dirimu." },
    { name: "Knight of Cups", meaning: "Pesan cinta yang romantis, tawaran emosional yang tulus, dan imajinasi yang membawa keberuntungan." },
    { name: "Knight of Swords", meaning: "Kecepatan bertindak, ketajaman analisis dalam masalah rumit, dan tekad baja untuk mencapai target." },
    { name: "Knight of Pentacles", meaning: "Metode kerja yang sangat terstruktur, kesabaran yang luar biasa, dan hasil nyata dari ketekunanmu." }
  ],
  "queen": [
    { name: "Queen of Wands", meaning: "Kepercayaan diri yang menarik perhatian, kemandirian yang menginspirasi, dan energi hangat yang memikat orang lain." },
    { name: "Queen of Cups", meaning: "Intuisi emosional yang sangat tajam, empati yang mendalam, dan ketenangan batin yang menjadi kekuatanmu." },
    { name: "Queen of Swords", meaning: "Objektivitas dalam menilai situasi, kejujuran yang lugas, dan kemandirian intelektual yang sangat kuat." },
    { name: "Queen of Pentacles", meaning: "Kemampuan mengayomi dan mengelola sumber daya, kemakmuran praktis, dan kehangatan dalam berbagi rezeki." }
  ]
};

const monthData = [
  { id: 'januari', name: 'Januari', icon: 'snowflake', tarotRank: 'ace', tarotCharacter: 'Cermat, Antusias', color: 'from-blue-900/20 to-black', prediction: 'Kamu sering menjadi tempat bersandar bagi orang lain, padahal kamu sendiri kadang butuh didengarkan. Ada banyak ide di kepalamu yang belum sempat direalisasikan karena kamu terlalu sibuk membantu orang di sekitarmu.' },
  { id: 'februari', name: 'Februari', icon: 'cloud-rain', tarotRank: '2', tarotCharacter: 'Antusias, Positif', color: 'from-indigo-900/20 to-black', prediction: 'Banyak yang mengira kamu sosok yang santai, tapi sebenarnya kamu sangat memikirkan detail kecil dari setiap perkataan orang. Kamu punya kemampuan alami untuk membaca situasi yang sering kali tidak disadari orang lain.' },
  { id: 'maret', name: 'Maret', icon: 'seedling', tarotRank: '3', tarotCharacter: 'Positif, Ambisius', color: 'from-teal-900/20 to-black', prediction: 'Kamu punya dinding pertahanan tersendiri untuk melindungi perasaanmu. Orang melihatmu ramah, tapi hanya sedikit yang benar benar tahu apa yang kamu rasakan di balik senyumanmu sehari hari.' },
  { id: 'april', name: 'April', icon: 'flower', tarotRank: '4', tarotCharacter: 'Ambisius, Tangguh', color: 'from-rose-900/20 to-black', prediction: 'Kamu tidak suka terjebak dalam rutinitas yang membosankan. Meski dari luar terlihat selalu penuh energi, ada kalanya kamu merasa kelelahan dan hanya ingin diam di tempat yang tenang tanpa gangguan siapa pun.' },
  { id: 'mei', name: 'Mei', icon: 'sun-low', tarotRank: '5', tarotCharacter: 'Tangguh, Gesit', color: 'from-emerald-900/20 to-black', prediction: 'Kamu sangat menghargai keamanan dan kenyamanan dalam hidup. Terkadang kamu ragu melangkah keluar dari zona nyaman karena takut mengecewakan diri sendiri, padahal potensimu jauh lebih besar dari yang kamu bayangkan.' },
  { id: 'juni', name: 'Juni', icon: 'sun', tarotRank: '6', tarotCharacter: 'Gesit, Caring', color: 'from-sky-900/20 to-black', prediction: 'Kamu pintar menyembunyikan kesedihan di balik candaan. Orang suka berada di dekatmu karena energimu, tapi kamu sering merasa kesepian justru saat sedang berada di tengah keramaian.' },
  { id: 'juli', name: 'Juli', icon: 'wave-sine', tarotRank: '7', tarotCharacter: 'Caring, Loyal', color: 'from-cyan-900/20 to-black', prediction: 'Kamu sering menempatkan kebahagiaan orang lain di atas kebahagiaanmu sendiri. Kamu mungkin terlihat tegar, tapi kata kata kasar dari orang terdekat bisa sangat membekas di pikiranmu.' },
  { id: 'agustus', name: 'Agustus', icon: 'flame', tarotRank: '8', tarotCharacter: 'Loyal, Visioner', color: 'from-orange-900/20 to-black', prediction: 'Kamu punya standar yang sangat tinggi untuk dirimu sendiri. Walau sering terlihat kuat dan tahu arah, di dalam hati kamu kadang khawatir apakah kamu sudah mengambil keputusan yang tepat untuk masa depanmu.' },
  { id: 'september', name: 'September', icon: 'leaf', tarotRank: '9', tarotCharacter: 'Visioner, Lincah', color: 'from-amber-900/20 to-black', prediction: 'Kamu adalah pengamat yang ulung dan menyukai segala sesuatu yang teratur. Terkadang kamu terlalu keras mengkritik dirimu sendiri atas kesalahan kecil yang bahkan tidak disadari oleh orang lain.' },
  { id: 'oktober', name: 'Oktober', icon: 'wind', tarotRank: '10', tarotCharacter: 'Lincah, Serius', color: 'from-pink-900/20 to-black', prediction: 'Kamu selalu menghindari konflik sebisa mungkin demi kedamaian. Dalam usahamu untuk membuat semua orang senang, kamu sering lupa menanyakan pada dirimu sendiri apa yang sebenarnya membuatmu bahagia.' },
  { id: 'november', name: 'November', icon: 'moon', tarotRank: 'knight', tarotCharacter: 'Serius, Saksama', color: 'from-purple-900/20 to-black', prediction: 'Kamu tidak mudah percaya pada orang yang baru dikenal. Intuisimu sangat tajam dalam menilai karakter seseorang, tapi kamu memilih untuk diam dan mengamati dari jauh sebelum benar benar membuka diri.' },
  { id: 'desember', name: 'Desember', icon: 'stars', tarotRank: 'queen', tarotCharacter: 'Saksama, Cermat', color: 'from-zinc-900/20 to-black', prediction: 'Kamu selalu mencari makna lebih dalam dari setiap kejadian di hidupmu. Walau sering terlihat santai, pikiranmu tidak pernah berhenti memikirkan rencana rencana besar yang ingin kamu capai suatu hari nanti.' }
];

const carousel = document.getElementById('carousel');
const dotsContainer = document.getElementById('dots');
let activeIndex = 0;

function initApp() {
  carousel.innerHTML = monthData.map(month => {
    let fullText = month.prediction;
    const limit = 70;
    let shortText = fullText;
    let remainText = "";
    
    if (fullText.length > limit) {
      let cutIndex = fullText.lastIndexOf(' ', limit);
      if (cutIndex === -1) cutIndex = limit;
      shortText = fullText.substring(0, cutIndex);
      remainText = fullText.substring(cutIndex);
    }

    return `
    <div id="slide-${month.id}" class="flex-none w-full h-full snap-center relative bg-gradient-to-b ${month.color} overflow-y-auto hide-scrollbar">
      <div class="absolute inset-0 bg-black/40 fixed pointer-events-none"></div>
      <div class="relative w-full min-h-full flex flex-col justify-center items-center px-8 md:px-20 pt-32 pb-40 max-w-4xl mx-auto">
        
        <div class="flex flex-col items-center justify-center w-full max-w-md mx-auto text-center">
          <img src="https://api.iconify.design/tabler/${month.icon}.svg?color=white" alt="${month.name}" class="w-24 h-24 md:w-32 md:h-32 opacity-90 drop-shadow-xl mb-12" loading="lazy">
          <h1 class="text-4xl md:text-5xl font-light tracking-tight mb-12">${month.name}</h1>
        </div>
        
        <div class="w-16 h-px bg-white/20 mb-12 mx-auto"></div>
        
        <div class="relative w-full max-w-2xl text-center mx-auto text-lg md:text-xl leading-relaxed font-light text-white/90">
          <p class="inline">
            <span>${shortText}</span><span id="dots-${month.id}" class="${remainText ? 'inline' : 'hidden'}">...</span><span id="remain-${month.id}" class="hidden">${remainText}</span>
            ${remainText ? `<button id="btn-${month.id}" onclick="toggleCard('${month.id}')" class="inline text-white/50 hover:text-white transition-colors cursor-pointer bg-transparent border-none p-0 ml-1 font-medium">Selengkapnya</button>` : ''}
          </p>
        </div>
        
      </div>
    </div>
  `}).join('');

  dotsContainer.innerHTML = monthData.map((_, index) => `
    <div class="dot h-1.5 rounded-full transition-all duration-300 ${index === 0 ? 'w-6 bg-white' : 'w-1.5 bg-white/30'}"></div>
  `).join('');

  carousel.addEventListener('scroll', handleScroll);
}

function toggleCard(id) {
  const dots = document.getElementById(`dots-${id}`);
  const remain = document.getElementById(`remain-${id}`);
  const btn = document.getElementById(`btn-${id}`);
  
  if (remain.classList.contains('hidden')) {
    remain.classList.replace('hidden', 'inline');
    dots.classList.replace('inline', 'hidden');
    btn.innerText = 'Tutup';
  } else {
    remain.classList.replace('inline', 'hidden');
    dots.classList.replace('hidden', 'inline');
    btn.innerText = 'Selengkapnya';
  }
}

function handleScroll() {
  const scrollPosition = carousel.scrollLeft;
  const itemWidth = carousel.clientWidth;
  if (itemWidth === 0) return;
  const newIndex = Math.round(scrollPosition / itemWidth);
  const dots = document.querySelectorAll('.dot');
  
  if (newIndex !== activeIndex) {
    activeIndex = newIndex;
    dots.forEach((dot, index) => {
      dot.className = `dot h-1.5 rounded-full transition-all duration-300 ${index === activeIndex ? 'w-6 bg-white' : 'w-1.5 bg-white/30'}`;
    });
  }
}

function switchTab(tab) {
  const bulanView = document.getElementById('view-bulan');
  const tarotView = document.getElementById('view-tarot');
  const btnBulan = document.getElementById('tab-btn-bulan');
  const btnTarot = document.getElementById('tab-btn-tarot');

  if (tab === 'bulan') {
    bulanView.classList.replace('opacity-0', 'opacity-100');
    bulanView.style.zIndex = '20';
    bulanView.classList.remove('pointer-events-none');
    tarotView.classList.replace('opacity-100', 'opacity-0');
    tarotView.style.zIndex = '10';
    tarotView.classList.add('pointer-events-none');
    btnBulan.className = 'px-6 py-2 rounded-full text-xs tracking-widest uppercase font-medium transition-all duration-300 bg-white text-black';
    btnTarot.className = 'px-6 py-2 rounded-full text-xs tracking-widest uppercase font-medium transition-all duration-300 text-white/50 hover:text-white';
  } else {
    bulanView.classList.replace('opacity-100', 'opacity-0');
    bulanView.style.zIndex = '10';
    bulanView.classList.add('pointer-events-none');
    tarotView.classList.replace('opacity-0', 'opacity-100');
    tarotView.style.zIndex = '20';
    tarotView.classList.remove('pointer-events-none');
    btnTarot.className = 'px-6 py-2 rounded-full text-xs tracking-widest uppercase font-medium transition-all duration-300 bg-white text-black';
    btnBulan.className = 'px-6 py-2 rounded-full text-xs tracking-widest uppercase font-medium transition-all duration-300 text-white/50 hover:text-white';
  }
}

function drawTarotCard() {
  const btn = document.getElementById('btn-draw');
  const textContainer = document.getElementById('tarot-text-container');
  btn.disabled = true;

  if (!textContainer.classList.contains('hidden')) {
    textContainer.style.opacity = '0';
    setTimeout(() => {
      textContainer.classList.add('hidden');
      btn.innerText = 'Mengocok...';
      setTimeout(() => performDraw(btn, textContainer), 400);
    }, 600);
  } else {
    btn.innerText = 'Menarik...';
    performDraw(btn, textContainer);
  }
}

function performDraw(btn, textContainer) {
  const monthInfo = monthData[activeIndex];
  const rank = monthInfo.tarotRank;
  const cards = tarotDeck[rank];
  const result = cards[Math.floor(Math.random() * cards.length)];

  document.getElementById('tarot-name').innerText = result.name;
  document.getElementById('tarot-character').innerText = monthInfo.tarotCharacter;
  document.getElementById('tarot-meaning').innerText = result.meaning;

  textContainer.classList.remove('hidden');
  setTimeout(() => {
    textContainer.style.opacity = '1';
    document.getElementById('view-tarot').scrollTo({ top: 0, behavior: 'smooth' });
  }, 50);

  btn.innerText = 'Tarik Kartu Lain';
  btn.disabled = false;
}

initApp();
</script>
</body>
</html>
