<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mentalist Tool - Progressive Anagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Mencegah highlight biru saat di-tap/klik di HP */
            -webkit-tap-highlight-color: transparent; 
            /* Mencegah scroll dan pull-to-refresh */
            overscroll-behavior-y: none; 
        }
    </style>
</head>
<body class="bg-black text-gray-300 h-screen w-screen overflow-hidden select-none touch-none">

    <!-- Teks akan diposisikan di tengah, agak ke atas (pt-[25vh]) -->
    <div class="h-full w-full flex flex-col items-center pt-[25vh]">
        <!-- Teks dibuat agak redup (gray-400) agar tidak mencolok (Stealth Mode) -->
        <div id="display-text" class="text-6xl md:text-8xl font-light tracking-[0.2em] text-center px-4 uppercase transition-opacity duration-300">
            <!-- Teks dimuat dinamis -->
        </div>
        <div id="debug-info" class="text-xs text-gray-800 mt-4 opacity-50 uppercase tracking-widest hidden">
            <!-- Disembunyikan, bisa diaktifkan jika butuh melihat sisa kata -->
        </div>
        <div id="db-name" class="text-[10px] text-gray-800 mt-12 tracking-[0.3em] uppercase transition-opacity duration-300">
            <!-- Menampilkan nama DB aktif -->
        </div>
    </div>

    <script>
        // Konfigurasi File Database
        // HARAP EDIT array dbList INI sesuai dengan nama file Anda di dalam folder "database"
        // File harus berformat text biasa (.txt atau .lst), satu kata per baris.
        const dbList = [
            { name: "Kota Indonesia", file: "city_indonesia.lst" },
            { name: "Negara", file: "nation_database.lst" },
            { name: "Provinsi Indonesia", file: "provinsi_indonesia.lst" }
        ];

        let currentDbIndex = 0;
        let wordDatabase = []; // Data sekarang akan diambil dari file

        let possibleWords = [];
        let askedLetters = {};
        let currentTargetLetter = '';
        let historyStack = [];
        let isGameOver = false;

        const displayEl = document.getElementById('display-text');
        const debugEl = document.getElementById('debug-info');
        const dbNameEl = document.getElementById('db-name');

        async function loadDatabase(index) {
            const dbInfo = dbList[index];
            displayEl.style.opacity = 0;
            dbNameEl.textContent = `MEMUAT ${dbInfo.name}...`;
            
            try {
                // Mengambil file dari folder "database" di direktori root github
                const response = await fetch(`database/${dbInfo.file}`);
                if (!response.ok) throw new Error("File tidak ditemukan");
                
                const text = await response.text();
                // Parse text: pisahkan per baris, buang spasi, jadikan huruf besar, abaikan baris kosong
                wordDatabase = text.split('\n')
                                   .map(w => w.trim().toUpperCase())
                                   .filter(w => w.length > 0);
                
                dbNameEl.textContent = `DB: ${dbInfo.name}`;
                initGame();
            } catch (error) {
                displayEl.textContent = "ERR";
                displayEl.style.opacity = 1;
                displayEl.classList.remove('text-gray-300', 'text-green-500');
                displayEl.classList.add('text-red-900');
                dbNameEl.textContent = `FILE TIDAK DITEMUKAN: database/${dbInfo.file}`;
                console.error("Gagal memuat database:", error);
            }
        }

        function initGame() {
            possibleWords = [...wordDatabase];
            askedLetters = {};
            historyStack = [];
            isGameOver = false;
            updateGameState();
        }

        function calculateNextBestLetter() {
            const letterCounts = {};
            
            for (let word of possibleWords) {
                const uniqueChars = new Set(word.replace(/\s/g, '').toLowerCase()); 
                for (let char of uniqueChars) {
                    if (char >= 'a' && char <= 'z' && askedLetters[char] === undefined) {
                        letterCounts[char] = (letterCounts[char] || 0) + 1;
                    }
                }
            }

            let bestLetter = null;
            let bestDiff = Infinity;
            const target = possibleWords.length / 2;

            for (let char in letterCounts) {
                const count = letterCounts[char];
                if (count > 0 && count < possibleWords.length) {
                    const diff = Math.abs(count - target);
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        bestLetter = char;
                    }
                }
            }
            return bestLetter; 
        }

        function updateGameState() {
            if (possibleWords.length === 0) {
                displayEl.textContent = "ERR";
                isGameOver = true;
                return;
            }

            currentTargetLetter = calculateNextBestLetter();

            // Animasi transisi halus
            displayEl.style.opacity = 0;
            
            setTimeout(() => {
                if (currentTargetLetter === null) {
                    // Berhasil menemukan kata (atau sisa beberapa anagram)
                    displayEl.textContent = possibleWords.join(' / ');
                    displayEl.classList.add('text-green-500');
                    displayEl.classList.remove('text-gray-300', 'font-light');
                    displayEl.classList.add('font-bold');
                    isGameOver = true;
                } else {
                    // Masih mencari, tampilkan huruf berikutnya
                    displayEl.textContent = currentTargetLetter.toUpperCase();
                    displayEl.classList.remove('text-green-500', 'font-bold');
                    displayEl.classList.add('text-gray-300', 'font-light');
                }
                displayEl.style.opacity = 1;
                debugEl.textContent = `SISA: ${possibleWords.length}`;
            }, 150);
        }

        function handleAnswer(isYes) {
            historyStack.push({
                words: [...possibleWords],
                asked: { ...askedLetters }
            });

            askedLetters[currentTargetLetter] = isYes;

            possibleWords = possibleWords.filter(word => {
                const lowerWord = word.toLowerCase();
                const hasLetter = lowerWord.includes(currentTargetLetter);
                return isYes ? hasLetter : !hasLetter;
            });

            updateGameState();
        }

        function processInput(isYes) {
            if (isGameOver) {
                initGame(); // Ketuk/Swipe apa saja jika game selesai akan me-reset dengan DB yang sama
                return;
            }
            handleAnswer(isYes);
        }

        function handleDatabaseChange(direction) {
            currentDbIndex += direction;
            // Jika melebihi batas, kembali ke awal (loop)
            if (currentDbIndex >= dbList.length) currentDbIndex = 0;
            if (currentDbIndex < 0) currentDbIndex = dbList.length - 1;
            loadDatabase(currentDbIndex);
        }

        // --- MOUSE INPUT (Tetap: Klik Kiri = YA, Klik Kanan = TIDAK) ---
        
        document.addEventListener('click', (e) => {
            if (e.button === 0) processInput(true); // Kiri = YA
        });

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault(); // Blokir pop-up menu
            processInput(false); // Kanan = TIDAK
        });

        // --- TOUCH INPUT MOBILE (Swipe) ---
        // Bawah = YA, Atas = TIDAK
        // Kanan/Kiri = Ganti Database
        
        let touchStartX = 0;
        let touchStartY = 0;
        let isProcessingTouch = false;
        const SWIPE_THRESHOLD = 40; // Jarak minimum pixel untuk dihitung sebagai swipe

        document.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Mencegah scrolling dan pull-to-refresh
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (isProcessingTouch) return;

            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;

            let deltaX = touchEndX - touchStartX;
            let deltaY = touchEndY - touchStartY;

            // Jika pergerakan sangat kecil (di bawah threshold), anggap ini ketukan biasa
            // Berguna untuk mereset game saat sudah selesai menampilkan teks hijau.
            if (Math.abs(deltaX) < SWIPE_THRESHOLD && Math.abs(deltaY) < SWIPE_THRESHOLD) {
                if (isGameOver) initGame();
                return;
            }

            isProcessingTouch = true;

            // Cek apakah usapan lebih dominan secara Horizontal atau Vertikal
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // --- SWIPE HORIZONTAL ---
                if (deltaX > 0) {
                    handleDatabaseChange(1); // Swipe Kanan -> DB Berikutnya
                } else {
                    handleDatabaseChange(-1); // Swipe Kiri -> DB Sebelumnya
                }
            } else {
                // --- SWIPE VERTIKAL ---
                if (deltaY > 0) {
                    processInput(true); // Swipe Bawah -> YA
                } else {
                    processInput(false); // Swipe Atas -> TIDAK
                }
            }

            // Proteksi dari input beruntun/ganda dalam waktu singkat (debounce)
            setTimeout(() => { isProcessingTouch = false; }, 300);
        }, { passive: false });

        // Eksekusi awal: Muat database pertama
        document.addEventListener('DOMContentLoaded', () => {
            loadDatabase(currentDbIndex);
        });

    </script>
</body>
</html>
