<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EVP App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
        }

        /* Container utama untuk views */
        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .view.active {
            display: block;
        }

        /* Tombol Transparan / Layout Elements */
        .stealth-btn {
            position: absolute;
            opacity: 0; /* 100% Invisible in normal mode */
            z-index: 10;
        }

        /* Tampilan saat Edit Layout Mode aktif */
        body.edit-mode .stealth-btn {
            opacity: 0.5 !important;
            border: 2px dashed #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }

        body.edit-mode .t9-btn { background-color: rgba(0, 100, 255, 0.5); }
        body.edit-mode .rec-btn { background-color: rgba(255, 0, 0, 0.5); }
        body.edit-mode .trigger-area { background-color: rgba(255, 255, 0, 0.5); }

        /* Secret Settings Button di pojok kanan atas */
        #secret-settings-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            z-index: 999;
            /* opacity: 0.5; background: red; Uncomment for debugging */
        }

        /* Settings Modal */
        #settings-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            color: white;
            overflow-y: auto;
            padding-bottom: 50px;
        }

        #settings-modal.active { display: flex; }
        
        .settings-content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.875rem; margin-bottom: 5px; color: #cbd5e1; }
        .input-group input, .input-group textarea { 
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; 
            background: #1e293b; color: white; font-family: monospace;
        }
        
        /* Tab Navigation Settings */
        .tabs { display: flex; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #64748b; }
        .tab.active { color: white; border-bottom: 2px solid #3b82f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    
    <!-- Area Pemicu Setting Rahasia -->
    <div id="secret-settings-trigger"></div>

    <!-- VIEW 1: LOCKSCREEN -->
    <div id="view-lockscreen" class="view active">
        <!-- T9 Buttons (0-9). Di-generate via JS agar koordinat bisa disimpan -->
        <div id="t9-container"></div>
    </div>

    <!-- VIEW 2: RECORDER -->
    <div id="view-recorder" class="view">
        <div id="btn-rec" class="stealth-btn rec-btn" data-id="rec">REC</div>
        <div id="btn-stop" class="stealth-btn rec-btn" data-id="stop">STOP</div>
        <div id="btn-play" class="stealth-btn rec-btn" data-id="play">PLAY</div>
        <div id="area-trigger" class="stealth-btn trigger-area" data-id="trigger">SECRET TRIGGER</div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal">
        <div class="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-700 sticky top-0 z-50">
            <h2 class="text-xl font-bold">Secret Setup</h2>
            <button id="btn-close-settings" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-bold">Tutup</button>
        </div>

        <div class="settings-content">
            <!-- Utility Buttons -->
            <div class="grid grid-cols-2 gap-2 mb-6">
                <button id="btn-edit-layout" class="bg-blue-600 py-3 rounded font-bold shadow-lg">Edit Layout Mode: OFF</button>
                <button id="btn-req-mic" class="bg-green-600 py-3 rounded font-bold shadow-lg">Izinkan Mic</button>
                <button id="btn-fullscreen" class="bg-purple-600 py-3 rounded font-bold shadow-lg col-span-2">Masuk Layar Penuh</button>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-target="tab-lock">Lockscreen</div>
                <div class="tab" data-target="tab-rec">Recorder & EVP</div>
            </div>

            <!-- Tab Lockscreen -->
            <div id="tab-lock" class="tab-content active">
                <div class="input-group">
                    <label>Background Lockscreen (Upload Gambar)</label>
                    <input type="file" id="file-bg-lockscreen" accept="image/*" class="text-sm">
                </div>
                
                <h3 class="font-bold text-blue-400 mt-6 mb-2">Kamus T9 (0-9)</h3>
                <div class="grid grid-cols-2 gap-2" id="t9-dict-inputs">
                    <!-- Digenerate via JS -->
                </div>
            </div>

            <!-- Tab Recorder & EVP -->
            <div id="tab-rec" class="tab-content">
                <div class="input-group">
                    <label>Background Recorder (Upload Gambar)</label>
                    <input type="file" id="file-bg-recorder" accept="image/*" class="text-sm">
                </div>

                <h3 class="font-bold text-blue-400 mt-6 mb-2">Pengaturan ElevenLabs</h3>
                <div class="input-group">
                    <label>API Key ElevenLabs</label>
                    <input type="password" id="el-api-key" placeholder="sk_...">
                </div>
                <div class="input-group">
                    <label>Voice ID</label>
                    <input type="text" id="el-voice-id" placeholder="21m00Tcm4TlvDq8ikWAM">
                </div>
                <div class="input-group">
                    <label>Delay Bisikan (Detik setelah trigger)</label>
                    <input type="number" step="0.1" id="evp-delay" placeholder="1.5">
                </div>
                <div class="input-group">
                    <label>Template Kalimat ([D1] untuk digit-1, [D2] dst)</label>
                    <textarea id="evp-template" rows="3" placeholder="Saya [D1], mati karena [D2], [D3]"></textarea>
                </div>
            </div>

            <div class="mt-8">
                <button id="btn-save-settings" class="w-full bg-blue-500 py-4 rounded font-bold text-lg shadow-[0_0_15px_rgba(59,130,246,0.5)]">Simpan Semua Pengaturan</button>
            </div>
        </div>
    </div>

    <script>
        // Default Configuration
        const defaultConfig = {
            t9: ["Budi", "Mawar", "Sakit", "Dibunuh", "Hantu", "Gelap", "Kedinginan", "Tersesat", "Kecelakaan", "Tumbal"],
            template: "Saya [D1], mati karena [D2], tolong saya [D3]",
            apiKey: "",
            voiceId: "21m00Tcm4TlvDq8ikWAM",
            delay: 1.5,
            layout: {
                t9_0: {x: 40, y: 80, w: 20, h: 10}, t9_1: {x: 20, y: 50, w: 20, h: 10}, t9_2: {x: 40, y: 50, w: 20, h: 10},
                t9_3: {x: 60, y: 50, w: 20, h: 10}, t9_4: {x: 20, y: 60, w: 20, h: 10}, t9_5: {x: 40, y: 60, w: 20, h: 10},
                t9_6: {x: 60, y: 60, w: 20, h: 10}, t9_7: {x: 20, y: 70, w: 20, h: 10}, t9_8: {x: 40, y: 70, w: 20, h: 10},
                t9_9: {x: 60, y: 70, w: 20, h: 10},
                rec: {x: 20, y: 85, w: 15, h: 10}, stop: {x: 42, y: 85, w: 15, h: 10}, play: {x: 65, y: 85, w: 15, h: 10},
                trigger: {x: 20, y: 30, w: 60, h: 30}
            }
        };

        // State Variables
        let state = {
            config: JSON.parse(localStorage.getItem('evp_config')) || defaultConfig,
            currentView: 'lockscreen', // 'lockscreen' or 'recorder'
            isEditMode: false,
            enteredDigits: [],
            evpAudioBuffer: null, // Holds the ElevenLabs fetched audio
            recorder: null,
            recordedChunks: [],
            startTime: 0,
            triggerTime: null,
            audioCtx: new (window.AudioContext || window.webkitAudioContext)(),
            finalMixedAudioBuffer: null // Result of the mix
        };

        // IndexedDB Helper for Images (Permanent Storage)
        const idb = {
            db: null,
            init() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open("EVP_DB", 1);
                    req.onupgradeneeded = (e) => {
                        let db = e.target.result;
                        if (!db.objectStoreNames.contains("images")) {
                            db.createObjectStore("images");
                        }
                    };
                    req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
                    req.onerror = (e) => reject(e);
                });
            },
            set(key, val) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction("images", "readwrite");
                    const store = tx.objectStore("images");
                    store.put(val, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            },
            get(key) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction("images", "readonly");
                    const store = tx.objectStore("images");
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
        };

        
        // Generate T9 Settings Inputs
        const t9Grid = document.getElementById('t9-dict-inputs');
        for (let i = 0; i <= 9; i++) {
            t9Grid.innerHTML += `
                <div class="input-group" style="margin-bottom: 5px;">
                    <label>Angka ${i}</label>
                    <input type="text" id="cfg-t9-${i}" value="${state.config.t9[i]}">
                </div>
            `;
        }

        // Generate T9 Stealth Buttons in Lockscreen
        const t9Container = document.getElementById('t9-container');
        for (let i = 0; i <= 9; i++) {
            t9Container.innerHTML += `<div id="btn-t9-${i}" class="stealth-btn t9-btn" data-id="t9_${i}" data-val="${i}">${i}</div>`;
        }

        // Populate Settings from State
        function populateSettings() {
            document.getElementById('el-api-key').value = state.config.apiKey;
            document.getElementById('el-voice-id').value = state.config.voiceId;
            document.getElementById('evp-delay').value = state.config.delay;
            document.getElementById('evp-template').value = state.config.template;
            for (let i = 0; i <= 9; i++) document.getElementById(`cfg-t9-${i}`).value = state.config.t9[i];
        }

        function saveSettings() {
            state.config.apiKey = document.getElementById('el-api-key').value;
            state.config.voiceId = document.getElementById('el-voice-id').value;
            state.config.delay = parseFloat(document.getElementById('evp-delay').value);
            state.config.template = document.getElementById('evp-template').value;
            for (let i = 0; i <= 9; i++) state.config.t9[i] = document.getElementById(`cfg-t9-${i}`).value;
            
            localStorage.setItem('evp_config', JSON.stringify(state.config));
            alert("Pengaturan Disimpan!");
        }

        // Load Backgrounds
        async function loadBackgrounds() {
            const lockBg = await idb.get('bg_lockscreen');
            const recBg = await idb.get('bg_recorder');
            if(lockBg) document.getElementById('view-lockscreen').style.backgroundImage = `url(${lockBg})`;
            if(recBg) document.getElementById('view-recorder').style.backgroundImage = `url(${recBg})`;
        }

        // Apply Layout config to DOM
        function applyLayout() {
            Object.keys(state.config.layout).forEach(id => {
                const cfg = state.config.layout[id];
                const el = document.querySelector(`[data-id="${id}"]`);
                if(el) {
                    el.style.left = `${cfg.x}%`;
                    el.style.top = `${cfg.y}%`;
                    el.style.width = `${cfg.w}%`;
                    el.style.height = `${cfg.h}%`;
                }
            });
        }


        // Secret Setting Trigger (Tap 3x in top right)
        let tapCount = 0;
        let tapTimer;
        document.getElementById('secret-settings-trigger').addEventListener('touchstart', (e) => {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 3) {
                tapCount = 0;
                document.getElementById('settings-modal').classList.add('active');
                populateSettings();
                // Context aware tab
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                if(state.currentView === 'lockscreen') {
                    document.querySelector('[data-target="tab-lock"]').classList.add('active');
                    document.getElementById('tab-lock').classList.add('active');
                } else {
                    document.querySelector('[data-target="tab-rec"]').classList.add('active');
                    document.getElementById('tab-rec').classList.add('active');
                }
            }
            tapTimer = setTimeout(() => tapCount = 0, 500);
        });

        document.getElementById('btn-close-settings').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.remove('active');
        });

        document.getElementById('btn-save-settings').addEventListener('click', saveSettings);

        // Tab Navigation
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        // Image Handlers (File to Base64 to IndexedDB)
        function handleImageUpload(inputId, dbKey) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const base64 = event.target.result;
                    await idb.set(dbKey, base64);
                    loadBackgrounds();
                    alert("Background berhasil diupload!");
                };
                reader.readAsDataURL(file);
            });
        }
        handleImageUpload('file-bg-lockscreen', 'bg_lockscreen');
        handleImageUpload('file-bg-recorder', 'bg_recorder');

        // Drag & Drop Editor
        const btnEditLayout = document.getElementById('btn-edit-layout');
        btnEditLayout.addEventListener('click', () => {
            state.isEditMode = !state.isEditMode;
            if(state.isEditMode) {
                document.body.classList.add('edit-mode');
                btnEditLayout.innerText = "Edit Layout Mode: ON";
                btnEditLayout.classList.replace('bg-blue-600', 'bg-red-600');
                document.getElementById('settings-modal').classList.remove('active'); // Auto close to edit
            } else {
                document.body.classList.remove('edit-mode');
                btnEditLayout.innerText = "Edit Layout Mode: OFF";
                btnEditLayout.classList.replace('bg-red-600', 'bg-blue-600');
                localStorage.setItem('evp_config', JSON.stringify(state.config)); // Save layout changes
            }
        });

        // Drag logic for stealth buttons
        let isDragging = false;
        let dragEl = null;
        let startX, startY, initX, initY;

        document.addEventListener('touchstart', (e) => {
            if(!state.isEditMode) return;
            if(e.target.classList.contains('stealth-btn')) {
                isDragging = true;
                dragEl = e.target;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                const id = dragEl.dataset.id;
                initX = state.config.layout[id].x;
                initY = state.config.layout[id].y;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if(!isDragging || !dragEl) return;
            e.preventDefault(); // Prevent scrolling
            const touch = e.touches[0];
            const dx = ((touch.clientX - startX) / window.innerWidth) * 100;
            const dy = ((touch.clientY - startY) / window.innerHeight) * 100;
            
            const newX = initX + dx;
            const newY = initY + dy;
            
            dragEl.style.left = `${newX}%`;
            dragEl.style.top = `${newY}%`;
            
            state.config.layout[dragEl.dataset.id].x = newX;
            state.config.layout[dragEl.dataset.id].y = newY;
        }, {passive: false});

        document.addEventListener('touchend', () => {
            isDragging = false;
            dragEl = null;
        });

        // Utilities
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        });

        document.getElementById('btn-req-mic').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Stop immediately, just wanted permission
                stream.getTracks().forEach(track => track.stop());
                alert("Izin Mikrofon Berhasil!");
            } catch (err) {
                alert("Gagal mendapat izin Mic: " + err.message);
            }
        });

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            state.currentView = viewName;
        }


        // Unlock audio context on first touch (iOS requirement)
        document.body.addEventListener('touchstart', () => {
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
        }, {once:true});

        // T9 Keypad Logic
        document.querySelectorAll('.t9-btn').forEach(btn => {
            btn.addEventListener('touchstart', async (e) => {
                if(state.isEditMode) return;
                
                const val = btn.dataset.val;
                state.enteredDigits.push(val);
                
                // Visual feedback (optional, tapi diminta stealth jadi tidak ada feedback layar)
                // Haptic feedback if supported
                if(navigator.vibrate) navigator.vibrate(50);

                if (state.enteredDigits.length === 3) {
                    // Eksekusi proses penyusunan kalimat
                    const d1 = state.enteredDigits[0];
                    const d2 = state.enteredDigits[1];
                    const d3 = state.enteredDigits[2];
                    
                    let prompt = state.config.template
                        .replace('[D1]', state.config.t9[d1])
                        .replace('[D2]', state.config.t9[d2])
                        .replace('[D3]', state.config.t9[d3]);
                    
                    console.log("Kalimat EVP:", prompt);
                    
                    // Switch UI secepatnya ke Recorder
                    switchView('recorder');
                    state.enteredDigits = []; // reset

                    // Background Fetch API
                    await fetchElevenLabs(prompt);
                }
            });
        });

        async function fetchElevenLabs(text) {
            if(!state.config.apiKey) {
                console.warn("ElevenLabs API Key kosong. Mode Dummy/Beep diaktifkan untuk simulasi.");
                createDummyAudio();
                return;
            }

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${state.config.voiceId}?optimize_streaming_latency=0`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'audio/mpeg',
                        'Content-Type': 'application/json',
                        'xi-api-key': state.config.apiKey
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: {
                            stability: 0.5,
                            similarity_boost: 0.8
                        }
                    })
                });

                if(!response.ok) throw new Error("Gagal fetch ElevenLabs");

                const arrayBuffer = await response.arrayBuffer();
                state.evpAudioBuffer = await state.audioCtx.decodeAudioData(arrayBuffer);
                console.log("EVP Audio Siap di memori.");
            } catch (e) {
                console.error("Error ElevenLabs:", e);
                createDummyAudio(); // Fallback agar trik tidak total gagal
            }
        }

        // Fallback dummy audio if no API key
        function createDummyAudio() {
            const sampleRate = state.audioCtx.sampleRate;
            const length = sampleRate * 2; // 2 seconds
            const buffer = state.audioCtx.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
                data[i] = Math.sin(i * 440 * Math.PI / sampleRate) * Math.exp(-i/(sampleRate)); // simple decaying beep
            }
            state.evpAudioBuffer = buffer;
            console.log("Dummy EVP Audio Created.");
        }


        // Recorder Buttons Logic
        const btnRec = document.getElementById('btn-rec');
        const btnStop = document.getElementById('btn-stop');
        const btnPlay = document.getElementById('btn-play');
        const btnTrigger = document.getElementById('area-trigger');

        btnRec.addEventListener('touchstart', async () => {
            if(state.isEditMode) return;
            if(navigator.vibrate) navigator.vibrate(50);
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.recorder = new MediaRecorder(stream);
                state.recordedChunks = [];
                state.triggerTime = null;

                state.recorder.ondataavailable = e => {
                    if (e.data.size > 0) state.recordedChunks.push(e.data);
                };

                state.recorder.onstop = async () => {
                    const blob = new Blob(state.recordedChunks);
                    await processAudioMix(blob);
                    // Matikan mic
                    stream.getTracks().forEach(track => track.stop());
                };

                state.startTime = Date.now();
                state.recorder.start();
                console.log("Recording started...");
            } catch (err) {
                alert("Error mic: Pastikan izin diberikan di settings.");
            }
        });

        btnTrigger.addEventListener('touchstart', () => {
            if(state.isEditMode || !state.recorder || state.recorder.state !== 'recording') return;
            if(navigator.vibrate) navigator.vibrate([20, 50, 20]); // Secret double vibrate for magician
            
            // Catat waktu presisi
            state.triggerTime = (Date.now() - state.startTime) / 1000;
            console.log("Secret Trigger hit at:", state.triggerTime, "seconds");
        });

        btnStop.addEventListener('touchstart', () => {
            if(state.isEditMode || !state.recorder || state.recorder.state !== 'recording') return;
            if(navigator.vibrate) navigator.vibrate(50);
            
            state.recorder.stop();
            console.log("Recording stopped. Processing Mix...");
        });

        btnPlay.addEventListener('touchstart', () => {
            if(state.isEditMode || !state.finalMixedAudioBuffer) return;
            if(navigator.vibrate) navigator.vibrate(50);
            
            // Play hasil mix
            const source = state.audioCtx.createBufferSource();
            source.buffer = state.finalMixedAudioBuffer;
            source.connect(state.audioCtx.destination);
            source.start();
            console.log("Playing mixed audio...");
        });

        // The Core Magic: OfflineAudioContext Mixing
        async function processAudioMix(recordedBlob) {
            try {
                // 1. Decode Recorded Audio
                const recordedArrayBuffer = await recordedBlob.arrayBuffer();
                const recBuffer = await state.audioCtx.decodeAudioData(recordedArrayBuffer);

                // Jika tidak ada trigger, atau EVP gagal diload, play rekaman asli saja
                if(state.triggerTime === null || !state.evpAudioBuffer) {
                    state.finalMixedAudioBuffer = recBuffer;
                    console.log("No trigger or EVP, playing original.");
                    return;
                }

                // 2. Setup Offline Context
                const evpBuffer = state.evpAudioBuffer;
                const injectionTime = state.triggerTime + state.config.delay;
                
                // Durasi mix = MAX(durasi rekaman asli, titik injeksi + durasi EVP)
                const totalDuration = Math.max(recBuffer.duration, injectionTime + evpBuffer.duration);
                const sampleRate = recBuffer.sampleRate;
                
                const offlineCtx = new OfflineAudioContext(
                    recBuffer.numberOfChannels, 
                    totalDuration * sampleRate, 
                    sampleRate
                );

                // 3. Layer 1: Rekaman Asli (Utuh tanpa putus)
                const sourceRec = offlineCtx.createBufferSource();
                sourceRec.buffer = recBuffer;
                sourceRec.connect(offlineCtx.destination);
                sourceRec.start(0);

                // 4. Layer 2: Suara EVP ElevenLabs
                const sourceEvp = offlineCtx.createBufferSource();
                sourceEvp.buffer = evpBuffer;
                
                // (Opsional) Tambahkan sedikit gain/efek jika ingin suara hantu lebih berbaur,
                // tapi kita sambungkan langsung dulu untuk kualitas jernih
                sourceEvp.connect(offlineCtx.destination);
                sourceEvp.start(injectionTime);

                // 5. Render
                state.finalMixedAudioBuffer = await offlineCtx.startRendering();
                console.log("Audio Mix Berhasil! Durasi:", state.finalMixedAudioBuffer.duration);

            } catch (err) {
                console.error("Error mixing audio:", err);
            }
        }

        // Initialize App
        window.onload = async () => {
            await idb.init();
            await loadBackgrounds();
            applyLayout();
            populateSettings();
            
            // Bypass alert standar di dalam iframe
            window.alert = function(msg) {
                console.log("ALERT:", msg);
                const alertBox = document.createElement('div');
                alertBox.innerHTML = `
                    <div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:white;padding:15px;border-radius:10px;z-index:9999;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.3);width:90%;font-size:14px;line-height:1.5;">
                        ${msg}
                    </div>
                `;
                document.body.appendChild(alertBox);
                setTimeout(() => alertBox.remove(), 6000);
            };

            // Pengecekan iOS Safari Standalone (Add to Home Screen)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const isStandalone = window.navigator.standalone;
            
            if (isIOS && !isStandalone) {
                setTimeout(() => {
                    alert("⚠️ <strong>Trik Sulap iOS:</strong><br><br>Untuk menghilangkan Safari UI dan Status Bar sepenuhnya, tap tombol <strong>Share</strong> di bawah, lalu pilih <strong>'Add to Home Screen'</strong> (Tambahkan ke Layar Utama). Buka aplikasi dari layar utama Anda untuk pentas.");
                }, 1000);
            }
        };
    </script>
</body>
