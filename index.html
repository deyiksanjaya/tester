<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice Memo">
<meta name="application-name" content="Voice Memo">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Voice Memo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #ffffff;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: -0.3px;
  }
</style>
</head>
<body class="fixed inset-0 w-full h-full flex flex-col bg-white">
  
  <div class="px-5 pt-[calc(env(safe-area-inset-top)+1rem)] pb-2 flex justify-between items-center relative z-20">
    <button class="w-11 h-11 bg-white/80 backdrop-blur-xl border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] rounded-full flex items-center justify-center text-black transition-transform active:scale-95">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    
    <div class="flex items-center gap-3">
      <button class="w-11 h-11 bg-white/80 backdrop-blur-xl border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] rounded-full flex items-center justify-center text-black transition-transform active:scale-95">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="bg-white/80 backdrop-blur-xl border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] rounded-full px-5 py-2.5 text-[15px] font-medium text-black transition-transform active:scale-95" id="selectBtnText">
        Select
      </button>
    </div>
  </div>

  <div class="px-5 pb-3">
    <h1 id="pageTitleText" class="text-[34px] font-bold text-black tracking-tight leading-none">Favorites</h1>
  </div>

  <div class="flex-1 overflow-y-auto px-5 pb-[140px]">
    
    <div class="h-[1px] bg-gray-200 w-full"></div>
    
    <div class="py-3 border-b border-gray-200">
      <div class="flex justify-between items-start">
        <div class="flex flex-col gap-0.5">
          <span id="activeTitle" class="font-semibold text-[17px] text-black">New Recording</span>
          <div class="flex items-center gap-1.5 text-[#8E8E93]">
            <span id="activeDate" class="text-[13px]">29 Sep 2026</span>
          </div>
        </div>
        <button id="dotsBtn" class="text-[#007AFF] focus:outline-none py-1">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        </button>
      </div>

      <div class="mt-4 flex flex-col gap-2">
        <div class="h-[5px] bg-[#E5E5EA] rounded-full relative w-full cursor-pointer" id="progressContainer">
          <div id="progressBar" class="absolute top-0 left-0 h-full bg-[#8E8E93] rounded-full w-0 pointer-events-none"></div>
        </div>
        <div class="flex justify-between text-[#8E8E93] text-[11px] font-medium">
          <span id="currentTimeDisplay">0.00</span>
          <span id="remainingTimeDisplay">0.00</span>
        </div>
        
        <div class="flex justify-between items-center mt-2 px-1">
          <button class="text-[#007AFF]">
             <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M8 8v8"/><path d="M16 8v8"/><path d="M4 11v2"/><path d="M20 11v2"/></svg>
          </button>
          
          <div class="flex items-center gap-8">
            <button id="rewindBtn" class="text-black">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" text-anchor="middle" font-size="7" font-weight="bold" font-family="sans-serif" stroke-width="0">15</text></svg>
            </button>
            
            <button id="playBtn" class="text-black w-8 h-8 flex items-center justify-center transition-transform active:scale-95">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>
            
            <button id="forwardBtn" class="text-black">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" text-anchor="middle" font-size="7" font-weight="bold" font-family="sans-serif" stroke-width="0">15</text></svg>
            </button>
          </div>
          
          <button class="text-[#007AFF]">
             <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="item2Container" class="py-3 border-b border-gray-200">
      <div class="flex justify-between items-center">
        <div class="flex flex-col gap-0.5">
          <span id="dummy1TitleText" class="font-semibold text-[17px] text-black">New Recording 2</span>
          <div class="flex items-center gap-1.5 text-[#8E8E93]">
            <span id="dummy1DateText" class="text-[13px]">13 Sep 2026</span>
          </div>
        </div>
        <span id="dummy1TimeText" class="text-[#8E8E93] text-[15px]">2.51</span>
      </div>
    </div>
    
    <div id="item3Container" class="py-3 border-b border-gray-200">
      <div class="flex justify-between items-center">
        <div class="flex flex-col gap-0.5">
          <span id="dummy2TitleText" class="font-semibold text-[17px] text-black">New Recording 3</span>
          <div class="flex items-center gap-1.5 text-[#8E8E93]">
            <span id="dummy2DateText" class="text-[13px]">13 Jun 2026</span>
          </div>
        </div>
        <span id="dummy2TimeText" class="text-[#8E8E93] text-[15px]">0.57</span>
      </div>
    </div>

    <div id="item4Container" class="py-3 border-b border-gray-200">
      <div class="flex justify-between items-center">
        <div class="flex flex-col gap-0.5">
          <span id="dummy3TitleText" class="font-semibold text-[17px] text-black">New Recording 4</span>
          <div class="flex items-center gap-1.5 text-[#8E8E93]">
            <span id="dummy3DateText" class="text-[13px]">22 Feb 2026</span>
          </div>
        </div>
        <span id="dummy3TimeText" class="text-[#8E8E93] text-[15px]">1.21</span>
      </div>
    </div>
    
  </div>

  <div class="absolute bottom-[calc(env(safe-area-inset-bottom)+32px)] left-1/2 -translate-x-1/2 pointer-events-none z-30">
    <div class="w-[68px] h-[68px] rounded-full border-4 border-white shadow-[0_4px_16px_rgba(0,0,0,0.12)] flex items-center justify-center bg-transparent pointer-events-auto">
      <div class="w-[54px] h-[54px] bg-[#FF3B30] rounded-full"></div>
    </div>
  </div>

  <div id="settingsModal" style="display: none;" class="fixed inset-0 bg-black/40 z-50 flex-col justify-end opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full rounded-t-3xl p-6 pb-12 flex flex-col shadow-xl translate-y-full transition-transform duration-300 max-h-[85vh]" id="settingsSheet">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Settings</h2>
        <button id="closeSettingsBtn" class="bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center font-bold text-gray-500">✕</button>
      </div>
      
      <div class="flex bg-[#F2F2F7] rounded-lg p-1 mb-6">
        <button id="tabAudioBtn" class="flex-1 py-1.5 text-[14px] font-semibold bg-white rounded shadow-sm text-black transition-all">Audio</button>
        <button id="tabConfigBtn" class="flex-1 py-1.5 text-[14px] font-semibold text-gray-500 transition-all">Config</button>
        <button id="tabUiBtn" class="flex-1 py-1.5 text-[14px] font-semibold text-gray-500 transition-all">UI</button>
      </div>
      
      <div id="tabAudioContent" class="flex flex-col gap-4 overflow-y-auto">
        <input type="text" id="titleInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300 font-semibold" placeholder="Recording Title">
        <textarea id="textInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none resize-none text-[15px] h-32 focus:ring-2 ring-gray-300" placeholder="Type text here..."></textarea>
        <button id="generateBtn" class="bg-black text-white font-semibold py-4 rounded-xl w-full active:bg-gray-800 transition-colors mt-2 flex-shrink-0">
          Generate Audio
        </button>
      </div>

      <div id="tabConfigContent" style="display: none;" class="flex-col gap-4 overflow-y-auto pb-4">
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-gray-500 uppercase px-1">API Key</label>
          <input type="password" id="apiKeyInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="ElevenLabs API Key">
        </div>
        
        <div class="flex flex-col gap-2 mt-4">
          <label class="text-xs font-semibold text-gray-500 uppercase px-1">Voices</label>
          <div id="voiceListContainer" class="flex flex-col gap-2 max-h-40 overflow-y-auto"></div>
          
          <div class="flex gap-2 mt-2">
            <input type="text" id="newVoiceName" class="w-1/3 bg-[#F2F2F7] rounded-xl p-3 outline-none text-[14px] focus:ring-2 ring-gray-300" placeholder="Name">
            <input type="text" id="newVoiceId" class="w-2/3 bg-[#F2F2F7] rounded-xl p-3 outline-none text-[14px] focus:ring-2 ring-gray-300" placeholder="Voice ID">
          </div>
          <button id="addVoiceBtn" class="bg-gray-200 text-black font-semibold py-3 rounded-xl w-full active:bg-gray-300 transition-colors mt-1 text-[14px]">
            Add Voice
          </button>
        </div>
      </div>

      <div id="tabUiContent" style="display: none;" class="flex-col gap-4 overflow-y-auto pb-4">
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-gray-500 uppercase px-1">Display</label>
          <div class="relative w-full">
            <select id="uiItemCount" class="w-full bg-[#F2F2F7] rounded-xl p-4 pr-10 outline-none text-[15px] focus:ring-2 ring-gray-300 appearance-none font-semibold text-black">
              <option value="4">Show 4 items</option>
              <option value="3">Show 3 items</option>
              <option value="2">Show 2 items</option>
              <option value="1">Show 1 item only</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-2 mt-2">
          <label class="text-xs font-semibold text-gray-500 uppercase px-1">Header UI</label>
          <input type="text" id="uiPageTitleInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Page Title (Favorites)">
          <input type="text" id="uiSelectBtnInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Button Text (Select)">
        </div>

        <div class="flex flex-col gap-2 mt-2" id="settingsItem2">
          <label class="text-xs font-semibold text-gray-500 uppercase px-1">Item 2</label>
          <input type="text" id="uiDummy1TitleInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Title">
          <div class="flex gap-2">
            <input type="text" id="uiDummy1DateInput" class="w-1/2 bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Date">
            <input type="text" id="uiDummy1TimeInput" class="w-1/2 bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Duration">
          </div>
        </div>

        <div class="flex flex-col gap-2 mt-2" id="settingsItem3">
          <label class="text-xs font-semibold text-gray-500 uppercase px-1">Item 3</label>
          <input type="text" id="uiDummy2TitleInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Title">
          <div class="flex gap-2">
            <input type="text" id="uiDummy2DateInput" class="w-1/2 bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Date">
            <input type="text" id="uiDummy2TimeInput" class="w-1/2 bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Duration">
          </div>
        </div>

        <div class="flex flex-col gap-2 mt-2" id="settingsItem4">
          <label class="text-xs font-semibold text-gray-500 uppercase px-1">Item 4</label>
          <input type="text" id="uiDummy3TitleInput" class="w-full bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Title">
          <div class="flex gap-2">
            <input type="text" id="uiDummy3DateInput" class="w-1/2 bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Date">
            <input type="text" id="uiDummy3TimeInput" class="w-1/2 bg-[#F2F2F7] rounded-xl p-4 outline-none text-[15px] focus:ring-2 ring-gray-300" placeholder="Duration">
          </div>
        </div>
        
        <button id="saveUiBtn" class="bg-black text-white font-semibold py-4 rounded-xl w-full active:bg-gray-800 transition-colors mt-4 flex-shrink-0">
          Save Changes
        </button>
      </div>
    </div>
  </div>

  <div id="floatingConsole" style="display: none;" class="fixed top-14 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-red-50 border border-red-200 rounded-xl p-4 shadow-lg z-[60] flex-col gap-2">
    <div class="flex justify-between items-center mb-1">
      <span class="text-xs font-semibold text-red-600 uppercase">Error</span>
      <button id="closeConsoleBtn" class="text-red-400 font-bold text-sm">✕</button>
    </div>
    <div id="consoleLogs" class="flex flex-col gap-1 text-sm text-red-500 break-words"></div>
  </div>

  <audio id="audioPlayer" class="hidden"></audio>

  <script>
    const dotsBtn = document.getElementById('dotsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsSheet = document.getElementById('settingsSheet');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const generateBtn = document.getElementById('generateBtn');
    const textInput = document.getElementById('textInput');
    const titleInput = document.getElementById('titleInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    
    const activeTitle = document.getElementById('activeTitle');
    const activeDate = document.getElementById('activeDate');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const remainingTimeDisplay = document.getElementById('remainingTimeDisplay');
    
    const floatingConsole = document.getElementById('floatingConsole');
    const consoleLogs = document.getElementById('consoleLogs');
    const closeConsoleBtn = document.getElementById('closeConsoleBtn');

    const tabAudioBtn = document.getElementById('tabAudioBtn');
    const tabConfigBtn = document.getElementById('tabConfigBtn');
    const tabUiBtn = document.getElementById('tabUiBtn');
    const tabAudioContent = document.getElementById('tabAudioContent');
    const tabConfigContent = document.getElementById('tabConfigContent');
    const tabUiContent = document.getElementById('tabUiContent');
    const saveUiBtn = document.getElementById('saveUiBtn');
    const uiItemCount = document.getElementById('uiItemCount');
    
    const apiKeyInput = document.getElementById('apiKeyInput');
    const voiceListContainer = document.getElementById('voiceListContainer');
    const newVoiceName = document.getElementById('newVoiceName');
    const newVoiceId = document.getElementById('newVoiceId');
    const addVoiceBtn = document.getElementById('addVoiceBtn');

    let tapCount = 0;
    let tapTimer;

    let savedVoices = JSON.parse(localStorage.getItem('ev_voices')) || [];
    let activeVoiceId = localStorage.getItem('ev_active_voice') || '';

    apiKeyInput.value = localStorage.getItem('ev_apikey') || '';
    
    apiKeyInput.addEventListener('input', (e) => {
      localStorage.setItem('ev_apikey', e.target.value.trim());
    });

    function renderVoices() {
      voiceListContainer.innerHTML = '';
      savedVoices.forEach((voice, index) => {
        const div = document.createElement('div');
        const isActive = voice.id === activeVoiceId;
        div.className = `flex justify-between items-center p-3 rounded-xl border cursor-pointer transition-colors ${isActive ? 'border-black bg-gray-50' : 'border-gray-200 bg-white'}`;
        
        div.onclick = () => {
          activeVoiceId = voice.id;
          localStorage.setItem('ev_active_voice', activeVoiceId);
          renderVoices();
        };

        const infoDiv = document.createElement('div');
        infoDiv.className = 'flex flex-col overflow-hidden pr-2';
        infoDiv.innerHTML = `
          <span class="font-semibold text-[15px] text-black truncate">${voice.name}</span>
          <span class="text-[12px] text-gray-500 truncate">${voice.id}</span>
        `;

        const delBtn = document.createElement('button');
        delBtn.className = 'text-red-500 p-2 flex-shrink-0';
        delBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          savedVoices.splice(index, 1);
          localStorage.setItem('ev_voices', JSON.stringify(savedVoices));
          if (activeVoiceId === voice.id) {
            activeVoiceId = savedVoices.length > 0 ? savedVoices[0].id : '';
            localStorage.setItem('ev_active_voice', activeVoiceId);
          }
          renderVoices();
        };

        div.appendChild(infoDiv);
        div.appendChild(delBtn);
        voiceListContainer.appendChild(div);
      });
    }

    addVoiceBtn.addEventListener('click', () => {
      const name = newVoiceName.value.trim();
      const id = newVoiceId.value.trim();
      if (name && id) {
        savedVoices.push({ name, id });
        localStorage.setItem('ev_voices', JSON.stringify(savedVoices));
        activeVoiceId = id;
        localStorage.setItem('ev_active_voice', activeVoiceId);
        newVoiceName.value = '';
        newVoiceId.value = '';
        renderVoices();
      }
    });

    renderVoices();

    function resetTabs() {
      const btns = [tabAudioBtn, tabConfigBtn, tabUiBtn];
      const contents = [tabAudioContent, tabConfigContent, tabUiContent];
      
      btns.forEach(btn => {
        btn.classList.remove('bg-white', 'shadow-sm', 'text-black');
        btn.classList.add('text-gray-500');
      });
      contents.forEach(content => content.style.display = 'none');
    }

    tabAudioBtn.addEventListener('click', () => {
      resetTabs();
      tabAudioBtn.classList.add('bg-white', 'shadow-sm', 'text-black');
      tabAudioBtn.classList.remove('text-gray-500');
      tabAudioContent.style.display = 'flex';
    });

    tabConfigBtn.addEventListener('click', () => {
      resetTabs();
      tabConfigBtn.classList.add('bg-white', 'shadow-sm', 'text-black');
      tabConfigBtn.classList.remove('text-gray-500');
      tabConfigContent.style.display = 'flex';
    });

    tabUiBtn.addEventListener('click', () => {
      resetTabs();
      tabUiBtn.classList.add('bg-white', 'shadow-sm', 'text-black');
      tabUiBtn.classList.remove('text-gray-500');
      tabUiContent.style.display = 'flex';
    });

    uiItemCount.addEventListener('change', () => {
      const count = parseInt(uiItemCount.value);
      document.getElementById('settingsItem2').style.display = count >= 2 ? 'flex' : 'none';
      document.getElementById('settingsItem3').style.display = count >= 3 ? 'flex' : 'none';
      document.getElementById('settingsItem4').style.display = count >= 4 ? 'flex' : 'none';
    });

    saveUiBtn.addEventListener('click', () => {
      const count = parseInt(uiItemCount.value);
      
      document.getElementById('item2Container').style.display = count >= 2 ? 'block' : 'none';
      document.getElementById('item3Container').style.display = count >= 3 ? 'block' : 'none';
      document.getElementById('item4Container').style.display = count >= 4 ? 'block' : 'none';

      const elements = [
        { input: 'uiPageTitleInput', target: 'pageTitleText' },
        { input: 'uiSelectBtnInput', target: 'selectBtnText' },
        { input: 'uiDummy1TitleInput', target: 'dummy1TitleText' },
        { input: 'uiDummy1DateInput', target: 'dummy1DateText' },
        { input: 'uiDummy1TimeInput', target: 'dummy1TimeText' },
        { input: 'uiDummy2TitleInput', target: 'dummy2TitleText' },
        { input: 'uiDummy2DateInput', target: 'dummy2DateText' },
        { input: 'uiDummy2TimeInput', target: 'dummy2TimeText' },
        { input: 'uiDummy3TitleInput', target: 'dummy3TitleText' },
        { input: 'uiDummy3DateInput', target: 'dummy3DateText' },
        { input: 'uiDummy3TimeInput', target: 'dummy3TimeText' }
      ];

      elements.forEach(item => {
        const inputVal = document.getElementById(item.input).value;
        if (inputVal.trim()) {
          document.getElementById(item.target).textContent = inputVal;
        }
      });
      
      closeSettingsBtn.click();
    });

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return "0.00";
      const m = Math.floor(Math.abs(seconds) / 60);
      const s = Math.floor(Math.abs(seconds) % 60);
      return `${seconds < 0 ? '-' : ''}${m}.${s.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
      const duration = audioPlayer.duration || 0;
      const current = audioPlayer.currentTime || 0;
      
      if (duration > 0) {
        const percent = (current / duration) * 100;
        progressBar.style.width = `${percent}%`;
        currentTimeDisplay.textContent = formatTime(current);
        remainingTimeDisplay.textContent = formatTime(current - duration);
      } else {
        progressBar.style.width = `0%`;
        currentTimeDisplay.textContent = "0.00";
        remainingTimeDisplay.textContent = "0.00";
      }
    }

    dotsBtn.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      
      if (tapCount >= 3) {
        settingsModal.style.display = 'flex';
        setTimeout(() => {
          settingsModal.classList.remove('opacity-0');
          settingsSheet.classList.remove('translate-y-full');
        }, 10);
        tapCount = 0;
      } else {
        tapTimer = setTimeout(() => {
          tapCount = 0;
        }, 400);
      }
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.classList.add('opacity-0');
      settingsSheet.classList.add('translate-y-full');
      setTimeout(() => {
        settingsModal.style.display = 'none';
      }, 300);
    });

    closeConsoleBtn.addEventListener('click', () => {
      floatingConsole.style.display = 'none';
    });

    function showError(message) {
      floatingConsole.style.display = 'flex';
      consoleLogs.innerHTML = '';
      const div = document.createElement('div');
      div.textContent = message;
      consoleLogs.appendChild(div);
    }

    function getFormattedDate() {
      const d = new Date();
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    generateBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();
      const userTitleInput = titleInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      
      let recCount = parseInt(localStorage.getItem('ev_rec_count')) || 1;
      const defaultTitle = recCount === 1 ? "New Recording" : `New Recording ${recCount}`;
      const title = userTitleInput || defaultTitle;
      
      if (!text) return;
      if (!apiKey) {
        showError("API Key is missing. Please add it in the Config tab.");
        return;
      }
      if (!activeVoiceId) {
        showError("Please select or add a Voice ID in the Config tab.");
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'Generating...';

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${activeVoiceId}`, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'xi-api-key': apiKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            text: text,
            model_id: 'eleven_multilingual_v2',
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75
            }
          })
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        
        audioPlayer.src = url;
        audioPlayer.load();
        
        activeTitle.textContent = title;
        activeDate.textContent = getFormattedDate();

        if (!userTitleInput) {
          localStorage.setItem('ev_rec_count', recCount + 1);
        }

        closeSettingsBtn.click();
        textInput.value = '';
        titleInput.value = '';
        
      } catch (error) {
        showError(error.message);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Audio';
      }
    });

    function togglePlay() {
      if (!audioPlayer.src) return;
      
      if (audioPlayer.paused) {
        audioPlayer.play();
        playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      } else {
        audioPlayer.pause();
        playBtn.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      }
    }

    playBtn.addEventListener('click', togglePlay);

    rewindBtn.addEventListener('click', () => {
      if (!audioPlayer.src) return;
      audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 15);
      updateProgress();
    });

    forwardBtn.addEventListener('click', () => {
      if (!audioPlayer.src) return;
      audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 15);
      updateProgress();
    });

    audioPlayer.addEventListener('loadedmetadata', updateProgress);
    audioPlayer.addEventListener('timeupdate', updateProgress);

    audioPlayer.addEventListener('ended', () => {
      playBtn.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      updateProgress();
    });

    progressContainer.addEventListener('click', (e) => {
      if (!audioPlayer.src || !audioPlayer.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audioPlayer.currentTime = pos * audioPlayer.duration;
    });

  </script>
</body>
</html>
