<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas {
            display: none;
        }
        #display-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            z-index: 1;
        }
        #result-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            opacity: 0.8;
            max-height: calc(100% - 160px);
            overflow-y: auto;
            width: 100%;
            text-align: left;
            pointer-events: none;
            display: none;
        }
        #peek-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: calc(90% - 140px);
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
        }
        #stealth-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
            transition: background 0.3s;
        }
        .dot-success {
            background: #4ade80 !important;
        }
        .dot-error {
            background: #f87171 !important;
        }
        #main-console {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #38bdf8;
            z-index: 4;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }
        .console-line {
            margin-bottom: 4px;
            line-height: 1.4;
            word-break: break-all;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #222;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #eee;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #fff;
        }
        #slider-value {
            font-size: 14px;
            color: #fff;
            min-width: 30px;
            text-align: right;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #555;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="peek-img" src="" alt="">

    <div id="stealth-dot"></div>

    <div id="display-area">
        <div id="result-text"></div>
    </div>

    <div id="main-console"></div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">Konfigurasi</div>
            <div class="input-group">
                <span class="input-label">Kredensial API</span>
                <input type="text" id="api-key-input" placeholder="Google Cloud Vision Key" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Modul Kamera</span>
                <select id="camera-select">
                    <option value="environment">Kamera Utama</option>
                    <option value="user">Kamera Depan</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Metode Operasi</span>
                <select id="mode-select">
                    <option value="ocr">Cloud OCR</option>
                    <option value="peek">Peek Picture</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Interval Snapshot (Otomatis)</span>
                <select id="interval-select">
                    <option value="500">0.5 Detik</option>
                    <option value="1000">1 Detik</option>
                    <option value="2000">2 Detik</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Sensitivitas MediaPipe (Skor Minimal)</span>
                <div class="slider-container">
                    <input type="range" id="sensitivity-slider" min="10" max="90" step="5">
                    <span id="slider-value">40%</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Tutup</button>
                <button class="btn-primary" id="save-btn">Simpan</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultText = document.getElementById('result-text');
        const peekImg = document.getElementById('peek-img');
        const stealthDot = document.getElementById('stealth-dot');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const cameraSelect = document.getElementById('camera-select');
        const modeSelect = document.getElementById('mode-select');
        const intervalSelect = document.getElementById('interval-select');
        const sensitivitySlider = document.getElementById('sensitivity-slider');
        const sliderValue = document.getElementById('slider-value');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');
        const mainConsole = document.getElementById('main-console');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentFacingMode = localStorage.getItem('stealthScannerCamera') || 'environment';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let currentInterval = parseInt(localStorage.getItem('stealthScannerInterval')) || 2000;
        let currentSensitivity = parseInt(localStorage.getItem('stealthScannerSensitivity')) || 40;
        
        let scanIntervalId = null;
        let isProcessing = false;
        let peekImageSrc = '';
        let extractedText = '';
        
        let tapCount = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        let detectorInstance = null;

        sensitivitySlider.value = currentSensitivity;
        sliderValue.innerText = currentSensitivity + '%';

        document.addEventListener('contextmenu', e => e.preventDefault());

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#38bdf8';
            if (type === 'error') color = '#f87171';
            if (type === 'success') color = '#4ade80';
            mainConsole.innerHTML += `<div class="console-line" style="color: ${color};">[${time}] ${msg}</div>`;
            mainConsole.scrollTop = mainConsole.scrollHeight;
        }

        sensitivitySlider.addEventListener('input', (e) => {
            sliderValue.innerText = e.target.value + '%';
        });

        log('Sistem aktif. Mempersiapkan MediaPipe lokal...');

        async function initMediaPipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
                );
                detectorInstance = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
                        delegate: "GPU"
                    },
                    scoreThreshold: currentSensitivity / 100,
                    runningMode: "IMAGE"
                });
                log('MediaPipe Object Detector siap digunakan secara lokal.', 'success');
            } catch (err) {
                log('Gagal memuat MediaPipe lokal: ' + err.message, 'error');
            }
        }

        initMediaPipe();

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            
            holdTimeout = setTimeout(() => {
                isHolding = true;
                if (currentMode === 'peek' && peekImageSrc) {
                    peekImg.src = peekImageSrc;
                    peekImg.style.display = 'block';
                    log('Menampilkan gambar hasil crop.');
                } else if (currentMode === 'ocr' && extractedText) {
                    resultText.innerText = extractedText;
                    resultText.style.display = 'block';
                    log('Menampilkan hasil teks.');
                }
            }, 200);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                peekImg.style.display = 'none';
                peekImg.src = '';
                resultText.style.display = 'none';
                log('Tampilan disembunyikan kembali.');
                e.preventDefault();
            } else {
                if (e.type === 'pointerup') {
                    tapCount++;
                    clearTimeout(tapTimeout);
                    
                    if (tapCount === 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        cameraSelect.value = currentFacingMode;
                        modeSelect.value = currentMode;
                        intervalSelect.value = currentInterval.toString();
                        sensitivitySlider.value = currentSensitivity;
                        sliderValue.innerText = currentSensitivity + '%';
                        tapCount = 0;
                        log('Menu konfigurasi dibuka.');
                    } else {
                        tapTimeout = setTimeout(() => {
                            if (tapCount === 2) {
                                if (scanIntervalId || video.srcObject) {
                                    log('Mematikan kamera...');
                                    stopCamera();
                                } else {
                                    log('Menghubungkan kamera...');
                                    startSystem();
                                }
                            }
                            tapCount = 0;
                        }, 250);
                    }
                }
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentFacingMode = cameraSelect.value;
            currentMode = modeSelect.value;
            currentInterval = parseInt(intervalSelect.value);
            currentSensitivity = parseInt(sensitivitySlider.value);

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerCamera', currentFacingMode);
            localStorage.setItem('stealthScannerMode', currentMode);
            localStorage.setItem('stealthScannerInterval', currentInterval);
            localStorage.setItem('stealthScannerSensitivity', currentSensitivity);

            if (detectorInstance) {
                detectorInstance.setOptions({ scoreThreshold: currentSensitivity / 100 });
            }

            settingsModal.style.display = 'none';
            
            resultText.innerText = '';
            extractedText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            stealthDot.className = '';
            
            log(`Konfigurasi disimpan. Mode: ${currentMode}, Kamera: ${currentFacingMode}, Interval: ${currentInterval}ms, Sensitivitas: ${currentSensitivity}%`);
            stopCamera();
        });

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            isProcessing = false;
            log('Kamera nonaktif.');
        }

        async function startSystem() {
            if (scanIntervalId) return;
            stealthDot.className = '';
            
            try {
                if (!detectorInstance) {
                    log('Menunggu MediaPipe lokal siap...', 'error');
                    return;
                }
                log(`Mengaktifkan kamera video (${currentFacingMode})...`);
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;
                
                scanIntervalId = setInterval(processSnapshot, currentInterval);
                log(`Mulai pemindaian otomatis setiap ${currentInterval / 1000} detik.`);
            } catch (err) {
                log('Gagal mengakses kamera: ' + err.message, 'error');
                stealthDot.className = 'dot-error';
            }
        }

        async function processSnapshot() {
            if (!video.videoWidth || isProcessing || !detectorInstance) return;
            isProcessing = true;

            const targetWidth = 400;
            const scale = targetWidth / video.videoWidth;
            canvas.width = targetWidth;
            canvas.height = video.videoHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            log('Menganalisis frame secara lokal dengan MediaPipe...');
            try {
                const detections = detectorInstance.detect(canvas).detections;
                
                const targetLabels = ['pen', 'pencil', 'book', 'paper', 'cell phone', 'laptop', 'hand', 'apple', 'banana', 'cup', 'bottle'];
                const matched = detections.find(d => {
                    const label = d.categories[0].categoryName.toLowerCase();
                    const score = d.categories[0].score * 100;
                    return targetLabels.some(t => label.includes(t)) && score >= currentSensitivity;
                });

                if (matched) {
                    const labelName = matched.categories[0].categoryName;
                    const matchScore = Math.round(matched.categories[0].score * 100);
                    log(`Objek valid terdeteksi lokal: ${labelName} (${matchScore}%). Menghentikan kamera.`);
                    stopCamera();

                    const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                    await sendToCloudVision(base64Image);
                } else {
                    log('Tidak ada objek tulisan/alat penunjang yang terdeteksi di frame.');
                }
            } catch (err) {
                log('Gagal menganalisis lokal: ' + err.message, 'error');
            }
            isProcessing = false;
        }

        async function sendToCloudVision(base64String) {
            if (!visionApiKey) {
                log('Kunci API tidak ditemukan.', 'error');
                stealthDot.className = 'dot-error';
                return;
            }

            log('Menghubungi Cloud Vision API...');
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0].fullTextAnnotation) {
                    const textResult = data.responses[0].fullTextAnnotation.text;
                    log('Respons Cloud OCR diterima.', 'success');
                    
                    if (currentMode === 'ocr') {
                        extractedText = textResult;
                        stealthDot.className = 'dot-success';
                        log('Teks berhasil disimpan. Siap di-peeking.', 'success');
                    } else if (currentMode === 'peek') {
                        const annotations = data.responses[0].textAnnotations;
                        if (annotations && annotations.length > 0) {
                            const vertices = annotations[0].boundingPoly.vertices;
                            let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                            
                            vertices.forEach(v => {
                                const x = v.x || 0;
                                const y = v.y || 0;
                                if (x < minX) minX = x;
                                if (y < minY) minY = y;
                                if (x > maxX) maxX = x;
                                if (y > maxY) maxY = y;
                            });

                            const pad = 15;
                            minX = Math.max(0, minX - pad);
                            minY = Math.max(0, minY - pad);
                            maxX = Math.min(canvas.width, maxX + pad);
                            maxY = Math.min(canvas.height, maxY + pad);

                            const w = maxX - minX;
                            const h = maxY - minY;

                            if (w > 0 && h > 0) {
                                const cropCanvas = document.createElement('canvas');
                                cropCanvas.width = w;
                                cropCanvas.height = h;
                                const cropCtx = cropCanvas.getContext('2d');
                                cropCtx.drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
                                peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.9);
                                stealthDot.className = 'dot-success';
                                log('Pemotongan gambar tulisan selesai. Siap di-peeking.', 'success');
                            }
                        }
                    }
                } else {
                    stealthDot.className = 'dot-error';
                    log('Cloud OCR gagal mengenali teks.', 'error');
                }
            } catch (err) {
                stealthDot.className = 'dot-error';
                log('Koneksi Cloud OCR gagal: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
