<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F2F2F7"> 
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            margin: 0; padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #F2F2F7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        ::-webkit-scrollbar { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        #display-image-1, #display-image-2 {
            transition-property: opacity;
            transition-timing-function: ease-in-out;
        }
    </style>
</head>
<body class="text-black w-screen h-screen flex flex-col select-none overflow-hidden">

<div id="dashboard-screen" class="flex-1 flex flex-col w-full h-full overflow-y-auto relative pb-32">
    <div class="px-6 pb-4 pt-12 bg-[#F2F2F7] sticky top-0 z-20 border-b border-gray-200/50 flex justify-between items-end">
        <h1 class="text-3xl font-bold tracking-tight">Gallery</h1>
        <button onclick="openGlobalSettings()" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center active:bg-gray-100 transition-colors border border-gray-200 text-[#007AFF]">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
    </div>

    <div id="image-list" class="flex flex-col gap-6 w-full max-w-md mx-auto px-4 mt-6"></div>

    <div class="flex flex-col items-center justify-center cursor-pointer mt-6 mb-10 w-full max-w-md mx-auto px-4" onclick="document.getElementById('file-input').click()">
        <div class="w-full py-8 bg-white rounded-2xl flex flex-col items-center justify-center active:bg-gray-100 transition-colors shadow-sm border border-gray-100">
            <svg width="40" height="40" class="text-[#007AFF] mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4" />
            </svg>
            <p class="text-[17px] text-[#007AFF] font-medium">Add Media</p>
        </div>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display: none;">
</div>

<div class="fixed bottom-0 left-0 w-full bg-[#F9F9F9]/90 backdrop-blur-xl border-t border-gray-300/60 z-30 pb-8 pt-4">
    <div class="w-full max-w-md mx-auto px-4 flex gap-3">
        <button onclick="startPerform()" class="flex-1 bg-black text-white rounded-xl py-3.5 text-[17px] font-semibold active:bg-gray-800 transition-colors flex items-center justify-center gap-2 shadow-sm">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>
            View
        </button>
        <button onclick="openAIModal()" class="flex-1 bg-[#007AFF] text-white rounded-xl py-3.5 text-[17px] font-semibold active:bg-[#005bb5] transition-colors flex items-center justify-center gap-2 shadow-sm">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            Generate
        </button>
    </div>
</div>

<div id="image-screen" class="fixed inset-0 bg-black z-40" style="display: none;">
    <img id="display-image-1" class="absolute inset-0 w-full h-full object-cover pointer-events-none opacity-100" alt="View 1">
    <img id="display-image-2" class="absolute inset-0 w-full h-full object-cover pointer-events-none opacity-0" alt="View 2">
    <div id="touch-area" class="absolute inset-0 z-10 touch-none"></div>
    <div id="image-overlay-top" class="absolute top-0 left-0 w-full px-4 pt-14 flex justify-between items-start bg-gradient-to-b from-black/60 to-transparent transition-opacity duration-300 h-[140px] z-20 pointer-events-none">
        <button onclick="closeFullscreen()" class="text-[#007AFF] flex items-center gap-1 text-[17px] active:opacity-50 pointer-events-auto">
            <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
            Gallery
        </button>
        <div class="flex gap-4 pointer-events-auto">
            <button id="btn-hapus" class="text-white active:opacity-50">
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </button>
        </div>
    </div>
</div>

<div id="global-settings-modal" class="fixed inset-0 bg-black/40 items-center justify-center z-50 p-4 transition-opacity duration-300" style="display: none; opacity: 0;">
    <div class="bg-[#F2F2F7] rounded-[20px] w-full max-w-[340px] flex flex-col text-left overflow-hidden transform scale-95 transition-transform duration-300" id="global-settings-box">
        <div class="p-5 pb-4">
            <h3 class="text-[17px] font-semibold text-black mb-1 text-center">Settings</h3>
            <p class="text-[13px] text-gray-500 mb-5 text-center">API Configuration</p>
            <div class="mb-4">
                <label class="text-[13px] text-gray-500 font-medium mb-1.5 block uppercase tracking-wide px-1">API Key</label>
                <input type="password" id="global-api-key" class="w-full bg-white rounded-xl px-4 py-3 text-[15px] outline-none focus:ring-2 focus:ring-[#007AFF] transition-all shadow-sm border border-gray-200" placeholder="Google API Key">
            </div>
            <div class="mb-2">
                <label class="text-[13px] text-gray-500 font-medium mb-1.5 block uppercase tracking-wide px-1">AI Model</label>
                <input type="text" id="global-model-name" class="w-full bg-white rounded-xl px-4 py-3 text-[15px] outline-none focus:ring-2 focus:ring-[#007AFF] transition-all shadow-sm border border-gray-200" placeholder="gemini-2.0-flash-preview-image-generation">
            </div>
        </div>
        <div class="flex border-t border-gray-300/80 bg-white">
            <button onclick="closeGlobalSettings()" class="flex-1 py-3.5 text-[17px] text-[#007AFF] active:bg-gray-100 transition-colors border-r border-gray-200">Cancel</button>
            <button onclick="saveGlobalSettings()" class="flex-1 py-3.5 text-[17px] font-semibold text-[#007AFF] active:bg-gray-100 transition-colors">Save</button>
        </div>
    </div>
</div>

<div id="ai-modal" class="fixed inset-0 bg-black/40 items-center justify-center z-50 p-4 transition-opacity duration-300" style="display: none; opacity: 0;">
    <div class="bg-white rounded-[20px] w-full max-w-[340px] flex flex-col text-left overflow-hidden transform scale-95 transition-transform duration-300" id="ai-modal-box">
        <div class="p-5 pb-4">
            <h3 class="text-[17px] font-semibold text-black mb-1 text-center">Generator</h3>
            <p class="text-[13px] text-gray-500 mb-4 text-center">Create visual concepts</p>
            <textarea id="ai-prompt" class="w-full bg-[#F2F2F7] rounded-xl p-3 outline-none text-[15px] resize-none text-black placeholder-gray-400 border border-transparent focus:border-[#007AFF] transition-colors" rows="3" placeholder="Describe the image..."></textarea>
            <div class="mt-4" id="ai-ref-section">
                <div id="ref-image-container" class="relative w-16 h-16 mb-3" style="display: none;">
                    <img id="ref-image-preview" class="w-full h-full object-cover rounded-[8px] border border-gray-200">
                    <button onclick="clearRefImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow active:scale-90">✕</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('ref-file-input').click()" class="bg-gray-100 text-[#007AFF] px-3 py-1.5 rounded-full text-[13px] font-medium active:bg-gray-200 flex items-center gap-1.5 transition-colors">
                        Upload Ref
                    </button>
                    <button onclick="showGalleryRefPicker()" class="bg-gray-100 text-[#007AFF] px-3 py-1.5 rounded-full text-[13px] font-medium active:bg-gray-200 flex items-center gap-1.5 transition-colors">
                        Gallery
                    </button>
                </div>
                <div id="gallery-ref-picker" class="mt-3 w-full overflow-x-auto pb-1 scroll-smooth gap-2" style="display: none;"></div>
            </div>
            <input type="file" id="ref-file-input" accept="image/*" style="display: none;">
            <div id="ai-loading" class="items-center justify-center py-4" style="display: none;">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#007AFF]"></div>
            </div>
        </div>
        <div class="flex border-t border-gray-200" id="ai-actions">
            <button onclick="closeAIModal()" class="flex-1 py-3.5 text-[17px] text-[#007AFF] active:bg-gray-100 transition-colors border-r border-gray-200">Cancel</button>
            <button onclick="generateAIImage()" class="flex-1 py-3.5 text-[17px] font-semibold text-[#007AFF] active:bg-gray-100 transition-colors">Generate</button>
        </div>
    </div>
</div>

<div id="toast-container" class="fixed top-14 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none w-max max-w-[90%]"></div>

<script>
    const manifestBlob = new Blob([JSON.stringify({
        name: "Gallery", short_name: "Gallery", start_url: location.href, display: "standalone", background_color: "#000000", theme_color: "#000000"
    })], {type: 'application/json'});
    document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

    let appGlobalSettings = {
        apiKey: '',
        modelName: 'gemini-2.0-flash-preview-image-generation'
    };

    function loadGlobalSettings() {
        const saved = localStorage.getItem('galleryGlobalSettings_v1');
        if (saved) appGlobalSettings = JSON.parse(saved);
    }

    function openGlobalSettings() {
        document.getElementById('global-api-key').value = appGlobalSettings.apiKey;
        document.getElementById('global-model-name').value = appGlobalSettings.modelName;
        const modal = document.getElementById('global-settings-modal');
        const box = document.getElementById('global-settings-box');
        modal.style.display = 'flex';
        setTimeout(() => { modal.style.opacity = '1'; box.classList.remove('scale-95'); }, 10);
    }

    function closeGlobalSettings() {
        const modal = document.getElementById('global-settings-modal');
        const box = document.getElementById('global-settings-box');
        modal.style.opacity = '0'; box.classList.add('scale-95');
        setTimeout(() => { modal.style.display = 'none'; }, 300);
    }

    function saveGlobalSettings() {
        appGlobalSettings.apiKey = document.getElementById('global-api-key').value.trim();
        appGlobalSettings.modelName = document.getElementById('global-model-name').value.trim() || 'gemini-2.0-flash-preview-image-generation';
        localStorage.setItem('galleryGlobalSettings_v1', JSON.stringify(appGlobalSettings));
        closeGlobalSettings();
        showToast("Settings saved");
    }

    loadGlobalSettings();

    const DB_NAME = 'ImageViewerDB_iOS_v2';
    const STORE_NAME = 'gallery_images';
    let globalImages = []; 
    let currentIndex = 0;
    let activeImageLayer = 1; 
    let isPerformMode = false;

    const DEFAULT_SETTINGS = { transition: 'fade', trigger: 'tap', duration: 0.5 };

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveImageToDB(file, isAI = false) {
        const db = await openDB();
        return new Promise((resolve) => {
            const transaction = db.transaction(STORE_NAME, 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.add({ file: file, timestamp: new Date().getTime(), isAI: isAI, settings: { ...DEFAULT_SETTINGS } });
            request.onsuccess = () => resolve(request.result);
        });
    }

    async function updateImageInDB(record) {
        const db = await openDB();
        return new Promise((resolve) => {
            const transaction = db.transaction(STORE_NAME, 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.put(record); 
            request.onsuccess = () => resolve();
        });
    }

    async function getAllImagesFromDB() {
        const db = await openDB();
        return new Promise((resolve) => {
            const transaction = db.transaction(STORE_NAME, 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result.sort((a,b) => a.timestamp - b.timestamp));
        });
    }

    async function deleteImageFromDB(id) {
        const db = await openDB();
        return new Promise((resolve) => {
            const transaction = db.transaction(STORE_NAME, 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(id);
            request.onsuccess = () => resolve();
        });
    }

    const dashboardScreen = document.getElementById('dashboard-screen');
    const imageScreen = document.getElementById('image-screen');
    const fileInput = document.getElementById('file-input');
    const imageListContainer = document.getElementById('image-list');
    const toastContainer = document.getElementById('toast-container');
    const overlayTop = document.getElementById('image-overlay-top');

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = `bg-black/80 backdrop-blur-md text-white px-5 py-2.5 rounded-full shadow-lg text-[15px] flex items-center justify-center animate-slide-up pointer-events-auto z-50`;
        toast.innerHTML = `<span>${message}</span>`;
        toastContainer.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2000);
    }

    async function updateQuickSetting(id, key, value, element) {
        const imgRecord = globalImages.find(i => i.id === id);
        if (!imgRecord) return;
        if (!imgRecord.settings) imgRecord.settings = { ...DEFAULT_SETTINGS };
        if (key === 'duration') {
            imgRecord.settings[key] = value === '' ? 0 : parseFloat(value);
        } else {
            imgRecord.settings[key] = value;
            const parent = element.parentElement;
            parent.querySelectorAll('button').forEach(btn => {
                btn.className = 'flex-1 text-[13px] py-1.5 rounded-[6px] text-gray-500 bg-transparent transition-all';
            });
            element.className = 'flex-1 text-[13px] py-1.5 rounded-[6px] bg-white shadow-sm font-semibold text-black transition-all';
        }
        await updateImageInDB(imgRecord);
    }

    async function loadDashboard() {
        imageListContainer.innerHTML = '';
        globalImages = await getAllImagesFromDB();
        if (globalImages.length === 0) return;
        globalImages.forEach((imgData, index) => {
            const objectUrl = URL.createObjectURL(imgData.file);
            const title = imgData.isAI ? `Media ${index + 1}` : `Media ${index + 1}`;
            const imgSet = imgData.settings || DEFAULT_SETTINGS;
            const itemHTML = `
                <div class="bg-white rounded-[14px] overflow-hidden shadow-sm animate-fade-in border border-black/5">
                    <div class="px-4 py-3 border-b border-black/5">
                        <h2 class="text-[17px] font-medium text-black">${title}</h2>
                    </div>
                    <div class="w-full h-60 bg-gray-100 cursor-pointer" onclick="openFullscreen(${index})">
                        <img src="${objectUrl}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4 bg-[#FAFAFA] flex flex-col gap-3 border-t border-black/5">
                        <div class="flex justify-between items-center">
                            <span class="text-[14px] text-gray-600 font-medium">Transition</span>
                            <div class="flex bg-gray-200/80 rounded-[8px] p-0.5 w-[160px]">
                                <button onclick="updateQuickSetting(${imgData.id}, 'transition', 'fade', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${imgSet.transition === 'fade' ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Fade</button>
                                <button onclick="updateQuickSetting(${imgData.id}, 'transition', 'instant', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${imgSet.transition !== 'fade' ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Instant</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[14px] text-gray-600 font-medium">Trigger</span>
                            <div class="flex bg-gray-200/80 rounded-[8px] p-0.5 w-[160px]">
                                <button onclick="updateQuickSetting(${imgData.id}, 'trigger', 'tap', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${imgSet.trigger === 'tap' ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Tap</button>
                                <button onclick="updateQuickSetting(${imgData.id}, 'trigger', 'swipe', this)" class="flex-1 text-[13px] py-1.5 rounded-[6px] transition-all ${imgSet.trigger !== 'tap' ? 'bg-white shadow-sm font-semibold text-black' : 'text-gray-500'}">Swipe</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            imageListContainer.insertAdjacentHTML('beforeend', itemHTML);
        });
    }

    function startPerform() {
        if (globalImages.length === 0) { showToast("Add an image first"); return; }
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
        }
        isPerformMode = true;
        overlayTop.style.display = 'none';
        openFullscreen(0); 
    }

    function openFullscreen(index) {
        if (globalImages.length === 0) return;
        currentIndex = Math.max(0, Math.min(index, globalImages.length - 1));
        const url = URL.createObjectURL(globalImages[currentIndex].file);
        const img1 = document.getElementById('display-image-1');
        const img2 = document.getElementById('display-image-2');
        img1.style.transitionDuration = '0s'; img2.style.transitionDuration = '0s';
        img1.src = url; img1.style.opacity = '1'; img2.style.opacity = '0'; activeImageLayer = 1;
        dashboardScreen.style.display = 'none';
        imageScreen.style.display = 'block';
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
    }

    function closeFullscreen() {
        imageScreen.style.display = 'none';
        dashboardScreen.style.display = 'flex';
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F2F2F7");
        isPerformMode = false;
        overlayTop.style.display = 'flex';
        if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    }

    function changeImage(direction = 'next') {
        if (globalImages.length <= 1) return;
        const currentImgSettings = globalImages[currentIndex].settings || DEFAULT_SETTINGS;
        if (direction === 'next') currentIndex = (currentIndex + 1) % globalImages.length;
        else currentIndex = (currentIndex - 1 + globalImages.length) % globalImages.length;
        const url = URL.createObjectURL(globalImages[currentIndex].file);
        const img1 = document.getElementById('display-image-1');
        const img2 = document.getElementById('display-image-2');
        let dur = currentImgSettings.transition === 'instant' ? 0 : parseFloat(currentImgSettings.duration ?? DEFAULT_SETTINGS.duration);
        img1.style.transitionDuration = `${dur}s`; img2.style.transitionDuration = `${dur}s`;
        if (activeImageLayer === 1) { img2.src = url; img2.style.opacity = '1'; img1.style.opacity = '0'; activeImageLayer = 2; }
        else { img1.src = url; img1.style.opacity = '1'; img2.style.opacity = '0'; activeImageLayer = 1; }
    }

    const touchArea = document.getElementById('touch-area');
    let startX = 0, startY = 0, isTwoFingerGesture = false, twoFingerStartY = null;

    touchArea.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            isTwoFingerGesture = true;
            twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            e.preventDefault(); 
        } else if (e.touches.length === 1) {
            isTwoFingerGesture = false;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        }
    }, { passive: false });

    touchArea.addEventListener('touchmove', (e) => {
        if (isTwoFingerGesture || e.touches.length === 2) e.preventDefault();
    }, { passive: false });

    touchArea.addEventListener('touchend', (e) => {
        if (isTwoFingerGesture) {
            if (e.touches.length === 0 && twoFingerStartY !== null) {
                const endY = (e.changedTouches[0].clientY + (e.changedTouches[1]?.clientY ?? e.changedTouches[0].clientY)) / (e.changedTouches.length > 1 ? 2 : 1);
                if ((endY - twoFingerStartY) > 50) closeFullscreen();
                twoFingerStartY = null; isTwoFingerGesture = false;
            }
            return; 
        }
        if (e.changedTouches.length === 1) {
            let diffX = startX - e.changedTouches[0].clientX;
            let diffY = startY - e.changedTouches[0].clientY;
            let distance = Math.sqrt(diffX*diffX + diffY*diffY);
            const activeTrigger = (globalImages[currentIndex]?.settings || DEFAULT_SETTINGS).trigger;
            if (distance < 10) { 
                if (activeTrigger === 'tap') changeImage('next'); 
            } else { 
                if (activeTrigger === 'swipe' && Math.abs(diffX) > 40) changeImage(diffX > 0 ? 'next' : 'prev'); 
            }
        }
    });

    document.getElementById('btn-hapus').addEventListener('click', async () => {
        if (globalImages.length === 0) return;
        const deletedIndex = currentIndex;
        await deleteImageFromDB(globalImages[deletedIndex].id);
        await loadDashboard(); 
        if (globalImages.length === 0) {
            closeFullscreen();
        } else {
            const nextIndex = deletedIndex >= globalImages.length ? globalImages.length - 1 : deletedIndex;
            openFullscreen(nextIndex);
        }
    });

    fileInput.addEventListener('change', async (e) => {
        if (e.target.files[0]) {
            await saveImageToDB(e.target.files[0]);
            await loadDashboard();
            showToast("Saved to gallery");
        }
        fileInput.value = ''; 
    });

    let currentRefBase64 = null;
    let currentRefMime = null;

    document.getElementById('ref-file-input').addEventListener('change', async (e) => {
        if (e.target.files[0]) {
            await setRefImage(e.target.files[0]);
            document.getElementById('gallery-ref-picker').style.display = 'none';
        }
        e.target.value = '';
    });

    async function setRefImage(fileOrBlob) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                currentRefBase64 = reader.result.split(',')[1];
                currentRefMime = fileOrBlob.type || 'image/jpeg';
                document.getElementById('ref-image-preview').src = URL.createObjectURL(fileOrBlob);
                document.getElementById('ref-image-container').style.display = 'flex';
                resolve();
            };
            reader.readAsDataURL(fileOrBlob);
        });
    }

    function clearRefImage() {
        currentRefBase64 = null;
        currentRefMime = null;
        document.getElementById('ref-image-container').style.display = 'none';
    }

    function showGalleryRefPicker() {
        const picker = document.getElementById('gallery-ref-picker');
        picker.innerHTML = '';
        if (globalImages.length === 0) { showToast("Gallery is empty"); return; }
        globalImages.forEach(imgData => {
            const imgEl = document.createElement('img');
            imgEl.src = URL.createObjectURL(imgData.file);
            imgEl.className = 'w-14 h-14 rounded-lg object-cover flex-shrink-0 cursor-pointer border border-gray-300 active:opacity-70';
            imgEl.onclick = () => {
                setRefImage(imgData.file);
                picker.style.display = 'none';
            };
            picker.appendChild(imgEl);
        });
        if (picker.style.display === 'none' || picker.style.display === '') {
            picker.style.display = 'flex';
        } else {
            picker.style.display = 'none';
        }
    }

    function openAIModal() {
        document.getElementById('ai-prompt').value = '';
        clearRefImage();
        document.getElementById('gallery-ref-picker').style.display = 'none';
        setAILoadingState(false);

        const modal = document.getElementById('ai-modal');
        const box = document.getElementById('ai-modal-box');
        modal.style.display = 'flex';
        setTimeout(() => { modal.style.opacity = '1'; box.classList.remove('scale-95'); }, 10);
    }

    function closeAIModal() {
        setAILoadingState(false);

        const modal = document.getElementById('ai-modal');
        const box = document.getElementById('ai-modal-box');
        modal.style.opacity = '0'; box.classList.add('scale-95');
        setTimeout(() => { modal.style.display = 'none'; }, 300);
    }

    function setAILoadingState(loading) {
        const loadingEl = document.getElementById('ai-loading');
        const actionsEl = document.getElementById('ai-actions');
        if (loading) {
            actionsEl.style.display = 'none';
            loadingEl.style.display = 'flex';
        } else {
            loadingEl.style.display = 'none';
            actionsEl.style.display = 'flex';
        }
    }

    async function generateAIImage() {
        const prompt = document.getElementById('ai-prompt').value.trim();
        if (!prompt) { showToast("Describe the concept"); return; }
        if (!appGlobalSettings.apiKey) { showToast("Please setup API key"); return; }

        setAILoadingState(true);
        try {
            const parts = [{ text: prompt }];
            if (currentRefBase64) parts.push({ inlineData: { mimeType: currentRefMime, data: currentRefBase64 } });
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${appGlobalSettings.modelName}:generateContent?key=${appGlobalSettings.apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseModalities: ["TEXT", "IMAGE"] } })
            });
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData?.error?.message || `HTTP ${response.status}`);
            }
            const result = await response.json();
            const imgBase = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
            if (imgBase) {
                const blob = await (await fetch(`data:image/jpeg;base64,${imgBase}`)).blob();
                await saveImageToDB(blob, true);
                closeAIModal();
                await loadDashboard();
                showToast("Generation complete");
            } else {
                showToast("Generation failed");
            }
        } catch (e) {
            showToast(`Error: ${e.message || 'Unknown error'}`);
        } finally {
            setAILoadingState(false);
        }
    }

    loadDashboard();
</script>
</body>
</html>
