<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      background-color: black;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      overflow: hidden;
    }
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
    }
    video { 
      pointer-events: none; 
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: white;
      border-style: solid;
    }
    .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
    .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }
    .scan-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0) 100%);
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0.9;
      box-shadow: 0 1px 6px rgba(255,255,255,0.4);
      will-change: top;
      animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes scan {
      0% { top: 0; }
      50% { top: calc(100% - 3px); }
      100% { top: 0; }
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .drawer-open {
      transform: translateY(0) !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent; 
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15); 
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-white select-none">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas" class="hidden"></canvas>

  <div id="ui-layer" class="absolute inset-0 z-10 flex flex-col pointer-events-none transition-opacity duration-300">
    <div class="flex-1 bg-black/60"></div>
    <div class="flex w-full h-64 sm:h-80 justify-center shrink-0">
      <div class="flex-1 bg-black/60"></div>
      <div class="w-64 sm:w-80 relative bg-transparent shrink-0">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="scan-line"></div>
      </div>
      <div class="flex-1 bg-black/60"></div>
    </div>
    <div class="flex-1 bg-black/60"></div>
  </div>

  <div id="loading" class="absolute inset-0 z-50 flex items-center justify-center transition-opacity duration-300 pointer-events-none">
    <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-white"></i>
  </div>

  <div id="redirecting" class="absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
    <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-white"></i>
  </div>

  <div id="result-drawer" class="absolute bottom-0 left-0 right-0 z-40 bg-white rounded-t-[28px] p-6 pb-safe pt-5 transform translate-y-full transition-transform duration-500 ease-in-out shadow-[0_-10px_40px_rgba(0,0,0,0.15)] pointer-events-auto flex flex-col">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 shrink-0"></div>
    <div id="result-text" class="text-[15px] text-gray-800 break-words mb-6 font-medium leading-relaxed max-h-32 overflow-y-auto custom-scrollbar"></div>
    <div class="flex gap-3 shrink-0">
      <button id="btn-copy" class="flex-1 bg-[#f2f2f7] hover:bg-[#e5e5ea] active:scale-[0.98] text-black py-3.5 px-4 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all">
        <i data-lucide="copy" class="w-4 h-4"></i>
        <span>Copy</span>
      </button>
      <button id="btn-rescan" class="flex-[0.3] bg-[#f2f2f7] hover:bg-[#e5e5ea] active:scale-[0.98] text-black py-3.5 px-4 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const video = document.getElementById("video");
    const canvasElement = document.getElementById("canvas");
    const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
    const loading = document.getElementById("loading");
    const uiLayer = document.getElementById("ui-layer");
    const resultDrawer = document.getElementById("result-drawer");
    const resultText = document.getElementById("result-text");
    const btnCopy = document.getElementById("btn-copy");
    const btnRescan = document.getElementById("btn-rescan");
    const redirectingLayer = document.getElementById("redirecting");

    let scanning = true;
    let currentResult = "";

    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      } 
    })
      .then(function(stream) {
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(tick);
      })
      .catch(function(err) {
        loading.innerHTML = '<span class="text-sm text-red-400 font-medium">Camera access denied</span>';
      });

    function tick() {
      if (!scanning) return;
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        loading.style.opacity = "0";
        setTimeout(() => loading.style.display = "none", 300);

        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        
        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          handleResult(code.data);
        } else {
          requestAnimationFrame(tick);
        }
      } else {
        requestAnimationFrame(tick);
      }
    }

    function handleResult(data) {
      scanning = false;
      currentResult = data;
      
      if (navigator.vibrate) navigator.vibrate(50);
      
      video.pause();
      
      if (data.startsWith('http://') || data.startsWith('https://')) {
        uiLayer.style.opacity = "0";
        redirectingLayer.style.opacity = "1";
        redirectingLayer.style.pointerEvents = "auto";
        
        setTimeout(() => {
          window.location.href = data;
        }, 800);
      } else {
        uiLayer.style.opacity = "0";
        resultText.innerText = data;
        resultDrawer.classList.add('drawer-open');
      }
    }

    btnCopy.addEventListener('click', () => {
      const el = document.createElement('textarea');
      el.value = currentResult;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      
      const originalText = btnCopy.querySelector('span').innerText;
      btnCopy.querySelector('span').innerText = 'Copied';
      setTimeout(() => {
        btnCopy.querySelector('span').innerText = originalText;
      }, 2000);
    });

    btnRescan.addEventListener('click', () => {
      resultDrawer.classList.remove('drawer-open');
      uiLayer.style.opacity = "1";
      currentResult = "";
      scanning = true;
      video.play();
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
