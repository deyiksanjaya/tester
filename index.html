<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kontrol Gestur</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    position: fixed;
    inset: 0;
  }
  #ui {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    background-color: #000000;
  }
  button {
    padding: 12px 32px;
    background-color: #ffffff;
    color: #000000;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  button:active {
    opacity: 0.8;
  }
  #video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    top: 0;
    left: 0;
  }
  #status {
    position: absolute;
    bottom: 40px;
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    z-index: 5;
    pointer-events: none;
  }
  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
<div id="ui"><button id="btn">Inisialisasi</button></div>
<video id="video" playsinline autoplay muted></video>
<div id="status" class="hidden">Menyiapkan sistem...</div>
<script>
  const video = document.getElementById('video');
  const btn = document.getElementById('btn');
  const ui = document.getElementById('ui');
  const statusEl = document.getElementById('status');
  
  let track = null;
  let isOn = false;
  let isToggling = false;
  let lastToggleTime = 0;
  let hands = null;
  let processingFrame = false;

  btn.addEventListener('click', async () => {
    try {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' } }
        });
      } catch (err) {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      }
      
      video.srcObject = stream;
      await video.play();
      track = stream.getVideoTracks()[0];
      
      ui.classList.add('hidden');
      statusEl.classList.remove('hidden');
      statusEl.textContent = 'Menunggu input gestur...';
      
      startSystem();
    } catch (e) {
      btn.textContent = 'Akses Ditolak';
    }
  });

  function startSystem() {
    hands = new Hands({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });
    hands.onResults(res => {
      if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
        const lm = res.multiHandLandmarks[0];
        const isFist = checkFist(lm);
        const isOpen = checkOpen(lm);
        
        if (isOpen) {
          statusEl.textContent = 'Gestur: Terbuka | Status: Aktif';
          if (!isOn) toggle(true);
        } else if (isFist) {
          statusEl.textContent = 'Gestur: Mengepal | Status: Nonaktif';
          if (isOn) toggle(false);
        } else {
          statusEl.textContent = 'Gestur: Netral | Status: Siaga';
        }
      } else {
        statusEl.textContent = 'Gestur: Tidak Terdeteksi | Status: Siaga';
      }
    });

    requestAnimationFrame(processFrame);
  }

  async function processFrame() {
    if (!video.paused && video.readyState >= 2 && !isToggling && !processingFrame) {
      processingFrame = true;
      try {
        await hands.send({ image: video });
      } catch (e) {}
      processingFrame = false;
    }
    requestAnimationFrame(processFrame);
  }

  function dist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function checkFist(lm) {
    const w = lm[0];
    const t = [8, 12, 16, 20];
    const b = [5, 9, 13, 17];
    let f = 0;
    for (let i = 0; i < 4; i++) {
      if (dist(lm[t[i]], w) < dist(lm[b[i]], w)) f++;
    }
    return f >= 3;
  }

  function checkOpen(lm) {
    const w = lm[0];
    const t = [8, 12, 16, 20];
    const b = [5, 9, 13, 17];
    let e = 0;
    for (let i = 0; i < 4; i++) {
      if (dist(lm[t[i]], w) > dist(lm[b[i]], w) * 1.2) e++;
    }
    return e >= 3;
  }

  async function toggle(turnOn) {
    const now = Date.now();
    if (turnOn === isOn || isToggling || (now - lastToggleTime < 1200)) return;
    
    isToggling = true;
    lastToggleTime = now;

    try {
      if (track) {
        track.stop();
        video.srcObject = null;
      }

      await new Promise(r => setTimeout(r, 150));

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' } }
        });
      } catch (err) {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      }

      track = stream.getVideoTracks()[0];

      if (turnOn) {
        await track.applyConstraints({ advanced: [{ torch: true }] });
      }

      video.srcObject = stream;
      
      await new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play().then(resolve).catch(resolve);
        };
      });

      isOn = turnOn;
    } catch (e) {
    } finally {
      isToggling = false;
    }
  }

  window.addEventListener('beforeunload', () => {
    if (track) track.stop();
  });
  
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && track) {
      track.stop();
    }
  });
</script>
</body>
</html>
