<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Kepalan Tangan</title>
    <!-- Memuat MediaPipe Vision -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1a1a1a; color: white; }
        #video { border-radius: 12px; transform: scaleX(-1); width: 100%; max-width: 600px; }
        #status { margin-top: 20px; font-size: 24px; font-weight: bold; }
        .fist { color: #ff4757; }
        .palm { color: #2ed573; }
    </style>
</head>
<body>

    <h2>Deteksi Kepalan Tangan</h2>
    <video id="video" autoplay playsinline></video>
    <div id="status">Memuat AI...</div>

    <script type="module">
        import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js";

        let gestureRecognizer;
        const video = document.getElementById("video");
        const status = document.getElementById("status");

        async function init() {
            // 1. Setup MediaPipe
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm");
            
            // 2. Load model Gesture Recognizer
            gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });

            // 3. Akses kamera
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
        }

        async function predictWebcam() {
            let lastVideoTime = -1;
            
            async function render() {
                const startTimeMs = performance.now();
                
                if (video.currentTime !== lastVideoTime) {
                    lastVideoTime = video.currentTime;
                    const results = gestureRecognizer.recognizeForVideo(video, startTimeMs);

                    if (results.gestures.length > 0) {
                        const gesture = results.gestures[0][0].categoryName;
                        if (gesture === "Closed_Fist") {
                            status.innerHTML = '<span class="fist">Tangan Mengepal!</span>';
                        } else if (gesture === "Open_Palm") {
                            status.innerHTML = '<span class="palm">Tangan Terbuka</span>';
                        } else {
                            status.innerText = "Terdeteksi: " + gesture;
                        }
                    } else {
                        status.innerText = "Tangan tidak terdeteksi";
                    }
                }
                requestAnimationFrame(render);
            }
            render();
        }

        init();
    </script>
</body>
</html>
