<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Google</title>
  <link rel="shortcut icon" href="https://www.google.com/favicon.ico" type="image/x-icon" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Material Symbols (Ikon Resmi Google) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Memastikan ikon tampil proporsional */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen text-[#202124] overflow-x-hidden">
  
  <!-- Header -->
  <header class="flex justify-between items-center px-4 pt-4 pb-0 text-sm w-full">
    
    <!-- Header Kiri (Labs, All, Images) -->
    <div class="flex items-center">
      <!-- Ikon Labs -->
      <button class="p-1 mr-1 text-[#5f6368] hover:bg-gray-100 rounded-full transition-colors flex items-center">
        <span class="material-symbols-outlined text-[22px]">science</span>
      </button>
      
      <!-- Tabs -->
      <div class="flex space-x-4 mt-[6px]">
        <a href="#" class="text-[#1a73e8] font-semibold text-[13px] border-b-[3px] border-[#1a73e8] pb-2">ALL</a>
        <a href="#" class="text-[#5f6368] font-semibold text-[13px] pb-2">IMAGES</a>
      </div>
    </div>

    <!-- Header Kanan (Notifikasi, Grid, Sign in) -->
    <div class="flex items-center space-x-2">
      <!-- Ikon Lonceng Notifikasi (Tanpa Badge) -->
      <button class="text-[#5f6368] hover:bg-gray-100 p-1.5 rounded-full transition-colors flex items-center">
        <span class="material-symbols-outlined text-[22px]">notifications</span>
      </button>
      
      <!-- Ikon Google Apps / Grid -->
      <button class="text-[#5f6368] hover:bg-gray-100 p-1.5 rounded-full transition-colors flex items-center">
        <span class="material-symbols-outlined text-[22px]">apps</span>
      </button>

      <!-- Tombol Sign In (Tampilan Belum Login) -->
      <a href="#" class="bg-[#1a73e8] hover:bg-[#1b66c9] text-white text-[13px] font-medium px-5 py-2 rounded transition-colors ml-1">
        Sign in
      </a>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="flex-grow flex flex-col items-center mt-[10vh] px-4 w-full">
    
    <!-- Logo Google -->
    <img 
      class="w-[180px] sm:w-[272px] object-contain mb-8" 
      src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" 
      alt="Google" 
    />

    <!-- Kolom Pencarian Modern -->
    <div class="flex items-center w-full max-w-[600px] border border-[#dfe1e5] shadow-sm rounded-full px-4 py-2.5 bg-white">
      
      <!-- Ikon Search Kiri -->
      <span class="mr-3 text-[#9aa0a6] flex items-center">
        <span class="material-symbols-outlined text-[22px]">search</span>
      </span>

      <!-- Input Teks -->
      <input type="text" class="flex-grow focus:outline-none text-base bg-transparent min-w-0" aria-label="Search" />

      <!-- Ikon Kanan -->
      <div class="flex items-center space-x-1 sm:space-x-2 ml-2 text-[#5f6368]">
        
        <!-- Ikon AI / Search Labs (Sparkle) -->
        <span class="cursor-pointer hover:bg-gray-100 p-1.5 rounded-full transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]">auto_awesome</span>
        </span>

        <!-- Ikon Mic -->
        <span class="cursor-pointer hover:bg-gray-100 p-1.5 rounded-full transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]">mic</span>
        </span>

        <!-- Ikon Google Lens -->
        <span class="cursor-pointer hover:bg-gray-100 p-1.5 rounded-full transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]">center_focus_strong</span>
        </span>
      </div>
      
    </div>

    <!-- Bahasa Opsional -->
    <div class="mt-6 text-[13px] text-[#4d5156]">
      Google offered in: <a href="#" class="text-[#1a0dab] hover:underline ml-1">日本語</a>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-[#f2f2f2] text-[#70757a] text-[14px] mt-auto w-full">
    <!-- Footer Atas -->
    <div class="px-5 py-4 border-b border-[#dadce0]">
      Japan
    </div>

    <!-- Footer Bawah -->
    <div class="flex flex-col items-center py-4 space-y-4">
      <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 px-4 w-full max-w-[600px]">
        <a href="#" class="hover:underline">Dark theme: off</a>
        <a href="#" class="hover:underline">Settings</a>
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Terms</a>
      </div>

      <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 px-4 w-full max-w-[600px]">
        <a href="#" class="hover:underline">Advertising</a>
        <a href="#" class="hover:underline">Business</a>
        <a href="#" class="hover:underline">About</a>
      </div>
    </div>
  </footer>
</body>
</html>
