<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas, #analysis-canvas {
            display: none;
        }
        #display-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            z-index: 1;
        }
        #result-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            opacity: 0.8;
            max-height: calc(100% - 160px);
            overflow-y: auto;
            width: 100%;
            text-align: left;
            pointer-events: none;
            display: none;
        }
        #peek-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: calc(90% - 140px);
            object-fit: contain;
            display: none;
            z-index: 2;
            pointer-events: none;
            border-radius: 4px;
        }
        #debug-preview {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 85%;
            max-height: 55%;
            border: 2px solid #333;
            border-radius: 8px;
            display: none;
            z-index: 3;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #stealth-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
            transition: background 0.3s;
        }
        .dot-success {
            background: #22c55e !important;
            opacity: 0.3;
        }
        .dot-error {
            background: #ef4444 !important;
            opacity: 0.4;
        }
        #main-console {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #38bdf8;
            z-index: 4;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }
        .console-line {
            margin-bottom: 4px;
            line-height: 1.4;
            word-break: break-all;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #111;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #222;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #eee;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #fff;
        }
        #slider-value {
            font-size: 14px;
            color: #fff;
            min-width: 30px;
            text-align: right;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #555;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-secondary {
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <canvas id="analysis-canvas"></canvas>
    <img id="peek-img" src="" alt="">
    <img id="debug-preview" src="" alt="">

    <div id="stealth-dot"></div>

    <div id="display-area">
        <div id="result-text"></div>
    </div>

    <div id="main-console"></div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">Konfigurasi</div>
            <div class="input-group">
                <span class="input-label">Kredensial API</span>
                <input type="text" id="api-key-input" placeholder="Google Cloud Vision Key" autocomplete="off">
            </div>
            <div class="input-group">
                <span class="input-label">Modul Kamera</span>
                <select id="camera-select">
                    <option value="environment">Kamera Utama</option>
                    <option value="user">Kamera Depan</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Metode Operasi</span>
                <select id="mode-select">
                    <option value="ocr">Cloud OCR</option>
                    <option value="peek">Peek Picture</option>
                </select>
            </div>
            <div class="input-group">
                <span class="input-label">Sensitivitas Tinta (Kontras)</span>
                <div class="slider-container">
                    <input type="range" id="sensitivity-slider" min="20" max="100" step="5">
                    <span id="slider-value">40</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="close-btn">Tutup</button>
                <button class="btn-primary" id="save-btn">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const analysisCanvas = document.getElementById('analysis-canvas');
        const resultText = document.getElementById('result-text');
        const peekImg = document.getElementById('peek-img');
        const debugPreview = document.getElementById('debug-preview');
        const stealthDot = document.getElementById('stealth-dot');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const cameraSelect = document.getElementById('camera-select');
        const modeSelect = document.getElementById('mode-select');
        const sensitivitySlider = document.getElementById('sensitivity-slider');
        const sliderValue = document.getElementById('slider-value');
        const saveBtn = document.getElementById('save-btn');
        const closeBtn = document.getElementById('close-btn');
        const mainConsole = document.getElementById('main-console');

        let visionApiKey = localStorage.getItem('stealthScannerKey') || '';
        let currentFacingMode = localStorage.getItem('stealthScannerCamera') || 'environment';
        let currentMode = localStorage.getItem('stealthScannerMode') || 'ocr';
        let currentSensitivity = parseInt(localStorage.getItem('stealthScannerSensitivity')) || 40;
        
        let scanIntervalId = null;
        let isProcessing = false;
        let peekImageSrc = '';
        let extractedText = '';
        let lastCaptureHash = '';
        
        let lastTapTime = 0;
        let tapCount = 0;
        let tapTimeout;
        let holdTimeout;
        let isHolding = false;

        let stableFrames = 0;
        let prevBox = null;

        sensitivitySlider.value = currentSensitivity;
        sliderValue.innerText = currentSensitivity;

        document.addEventListener('contextmenu', e => e.preventDefault());

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = '#38bdf8';
            if (type === 'error') color = '#f87171';
            if (type === 'success') color = '#4ade80';
            mainConsole.innerHTML += `<div class="console-line" style="color: ${color};">[${time}] ${msg}</div>`;
            mainConsole.scrollTop = mainConsole.scrollHeight;
        }

        sensitivitySlider.addEventListener('input', (e) => {
            sliderValue.innerText = e.target.value;
        });

        const handlePointerStart = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            
            isHolding = false;
            holdTimeout = setTimeout(() => {
                isHolding = true;
                if (debugPreview.style.display === 'block') {
                    debugPreview.style.visibility = 'hidden';
                }
                if (currentMode === 'peek' && peekImageSrc) {
                    peekImg.src = peekImageSrc;
                    peekImg.style.display = 'block';
                    log('Menampilkan gambar hasil crop.');
                } else if (currentMode === 'ocr' && extractedText) {
                    resultText.innerText = extractedText;
                    resultText.style.display = 'block';
                    log('Menampilkan hasil teks.');
                }
            }, 400);
        };

        const handlePointerEnd = (e) => {
            if (e.target.closest('.modal') || e.target.closest('#main-console')) return;
            clearTimeout(holdTimeout);
            
            if (isHolding) {
                isHolding = false;
                peekImg.style.display = 'none';
                peekImg.src = '';
                resultText.style.display = 'none';
                debugPreview.style.visibility = 'visible';
                log('Tampilan disembunyikan kembali.');
                e.preventDefault();
                e.stopPropagation();
                return;
            }

            if (e.type === 'pointerup') {
                if (e.target.closest('#debug-preview')) {
                    debugPreview.style.display = 'none';
                    log('Pratinjau gambar ditutup.');
                    return;
                }

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < 400 && tapLength > 0) {
                    tapCount++;
                } else {
                    tapCount = 1;
                }
                lastTapTime = currentTime;

                clearTimeout(tapTimeout);
                tapTimeout = setTimeout(() => {
                    if (tapCount === 3) {
                        settingsModal.style.display = 'flex';
                        apiKeyInput.value = visionApiKey;
                        cameraSelect.value = currentFacingMode;
                        modeSelect.value = currentMode;
                        sensitivitySlider.value = currentSensitivity;
                        sliderValue.innerText = currentSensitivity;
                        log('Menu konfigurasi dibuka.');
                    } else if (tapCount === 2) {
                        if (scanIntervalId || video.srcObject) {
                            log('Mematikan kamera...');
                            stopCamera();
                        } else {
                            log('Menghubungkan kamera...');
                            startSystem();
                        }
                    }
                    tapCount = 0;
                }, 400);
            }
        };

        document.body.addEventListener('pointerdown', handlePointerStart);
        document.body.addEventListener('pointerup', handlePointerEnd);
        document.body.addEventListener('pointercancel', handlePointerEnd);
        document.body.addEventListener('pointerleave', handlePointerEnd);

        closeBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            visionApiKey = apiKeyInput.value.trim();
            currentFacingMode = cameraSelect.value;
            currentMode = modeSelect.value;
            currentSensitivity = parseInt(sensitivitySlider.value);

            localStorage.setItem('stealthScannerKey', visionApiKey);
            localStorage.setItem('stealthScannerCamera', currentFacingMode);
            localStorage.setItem('stealthScannerMode', currentMode);
            localStorage.setItem('stealthScannerSensitivity', currentSensitivity);

            settingsModal.style.display = 'none';
            
            resultText.innerText = '';
            extractedText = '';
            peekImageSrc = '';
            peekImg.style.display = 'none';
            peekImg.src = '';
            debugPreview.style.display = 'none';
            debugPreview.src = '';
            stealthDot.className = '';
            lastCaptureHash = '';
            
            isProcessing = false;
            log(`Konfigurasi disimpan. Mode: ${currentMode}, Kamera: ${currentFacingMode}, Sensitivitas: ${currentSensitivity}`);
            stopCamera();
        });

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (scanIntervalId) {
                clearInterval(scanIntervalId);
                scanIntervalId = null;
            }
            stableFrames = 0;
            prevBox = null;
            log('Kamera nonaktif.');
        }

        async function startSystem() {
            if (scanIntervalId) return;
            isProcessing = false;
            stealthDot.className = '';
            stableFrames = 0;
            prevBox = null;
            debugPreview.style.display = 'none';
            debugPreview.src = '';
            
            try {
                log(`Mengaktifkan kamera video (${currentFacingMode})...`);
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                video.srcObject = stream;
                
                scanIntervalId = setInterval(analyzeTextFrame, 250);
                log('Sistem pelacak teks aktif.');
            } catch (err) {
                log('Gagal mengakses kamera: ' + err.message, 'error');
                stealthDot.className = 'dot-error';
            }
        }

        function analyzeTextFrame() {
            if (!video.videoWidth || isProcessing) return;

            const aWidth = 160;
            const aHeight = 120;
            analysisCanvas.width = aWidth;
            analysisCanvas.height = aHeight;

            const ctx = analysisCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, aWidth, aHeight);

            const frameData = ctx.getImageData(0, 0, aWidth, aHeight);
            const data = frameData.data;

            const gray = new Uint8Array(aWidth * aHeight);
            for (let i = 0; i < data.length; i += 4) {
                gray[i / 4] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
            }

            const edges = new Uint8Array(aWidth * aHeight);
            for (let y = 1; y < aHeight - 1; y++) {
                for (let x = 1; x < aWidth - 1; x++) {
                    const idx = y * aWidth + x;
                    const gx = Math.abs(gray[idx + 1] - gray[idx - 1]);
                    const gy = Math.abs(gray[idx + aWidth] - gray[idx - aWidth]);
                    edges[idx] = (gx + gy > currentSensitivity) ? 1 : 0;
                }
            }

            const dilated = new Uint8Array(aWidth * aHeight);
            const dSize = 6;
            for (let y = 1; y < aHeight - 1; y++) {
                let run = 0;
                for (let x = 1; x < aWidth - 1; x++) {
                    if (edges[y * aWidth + x]) run = dSize;
                    if (run > 0) { dilated[y * aWidth + x] = 1; run--; }
                }
                run = 0;
                for (let x = aWidth - 2; x > 0; x--) {
                    if (edges[y * aWidth + x]) run = dSize;
                    if (run > 0) { dilated[y * aWidth + x] = 1; run--; }
                }
            }
            for (let x = 1; x < aWidth - 1; x++) {
                let run = 0;
                for (let y = 1; y < aHeight - 1; y++) {
                    if (edges[y * aWidth + x]) run = 2;
                    if (run > 0) { dilated[y * aWidth + x] = 1; run--; }
                }
                run = 0;
                for (let y = aHeight - 2; y > 0; y--) {
                    if (edges[y * aWidth + x]) run = 2;
                    if (run > 0) { dilated[y * aWidth + x] = 1; run--; }
                }
            }

            const visited = new Uint8Array(aWidth * aHeight);
            let bestBox = null;
            let maxScore = 0;

            for (let y = 2; y < aHeight - 2; y++) {
                for (let x = 2; x < aWidth - 2; x++) {
                    const idx = y * aWidth + x;
                    if (dilated[idx] === 1 && visited[idx] === 0) {
                        const comp = [];
                        const queue = [idx];
                        visited[idx] = 1;
                        let head = 0;
                        
                        let minX = x, maxX = x, minY = y, maxY = y;

                        while (head < queue.length) {
                            const curr = queue[head++];
                            comp.push(curr);
                            
                            const cx = curr % aWidth;
                            const cy = Math.floor(curr / aWidth);
                            
                            if (cx < minX) minX = cx;
                            if (cx > maxX) maxX = cx;
                            if (cy < minY) minY = cy;
                            if (cy > maxY) maxY = cy;

                            const neighbors = [
                                curr - 1, curr + 1, curr - aWidth, curr + aWidth
                            ];
                            for (let n of neighbors) {
                                if (dilated[n] === 1 && visited[n] === 0) {
                                    visited[n] = 1;
                                    queue.push(n);
                                }
                            }
                        }

                        const bw = maxX - minX;
                        const bh = maxY - minY;
                        
                        if (bw > 15 && bh > 6 && bw < aWidth * 0.9 && bh < aHeight * 0.8) {
                            const aspect = bw / bh;
                            if (aspect > 1.2 && aspect < 8.0) {
                                let rawEdges = 0;
                                for (let cy = minY; cy <= maxY; cy++) {
                                    for (let cx = minX; cx <= maxX; cx++) {
                                        if (edges[cy * aWidth + cx] === 1) rawEdges++;
                                    }
                                }
                                const density = rawEdges / (bw * bh);
                                
                                if (density > 0.05 && density < 0.45) {
                                    const score = rawEdges * aspect;
                                    if (score > maxScore) {
                                        maxScore = score;
                                        bestBox = { minX, minY, maxX, maxY, w: bw, h: bh };
                                    }
                                }
                            }
                        }
                    }
                }
            }

            if (bestBox) {
                log(`Teks terdeteksi | Score: ${Math.round(maxScore)}`);
                
                if (prevBox) {
                    const shiftX = Math.abs(bestBox.minX - prevBox.minX) + Math.abs(bestBox.maxX - prevBox.maxX);
                    const shiftY = Math.abs(bestBox.minY - prevBox.minY) + Math.abs(bestBox.maxY - prevBox.maxY);
                    
                    if (shiftX < 15 && shiftY < 15) {
                        stableFrames++;
                        if (stableFrames >= 8) {
                            log('Posisi teks stabil. Mengambil gambar...');
                            executeCaptureText(bestBox);
                        }
                    } else {
                        stableFrames = 0;
                    }
                }
                prevBox = bestBox;
            } else {
                stableFrames = 0;
                prevBox = null;
            }
        }

        async function executeCaptureText(box) {
            isProcessing = true;

            const nativeW = video.videoWidth;
            const nativeH = video.videoHeight;

            canvas.width = nativeW;
            canvas.height = nativeH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, nativeW, nativeH);

            stopCamera();

            const scaleX = nativeW / 160;
            const scaleY = nativeH / 120;

            let cMinX = box.minX * scaleX;
            let cMinY = box.minY * scaleY;
            let cMaxX = box.maxX * scaleX;
            let cMaxY = box.maxY * scaleY;

            const padX = (cMaxX - cMinX) * 0.25;
            const padY = (cMaxY - cMinY) * 0.45;

            cMinX = Math.max(0, cMinX - padX);
            cMinY = Math.max(0, cMinY - padY);
            cMaxX = Math.min(nativeW, cMaxX + padX);
            cMaxY = Math.min(nativeH, cMaxY + padY);

            const cropW = cMaxX - cMinX;
            const cropH = cMaxY - cMinY;

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = 1000;
            cropCanvas.height = Math.round((cropH / cropW) * 1000);

            const cCtx = cropCanvas.getContext('2d');
            cCtx.drawImage(canvas, cMinX, cMinY, cropW, cropH, 0, 0, cropCanvas.width, cropCanvas.height);

            const cropData = cCtx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
            const cd = cropData.data;

            let minL = 255;
            let maxL = 0;
            for (let i = 0; i < cd.length; i += 4) {
                const gray = cd[i]*0.299 + cd[i+1]*0.587 + cd[i+2]*0.114;
                if (gray < minL) minL = gray;
                if (gray > maxL) maxL = gray;
            }

            const range = maxL - minL;
            for (let i = 0; i < cd.length; i += 4) {
                let gray = cd[i]*0.299 + cd[i+1]*0.587 + cd[i+2]*0.114;
                if (range > 10) {
                    gray = ((gray - minL) / range) * 255;
                }
                cd[i] = cd[i+1] = cd[i+2] = Math.round(gray);
            }
            cCtx.putImageData(cropData, 0, 0);

            const currentHash = computeImageHash(cropCanvas);
            if (lastCaptureHash && calculateHammingDistance(lastCaptureHash, currentHash) < 5) {
                log('Gambar identik dengan sebelumnya. Melewati pemanggilan API Google Cloud.', 'success');
                debugPreview.src = cropCanvas.toDataURL('image/jpeg', 0.85);
                debugPreview.style.display = 'block';
                stealthDot.className = 'dot-success';
                isProcessing = false;
                return;
            }

            lastCaptureHash = currentHash;
            const base64Url = cropCanvas.toDataURL('image/jpeg', 0.85);
            debugPreview.src = base64Url;
            debugPreview.style.display = 'block';

            const base64Image = base64Url.split(',')[1];
            await sendToCloudVision(base64Image, cropCanvas);
        }

        function computeImageHash(srcCanvas) {
            const hCanvas = document.createElement('canvas');
            hCanvas.width = 8;
            hCanvas.height = 8;
            const hCtx = hCanvas.getContext('2d');
            hCtx.drawImage(srcCanvas, 0, 0, 8, 8);

            const imgData = hCtx.getImageData(0, 0, 8, 8);
            const d = imgData.data;

            let sum = 0;
            const grays = [];
            for (let i = 0; i < 64; i++) {
                const idx = i * 4;
                const gray = d[idx]*0.299 + d[idx+1]*0.587 + d[idx+2]*0.114;
                grays.push(gray);
                sum += gray;
            }

            const avg = sum / 64;
            let hash = '';
            for (let i = 0; i < 64; i++) {
                hash += grays[i] >= avg ? '1' : '0';
            }
            return hash;
        }

        function calculateHammingDistance(h1, h2) {
            let dist = 0;
            for (let i = 0; i < 64; i++) {
                if (h1[i] !== h2[i]) dist++;
            }
            return dist;
        }

        async function sendToCloudVision(base64String, finalCropCanvas) {
            if (!visionApiKey) {
                log('Kunci API tidak ditemukan.', 'error');
                stealthDot.className = 'dot-error';
                isProcessing = false;
                return;
            }

            log('Menghubungi Cloud Vision API...');
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${visionApiKey}`;
            const payload = {
                requests: [{
                    image: { content: base64String },
                    features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.error) {
                    log(`Google API Error: ${data.error.message} (Status: ${data.error.status})`, 'error');
                    stealthDot.className = 'dot-error';
                    isProcessing = false;
                    return;
                }

                if (data.responses && data.responses[0]) {
                    const responseObj = data.responses[0];
                    if (responseObj.error) {
                        log(`Vision API Error: ${responseObj.error.message}`, 'error');
                        stealthDot.className = 'dot-error';
                        isProcessing = false;
                        return;
                    }

                    if (responseObj.fullTextAnnotation) {
                        const textResult = responseObj.fullTextAnnotation.text;
                        const cleanText = textResult.replace(/[^a-zA-Z0-9 ]/g, '').trim();
                        if (cleanText.length < 2) {
                            log('OCR menghasilkan teks terlalu pendek.', 'error');
                            stealthDot.className = 'dot-error';
                            isProcessing = false;
                            return;
                        }

                        log('Respons Cloud OCR diterima.', 'success');
                        
                        if (currentMode === 'ocr') {
                            extractedText = textResult;
                            stealthDot.className = 'dot-success';
                            log('Teks berhasil disimpan. Siap di-peeking.', 'success');
                        } else if (currentMode === 'peek') {
                            const annotations = responseObj.textAnnotations;
                            if (annotations && annotations.length > 0) {
                                const vertices = annotations[0].boundingPoly.vertices;
                                let minX = finalCropCanvas.width, minY = finalCropCanvas.height, maxX = 0, maxY = 0;
                                
                                vertices.forEach(v => {
                                    const x = v.x || 0;
                                    const y = v.y || 0;
                                    if (x < minX) minX = x;
                                    if (y < minY) minY = y;
                                    if (x > maxX) maxX = x;
                                    if (y > maxY) maxY = y;
                                });

                                const pad = 10;
                                minX = Math.max(0, minX - pad);
                                minY = Math.max(0, minY - pad);
                                maxX = Math.min(finalCropCanvas.width, maxX + pad);
                                maxY = Math.min(finalCropCanvas.height, maxY + pad);

                                const w = maxX - minX;
                                const h = maxY - minY;

                                if (w > 0 && h > 0) {
                                    const cropCanvas = document.createElement('canvas');
                                    cropCanvas.width = w;
                                    cropCanvas.height = h;
                                    const cropCtx = cropCanvas.getContext('2d');
                                    cropCtx.drawImage(finalCropCanvas, minX, minY, w, h, 0, 0, w, h);
                                    peekImageSrc = cropCanvas.toDataURL('image/jpeg', 0.95);
                                    stealthDot.className = 'dot-success';
                                    log('Pemotongan gambar tulisan selesai. Siap di-peeking.', 'success');
                                }
                            }
                        }
                    } else {
                        stealthDot.className = 'dot-error';
                        log('Cloud OCR gagal mengenali teks di kertas.', 'error');
                    }
                } else {
                    stealthDot.className = 'dot-error';
                    log('Respons Cloud OCR kosong.', 'error');
                }
            } catch (err) {
                stealthDot.className = 'dot-error';
                log('Koneksi Cloud OCR gagal: ' + err.message, 'error');
            }
            isProcessing = false;
        }
    </script>
</body>
</html>
