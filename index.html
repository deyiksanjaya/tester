<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bulan & Tarot</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='black'/%3E%3Cpolygon fill='white' points='256,76 317,200 456,220 355,320 379,456 256,390 133,456 157,320 56,220 195,200'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='black'/%3E%3Cpolygon fill='white' points='256,76 317,200 456,220 355,320 379,456 256,390 133,456 157,320 56,220 195,200'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #000;
    overflow: hidden;
    overscroll-behavior-y: none;
  }
  .perspective-1000 { perspective: 1000px; }
  .preserve-3d { transform-style: preserve-3d; }
  .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .rotate-y-180 { transform: rotateY(180deg); }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
  .safe-pt { padding-top: max(env(safe-area-inset-top), 2rem); }
  .safe-pb { padding-bottom: max(env(safe-area-inset-bottom), 2rem); }
  .safe-top { top: max(env(safe-area-inset-top), 2rem); }
  .safe-bottom { bottom: max(env(safe-area-inset-bottom), 2rem); }
</style>
</head>
<body class="text-white font-sans selection:bg-white/20">

<div class="fixed left-1/2 -translate-x-1/2 z-50 flex items-center p-1 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full shadow-2xl safe-top">
  <button id="tab-btn-bulan" onclick="switchTab('bulan')" class="px-6 py-2 rounded-full text-[10px] tracking-[0.2em] uppercase font-bold transition-all duration-300 bg-white text-black">
    Bulan
  </button>
  <button id="tab-btn-tarot" onclick="switchTab('tarot')" class="px-6 py-2 rounded-full text-[10px] tracking-[0.2em] uppercase font-bold transition-all duration-300 text-white/40 hover:text-white">
    Tarot
  </button>
</div>

<div class="relative w-screen h-[100dvh] overflow-hidden m-0 p-0">
  
  <div id="view-bulan" class="absolute inset-0 w-full h-full z-20 transition-opacity duration-500 opacity-100">
    <div id="carousel" class="flex w-full h-full overflow-x-auto snap-x snap-mandatory hide-scrollbar overscroll-x-contain"></div>
    <div id="dots" class="absolute left-1/2 -translate-x-1/2 z-30 flex justify-center items-center gap-3 px-6 py-3 rounded-full bg-white/5 backdrop-blur-md border border-white/5 shadow-2xl pointer-events-none safe-bottom"></div>
  </div>

  <div id="view-tarot" class="absolute inset-0 w-full h-full z-10 opacity-0 pointer-events-none transition-opacity duration-500 flex flex-col items-center justify-center bg-black safe-pt safe-pb">
    
    <div id="cards-container" class="flex gap-8 overflow-x-auto snap-x snap-mandatory hide-scrollbar w-full px-12 items-center justify-start md:justify-center opacity-0 transition-opacity duration-700"></div>

    <button id="btn-draw" onclick="drawTarotCard()" class="mt-10 px-10 py-3.5 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm hover:bg-white/10 hover:border-white/20 transition-all duration-500 text-[10px] tracking-[0.3em] uppercase font-bold shrink-0">
      Tarik Kartu
    </button>

  </div>

</div>

<script>
const majorArcana = [
  { name: "The Fool", keyword: "Bebas, Spontan" },
  { name: "The Magician", keyword: "Fokus, Terampil" },
  { name: "The High Priestess", keyword: "Intuitif, Tenang" },
  { name: "The Empress", keyword: "Subur, Harmonis" },
  { name: "The Emperor", keyword: "Tegas, Terstruktur" },
  { name: "The Hierophant", keyword: "Bijak, Taat" },
  { name: "The Lovers", keyword: "Selaras, Intim" },
  { name: "The Chariot", keyword: "Berani, Ambisius" },
  { name: "Strength", keyword: "Tangguh, Sabar" },
  { name: "The Hermit", keyword: "Tenang, Introspektif" },
  { name: "Wheel of Fortune", keyword: "Dinamis, Adaptif" },
  { name: "Justice", keyword: "Adil, Objektif" },
  { name: "The Hanged Man", keyword: "Pasrah, Mengamati" },
  { name: "Death", keyword: "Transisi, Tegas" },
  { name: "Temperance", keyword: "Seimbang, Sabar" },
  { name: "The Devil", keyword: "Terikat, Menggoda" },
  { name: "The Tower", keyword: "Mengejutkan, Rombak" },
  { name: "The Star", keyword: "Optimis, Tenang" },
  { name: "The Moon", keyword: "Misterius, Intuitif" },
  { name: "The Sun", keyword: "Ceria, Sukses" },
  { name: "Judgement", keyword: "Bangkit, Sadar" },
  { name: "The World", keyword: "Utuh, Selesai" }
];

const minorArcana = {
  "ace": ["Ace of Wands", "Ace of Cups", "Ace of Swords", "Ace of Pentacles"],
  "2": ["Two of Wands", "Two of Cups", "Two of Swords", "Two of Pentacles"],
  "3": ["Three of Wands", "Three of Cups", "Three of Swords", "Three of Pentacles"],
  "4": ["Four of Wands", "Four of Cups", "Four of Swords", "Four of Pentacles"],
  "5": ["Five of Wands", "Five of Cups", "Five of Swords", "Five of Pentacles"],
  "6": ["Six of Wands", "Six of Cups", "Six of Swords", "Six of Pentacles"],
  "7": ["Seven of Wands", "Seven of Cups", "Seven of Swords", "Seven of Pentacles"],
  "8": ["Eight of Wands", "Eight of Cups", "Eight of Swords", "Eight of Pentacles"],
  "9": ["Nine of Wands", "Nine of Cups", "Nine of Swords", "Nine of Pentacles"],
  "10": ["Ten of Wands", "Ten of Cups", "Ten of Swords", "Ten of Pentacles"],
  "knight": ["Knight of Wands", "Knight of Cups", "Knight of Swords", "Knight of Pentacles"],
  "queen": ["Queen of Wands", "Queen of Cups", "Queen of Swords", "Queen of Pentacles"]
};

const monthData = [
  { id: 'januari', name: 'Januari', icon: 'snowflake', traits: 'Mandiri, Pemikir', tarotRank: 'ace', tarotCharacter: 'Cermat, Antusias', color: 'from-blue-900/20 to-black', prediction: 'Kamu sering menjadi tempat bersandar bagi orang lain, padahal kamu sendiri kadang butuh didengarkan. Ada banyak ide di kepalamu yang belum sempat direalisasikan karena kamu terlalu sibuk membantu orang di sekitarmu.' },
  { id: 'februari', name: 'Februari', icon: 'cloud-rain', traits: 'Intuitif, Kreatif', tarotRank: '2', tarotCharacter: 'Antusias, Positif', color: 'from-indigo-900/20 to-black', prediction: 'Banyak yang mengira kamu sosok yang santai, tapi sebenarnya kamu sangat memikirkan detail kecil dari setiap perkataan orang. Kamu punya kemampuan alami untuk membaca situasi yang sering kali tidak disadari orang lain.' },
  { id: 'maret', name: 'Maret', icon: 'seedling', traits: 'Empatis, Observan', tarotRank: '3', tarotCharacter: 'Positif, Ambisius', color: 'from-teal-900/20 to-black', prediction: 'Kamu punya dinding pertahanan tersendiri untuk melindungi perasaanmu. Orang melihatmu ramah, tapi hanya sedikit yang benar benar tahu apa yang kamu rasakan di balik senyumanmu sehari hari.' },
  { id: 'april', name: 'April', icon: 'flower', traits: 'Berani, Dinamis', tarotRank: '4', tarotCharacter: 'Ambisius, Tangguh', color: 'from-rose-900/20 to-black', prediction: 'Kamu tidak suka terjebak dalam rutinitas yang membosankan. Meski dari luar terlihat selalu penuh energi, ada kalanya kamu merasa kelelahan dan hanya ingin diam di tempat yang tenang tanpa gangguan siapa pun.' },
  { id: 'mei', name: 'Mei', icon: 'sun-low', traits: 'Stabil, Fokus', tarotRank: '5', tarotCharacter: 'Tangguh, Gesit', color: 'from-emerald-900/20 to-black', prediction: 'Kamu sangat menghargai keamanan dan kenyamanan dalam hidup. Terkadang kamu ragu melangkah keluar dari zona nyaman karena takut mengecewakan diri sendiri, padahal potensimu jauh lebih besar dari yang kamu bayangkan.' },
  { id: 'juni', name: 'Juni', icon: 'sun', traits: 'Adaptif, Ekspresif', tarotRank: '6', tarotCharacter: 'Gesit, Caring', color: 'from-sky-900/20 to-black', prediction: 'Kamu pintar menyembunyikan kesedihan di balik candaan. Orang suka berada di dekatmu karena energimu, tapi kamu sering merasa kesepian justru saat sedang berada di tengah keramaian.' },
  { id: 'juli', name: 'Juli', icon: 'wave-sine', traits: 'Peduli, Sensitif', tarotRank: '7', tarotCharacter: 'Caring, Loyal', color: 'from-cyan-900/20 to-black', prediction: 'Kamu sering menempatkan kebahagiaan orang lain di atas kebahagiaanmu sendiri. Kamu mungkin terlihat tegar, tapi kata kata kasar dari orang terdekat bisa sangat membekas di pikiranmu.' },
  { id: 'agustus', name: 'Agustus', icon: 'flame', traits: 'Percaya Diri, Pemimpin', tarotRank: '8', tarotCharacter: 'Loyal, Visioner', color: 'from-orange-900/20 to-black', prediction: 'Kamu punya standar yang sangat tinggi untuk dirimu sendiri. Walau sering terlihat kuat dan tahu arah, di dalam hati kamu kadang khawatir apakah kamu sudah mengambil keputusan yang tepat untuk masa depanmu.' },
  { id: 'september', name: 'September', icon: 'leaf', traits: 'Analitis, Teliti', tarotRank: '9', tarotCharacter: 'Visioner, Lincah', color: 'from-amber-900/20 to-black', prediction: 'Kamu adalah pengamat yang ulung dan menyukai segala sesuatu yang teratur. Terkadang kamu terlalu keras mengkritik dirimu sendiri atas kesalahan kecil yang bahkan tidak disadari oleh orang lain.' },
  { id: 'oktober', name: 'Oktober', icon: 'wind', traits: 'Harmonis, Diplomatis', tarotRank: '10', tarotCharacter: 'Lincah, Serius', color: 'from-pink-900/20 to-black', prediction: 'Kamu selalu menghindari konflik sebisa mungkin demi kedamaian. Dalam usahamu untuk membuat semua orang senang, kamu sering lupa menanyakan pada dirimu sendiri apa yang sebenarnya membuatmu bahagia.' },
  { id: 'november', name: 'November', icon: 'moon', traits: 'Misterius, Mendalam', tarotRank: 'knight', tarotCharacter: 'Serius, Saksama', color: 'from-purple-900/20 to-black', prediction: 'Kamu tidak mudah percaya pada orang yang baru dikenal. Intuisimu sangat tajam dalam menilai karakter seseorang, tapi kamu memilih untuk diam dan mengamati dari jauh sebelum benar benar membuka diri.' },
  { id: 'desember', name: 'Desember', icon: 'stars', traits: 'Optimis, Petualang', tarotRank: 'queen', tarotCharacter: 'Saksama, Cermat', color: 'from-zinc-900/20 to-black', prediction: 'Kamu selalu mencari makna lebih dalam dari setiap kejadian di hidupmu. Walau sering terlihat santai, pikiranmu tidak pernah berhenti memikirkan rencana rencana besar yang ingin kamu capai suatu hari nanti.' }
];

const carousel = document.getElementById('carousel');
const dotsContainer = document.getElementById('dots');
let activeIndex = 0;

function initApp() {
  carousel.innerHTML = monthData.map(month => {
    let fullText = month.prediction;
    const limit = 70;
    let shortText = fullText;
    let remainText = "";
    
    if (fullText.length > limit) {
      let cutIndex = fullText.lastIndexOf(' ', limit);
      if (cutIndex === -1) cutIndex = limit;
      shortText = fullText.substring(0, cutIndex);
      remainText = fullText.substring(cutIndex);
    }

    return `
    <div id="slide-${month.id}" class="flex-none w-full h-full snap-center relative bg-gradient-to-b ${month.color} overflow-y-auto hide-scrollbar">
      <div class="absolute inset-0 bg-black/40 fixed pointer-events-none"></div>
      <div class="relative w-full min-h-full flex flex-col justify-center items-center px-10 max-w-4xl mx-auto safe-pt safe-pb">
        
        <div class="flex flex-col items-center justify-center w-full max-w-md mx-auto text-center">
          <img src="https://api.iconify.design/tabler/${month.icon}.svg?color=white" alt="${month.name}" class="w-20 h-20 md:w-28 md:h-28 opacity-90 drop-shadow-xl mb-10" loading="lazy">
          <h1 class="text-5xl md:text-7xl font-extralight tracking-tight mb-4 uppercase">${month.name}</h1>
        </div>
        
        <div class="w-16 h-px bg-white/10 mb-12 mx-auto mt-6"></div>
        
        <div class="relative w-full max-w-2xl text-center mx-auto text-lg md:text-2xl leading-relaxed font-light text-white/80">
          <p class="inline">
            <span>${shortText}</span><span id="dots-${month.id}" class="${remainText ? 'inline' : 'hidden'}">...</span><span id="remain-${month.id}" class="hidden">${remainText}</span>
            ${remainText ? `<button id="btn-${month.id}" onclick="toggleCard('${month.id}')" class="inline text-white/40 hover:text-white transition-colors cursor-pointer bg-transparent border-none p-0 ml-1 font-medium underline underline-offset-4 decoration-white/20 decoration-dotted">Selengkapnya</button>` : ''}
          </p>
        </div>
        
      </div>
    </div>
  `}).join('');

  dotsContainer.innerHTML = monthData.map((_, index) => `
    <div class="dot h-1.5 rounded-full transition-all duration-300 ${index === 0 ? 'w-8 bg-white' : 'w-1.5 bg-white/30'}"></div>
  `).join('');

  carousel.addEventListener('scroll', handleScroll);
}

function toggleCard(id) {
  const dots = document.getElementById(`dots-${id}`);
  const remain = document.getElementById(`remain-${id}`);
  const btn = document.getElementById(`btn-${id}`);
  
  if (remain.classList.contains('hidden')) {
    remain.classList.replace('hidden', 'inline');
    dots.classList.replace('inline', 'hidden');
    btn.innerText = 'Tutup';
  } else {
    remain.classList.replace('inline', 'hidden');
    dots.classList.replace('hidden', 'inline');
    btn.innerText = 'Selengkapnya';
  }
}

function handleScroll() {
  const scrollPosition = carousel.scrollLeft;
  const itemWidth = carousel.clientWidth;
  if (itemWidth === 0) return;
  const newIndex = Math.round(scrollPosition / itemWidth);
  const dots = document.querySelectorAll('.dot');
  
  if (newIndex !== activeIndex) {
    activeIndex = newIndex;
    dots.forEach((dot, index) => {
      dot.className = `dot h-1.5 rounded-full transition-all duration-300 ${index === activeIndex ? 'w-8 bg-white' : 'w-1.5 bg-white/30'}`;
    });
  }
}

function switchTab(tab) {
  const bulanView = document.getElementById('view-bulan');
  const tarotView = document.getElementById('view-tarot');
  const btnBulan = document.getElementById('tab-btn-bulan');
  const btnTarot = document.getElementById('tab-btn-tarot');
  const btnDraw = document.getElementById('btn-draw');
  const container = document.getElementById('cards-container');

  if (tab === 'bulan') {
    bulanView.classList.replace('opacity-0', 'opacity-100');
    bulanView.style.zIndex = '20';
    bulanView.classList.remove('pointer-events-none');
    tarotView.classList.replace('opacity-100', 'opacity-0');
    tarotView.style.zIndex = '10';
    tarotView.classList.add('pointer-events-none');
    btnBulan.className = 'px-6 py-2 rounded-full text-[10px] tracking-[0.2em] uppercase font-bold transition-all duration-300 bg-white text-black';
    btnTarot.className = 'px-6 py-2 rounded-full text-[10px] tracking-[0.2em] uppercase font-bold transition-all duration-300 text-white/40 hover:text-white';
    
    container.innerHTML = '';
    container.style.opacity = '0';
    btnDraw.classList.remove('hidden');
    btnDraw.innerText = 'Tarik Kartu';
    btnDraw.disabled = false;
  } else {
    bulanView.classList.replace('opacity-100', 'opacity-0');
    bulanView.style.zIndex = '10';
    bulanView.classList.add('pointer-events-none');
    tarotView.classList.replace('opacity-0', 'opacity-100');
    tarotView.style.zIndex = '20';
    tarotView.classList.remove('pointer-events-none');
    btnTarot.className = 'px-6 py-2 rounded-full text-[10px] tracking-[0.2em] uppercase font-bold transition-all duration-300 bg-white text-black';
    btnBulan.className = 'px-6 py-2 rounded-full text-[10px] tracking-[0.2em] uppercase font-bold transition-all duration-300 text-white/40 hover:text-white';
  }
}

function drawTarotCard() {
  const btn = document.getElementById('btn-draw');
  const container = document.getElementById('cards-container');
  btn.disabled = true;
  btn.innerText = 'Mengocok...';
  
  setTimeout(() => performDraw(btn, container), 600);
}

function performDraw(btn, container) {
  const monthInfo = monthData[activeIndex];
  
  const minorPool = minorArcana[monthInfo.tarotRank];
  const minorName = minorPool[Math.floor(Math.random() * minorPool.length)];
  const minorCard = { name: minorName, type: "Arcana Minor", keyword: monthInfo.tarotCharacter };

  const shuffledMajors = [...majorArcana].sort(() => 0.5 - Math.random());
  const major1 = { name: shuffledMajors[0].name, type: "Arcana Mayor", keyword: shuffledMajors[0].keyword };
  const major2 = { name: shuffledMajors[1].name, type: "Arcana Mayor", keyword: shuffledMajors[1].keyword };

  const drawnCards = [major1, minorCard, major2].sort(() => 0.5 - Math.random());

  container.innerHTML = drawnCards.map((card, i) => `
    <div class="flip-card flex-none w-64 h-[26rem] md:w-72 md:h-[30rem] snap-center shrink-0 perspective-1000">
      <div class="flip-card-inner relative w-full h-full transition-transform duration-700 preserve-3d" style="transition-delay: ${i * 200}ms">
        <div class="flip-face absolute inset-0 rounded-3xl border border-white/40 bg-[#0a0a0f] flex items-center justify-center shadow-2xl backface-hidden">
          <div class="w-[85%] h-[90%] border border-white/20 rounded-2xl flex items-center justify-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white/5 to-transparent">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="opacity-30"><path d="M12 2l3 6 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1 3-6z"></path></svg>
          </div>
        </div>
        <div class="flip-face absolute inset-0 rounded-3xl border border-white/50 bg-gradient-to-br from-zinc-900 to-black overflow-hidden shadow-2xl flex flex-col items-center justify-center p-8 text-center text-white backface-hidden rotate-y-180">
          <h3 class="text-3xl md:text-4xl font-extralight tracking-tight mb-4">${card.name}</h3>
          <span class="text-[9px] tracking-[0.4em] uppercase opacity-50 mb-10 font-bold">${card.type}</span>
          <div class="w-10 h-px bg-white/40 mb-10"></div>
          <p class="text-sm tracking-[0.2em] uppercase font-light text-white/90">${card.keyword}</p>
        </div>
      </div>
    </div>
  `).join('');

  void container.offsetWidth;
  container.style.opacity = '1';

  setTimeout(() => {
    const cards = container.querySelectorAll('.flip-card');
    cards.forEach(c => c.classList.add('flipped'));
    container.scrollTo({ left: 0, behavior: 'smooth' });
    btn.classList.add('hidden');
  }, 100);
}

initApp();
</script>
</body>
</html>
