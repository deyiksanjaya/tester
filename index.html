<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentalist Tool - Progressive Anagram</title>
    
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Inter dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        
        /* Animasi loading sederhana */
        .loader {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Kustomisasi scrollbar untuk hasil */
        #results-container::-webkit-scrollbar {
            width: 8px;
        }
        #results-container::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        #results-container::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        #results-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-purple-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-hat-wizard text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-800">Progressive Anagram</h1>
            </div>
            <div id="status-badge" class="hidden items-center space-x-2 px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-medium border border-green-200">
                <i class="fa-solid fa-check-circle"></i>
                <span id="word-count-badge">Database Aktif</span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 max-w-4xl mx-auto w-full">
        
        <div id="loading-screen" class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-lg text-center flex flex-col items-center justify-center transition-all duration-300 min-h-[300px]">
            <div id="spinner" class="loader mb-6 w-12 h-12 border-4 mx-auto"></div>
            <h2 class="text-2xl font-bold mb-2 text-slate-800">Memuat Database...</h2>
            <p id="loading-text" class="text-slate-500 mb-2">Mengambil data dari <code class="bg-slate-100 px-2 py-1 rounded text-blue-600">indonesian-wordlist.lst</code></p>
            <div id="loading-error" class="hidden mt-6 p-4 bg-red-50 text-red-600 rounded-xl border border-red-200 text-sm text-left w-full"></div>
        </div>

        <!-- Setup Screen (Baru) -->
        <div id="setup-section" class="w-full hidden flex-col transition-all duration-300 max-w-lg mx-auto">
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center">
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Persiapan</h2>
                <p class="text-slate-500 mb-8">Tanyakan jumlah huruf untuk mempercepat eliminasi (Opsional)</p>
                
                <div class="mb-8">
                    <label class="block text-sm font-semibold text-slate-700 mb-3">Jumlah Huruf (Panjang Kata)</label>
                    <input type="number" id="setup-length" min="1" max="50"
                        class="block w-full text-center px-4 py-4 border-2 border-slate-300 rounded-2xl bg-slate-50 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 text-4xl font-black transition-all" 
                        placeholder="Abaikan jika ragu">
                </div>
                
                <button id="start-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-xl font-bold shadow-lg shadow-blue-600/30 transition-all transform hover:scale-[1.02] active:scale-95">
                    Mulai Beraksi <i class="fa-solid fa-wand-magic-sparkles ml-2"></i>
                </button>
            </div>
        </div>

        <!-- Game Screen (Pertanyaan) -->
        <div id="game-section" class="w-full hidden flex-col transition-all duration-300 max-w-lg mx-auto">
            <div class="flex justify-between items-center mb-4 px-2">
                <button id="undo-btn" class="text-slate-500 hover:text-slate-700 font-medium px-4 py-2 bg-white rounded-xl shadow-sm border border-slate-200 transition-colors disabled:opacity-50">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Undo
                </button>
                <div class="text-sm font-semibold text-slate-500 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200" title="Informasi rahasia untuk mentalist">
                    Sisa: <span id="game-remaining-count" class="text-blue-600 font-bold">0</span>
                </div>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center mb-6">
                <h3 class="text-lg font-medium text-slate-500 mb-2 uppercase tracking-widest">Tanyakan Huruf:</h3>
                <div id="current-letter" class="text-[9rem] leading-none font-black text-slate-800 mb-2 drop-shadow-sm">?</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="btn-no" class="py-8 bg-red-100 hover:bg-red-200 text-red-700 rounded-3xl text-2xl font-black shadow-sm border-2 border-red-200 transition-all transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-xmark mb-2 block text-4xl"></i>
                    TIDAK
                </button>
                <button id="btn-yes" class="py-8 bg-green-100 hover:bg-green-200 text-green-700 rounded-3xl text-2xl font-black shadow-sm border-2 border-green-200 transition-all transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-check mb-2 block text-4xl"></i>
                    YA
                </button>
            </div>
        </div>

        <!-- Reveal Screen -->
        <div id="reveal-section" class="w-full hidden flex-col transition-all duration-300 max-w-2xl mx-auto">
            <div class="bg-white p-10 rounded-3xl shadow-2xl border-2 border-green-400 text-center relative overflow-hidden">
                <div class="absolute -top-10 -right-10 text-green-100 opacity-50">
                    <i class="fa-solid fa-star text-[15rem]"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-500 mb-4 relative z-10 uppercase tracking-widest">Target Ditemukan</h3>
                <div id="final-word" class="text-5xl md:text-7xl font-black text-slate-800 mb-8 uppercase tracking-widest break-all relative z-10">
                    KATA
                </div>
                <div id="anagram-warning" class="hidden text-sm text-amber-600 bg-amber-50 p-4 rounded-xl mb-6 relative z-10 text-left border border-amber-200">
                    <!-- Dinamis via JS -->
                </div>
                <button id="reset-btn" class="relative z-10 px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-lg font-bold transition-colors border border-slate-300">
                    Mulai Ulang Trik
                </button>
            </div>
        </div>

    </main>

    <script>
        // State aplikasi
        let wordDatabase = []; // Menyimpan semua kata
        let maxDisplayLimit = 500; // Mencegah browser freeze karena merender terlalu banyak DOM
        
        // Referensi Elemen DOM
        const loadingScreen = document.getElementById('loading-screen');
        const spinner = document.getElementById('spinner');
        const loadingText = document.getElementById('loading-text');
        const loadingError = document.getElementById('loading-error');
        
        const statusBadge = document.getElementById('status-badge');
        const wordCountBadge = document.getElementById('word-count-badge');
        
        // --- Referensi Elemen DOM Baru ---
        const setupSection = document.getElementById('setup-section');
        const gameSection = document.getElementById('game-section');
        const revealSection = document.getElementById('reveal-section');
        
        const setupLengthInput = document.getElementById('setup-length');
        const startBtn = document.getElementById('start-btn');
        
        const undoBtn = document.getElementById('undo-btn');
        const gameRemainingCount = document.getElementById('game-remaining-count');
        const currentLetterDisplay = document.getElementById('current-letter');
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        
        const finalWordDisplay = document.getElementById('final-word');
        const anagramWarning = document.getElementById('anagram-warning');
        const resetBtn = document.getElementById('reset-btn');

        // --- State Permainan Mentalist ---
        let possibleWords = [];
        let askedLetters = {}; // Menyimpan riwayat huruf yg ditanya (contoh: { 'a': true, 'b': false })
        let currentTargetLetter = '';
        let historyStack = []; // Menyimpan state untuk fitur Undo

        // Fungsi untuk mengambil file database secara otomatis
        async function fetchDatabase() {
            try {
                // Fetch file langsung dari folder yang sama (Relative Path)
                const response = await fetch('./indonesian-wordlist.lst');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - File tidak ditemukan.`);
                }
                
                loadingText.textContent = "Memproses kata-kata...";
                const text = await response.text();
                
                // Memisahkan teks berdasarkan baris baru (mendukung format Unix \n dan Windows \r\n)
                wordDatabase = text.split(/\r?\n/)
                                   .map(word => word.trim())
                                   .filter(word => word.length > 0); 
                
                if (wordDatabase.length > 0) {
                    showSetupUI(wordDatabase.length);
                } else {
                    throw new Error("File berhasil dimuat, tetapi kosong atau tidak berisi teks yang valid.");
                }
                
            } catch (error) {
                console.error("Gagal memuat database:", error);
                
                // Tampilkan pesan error jika file gagal dimuat
                spinner.classList.add('hidden');
                loadingText.classList.add('hidden');
                loadingError.classList.remove('hidden');
                loadingError.innerHTML = `
                    <div class="flex items-center space-x-2 mb-2">
                        <i class="fa-solid fa-triangle-exclamation text-xl text-red-500"></i>
                        <strong class="text-base">Gagal memuat database!</strong>
                    </div>
                    <p class="mb-2">Pastikan file <code>indonesian-wordlist.lst</code> berada di folder yang sama dengan file HTML ini pada repositori GitHub.</p>
                    <p class="text-xs text-red-400 font-mono bg-red-100/50 p-2 rounded">Pesan error log: ${error.message}</p>
                    <div class="mt-3 text-xs text-slate-600 bg-white/50 p-2 rounded">
                        <i class="fa-solid fa-circle-info text-blue-500 mr-1"></i>
                        <b>Catatan Developer:</b> Jika Anda menguji file HTML ini langsung di komputer secara lokal (alamat url berawalan <code>file:///</code>), browser mungkin memblokir proses memuat file (CORS Policy). Silakan unggah ke GitHub Pages atau gunakan ekstensi Live Server untuk mengujinya.
                    </div>
                `;
            }
        }

        // Menampilkan antarmuka Persiapan (Setup) setelah file sukses diload
        function showSetupUI(count) {
            loadingScreen.classList.add('hidden');
            setupSection.classList.remove('hidden');
            setupSection.classList.add('flex');
            
            statusBadge.classList.remove('hidden');
            statusBadge.classList.add('flex');
            
            const formattedCount = new Intl.NumberFormat('id-ID').format(count);
            wordCountBadge.textContent = `${formattedCount} Kata`;
            
            setupLengthInput.focus();
        }

        // --- Core Logic Permainan ---
        
        function startGame() {
            const targetLength = parseInt(setupLengthInput.value);
            
            // 1. Filter awal berdasarkan jumlah huruf (jika diisi)
            if (!isNaN(targetLength) && targetLength > 0) {
                possibleWords = wordDatabase.filter(w => w.length === targetLength);
            } else {
                possibleWords = [...wordDatabase];
            }

            if (possibleWords.length === 0) {
                alert("Tidak ada kata dengan panjang tersebut di database!");
                return;
            }

            // Inisialisasi ulang
            askedLetters = {};
            historyStack = [];
            
            // Pindah layar ke game
            setupSection.classList.add('hidden');
            setupSection.classList.remove('flex');
            revealSection.classList.add('hidden');
            revealSection.classList.remove('flex');
            gameSection.classList.remove('hidden');
            gameSection.classList.add('flex');
            
            updateGameState();
        }

        function calculateNextBestLetter() {
            // ALGORITMA UTAMA: Mencari huruf pembagi terbaik (Binary Search optimal)
            const letterCounts = {};
            
            // Hitung frekuensi huruf pada kata-kata yang tersisa
            for (let word of possibleWords) {
                // Gunakan Set untuk menghindari hitung ganda jika ada huruf kembar dalam 1 kata (misal: S di MANGGIS)
                const uniqueChars = new Set(word.toLowerCase()); 
                for (let char of uniqueChars) {
                    if (char >= 'a' && char <= 'z' && askedLetters[char] === undefined) {
                        letterCounts[char] = (letterCounts[char] || 0) + 1;
                    }
                }
            }

            let bestLetter = null;
            let bestDiff = Infinity;
            const target = possibleWords.length / 2; // Target 50% pembagian

            // Cari huruf yang memotong sisa probabilitas sedekat mungkin ke 50:50
            for (let char in letterCounts) {
                const count = letterCounts[char];
                // Jangan tanyakan huruf yang ada di 100% sisa kata, karena menjawab "Ya" tidak mengeleminasi apapun!
                if (count > 0 && count < possibleWords.length) {
                    const diff = Math.abs(count - target);
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        bestLetter = char;
                    }
                }
            }

            return bestLetter; // Mengembalikan Null jika semua sisa huruf identik (anagram)
        }

        function updateGameState() {
            // Update indikator rahasia
            gameRemainingCount.textContent = new Intl.NumberFormat('id-ID').format(possibleWords.length);
            undoBtn.disabled = historyStack.length === 0;

            if (possibleWords.length === 0) {
                // Berarti penonton salah jawab atau kata tak ada di database
                showReveal("TIDAK DITEMUKAN", false, true);
                return;
            }

            currentTargetLetter = calculateNextBestLetter();

            if (currentTargetLetter === null) {
                // Tidak ada lagi huruf pembeda. (Sisa 1 kata, ATAU sisa beberapa kata yang merupakan Anagram / sama persis komposisi hurufnya)
                const isAnagrams = possibleWords.length > 1;
                showReveal(possibleWords.join(' / '), isAnagrams, false);
            } else {
                currentLetterDisplay.textContent = currentTargetLetter.toUpperCase();
            }
        }

        function handleAnswer(isYes) {
            // Simpan riwayat untuk fungsi UNDO
            historyStack.push({
                words: [...possibleWords],
                asked: { ...askedLetters }
            });

            askedLetters[currentTargetLetter] = isYes;

            // Proses Eliminasi
            possibleWords = possibleWords.filter(word => {
                const lowerWord = word.toLowerCase();
                const hasLetter = lowerWord.includes(currentTargetLetter);
                return isYes ? hasLetter : !hasLetter;
            });

            updateGameState();
        }

        function undo() {
            if (historyStack.length > 0) {
                const previousState = historyStack.pop();
                possibleWords = previousState.words;
                askedLetters = previousState.asked;
                updateGameState();
            }
        }

        function showReveal(wordText, isAnagrams, isError) {
            gameSection.classList.add('hidden');
            gameSection.classList.remove('flex');
            revealSection.classList.remove('hidden');
            revealSection.classList.add('flex');

            finalWordDisplay.textContent = wordText;
            
            if (isError) {
                finalWordDisplay.classList.add('text-red-500');
                finalWordDisplay.classList.remove('text-slate-800');
                anagramWarning.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1 text-red-500"></i> <b>Gagal!</b> Penonton berbohong, salah ingat huruf, atau kata tersebut memang tidak ada di database.';
                anagramWarning.classList.remove('hidden', 'text-amber-700', 'bg-amber-50', 'border-amber-200');
                anagramWarning.classList.add('text-red-700', 'bg-red-50', 'border-red-200');
            } else {
                finalWordDisplay.classList.remove('text-red-500');
                finalWordDisplay.classList.add('text-slate-800');
                
                if (isAnagrams) {
                    anagramWarning.innerHTML = '<i class="fa-solid fa-circle-info mr-1 text-amber-500"></i> <b>Catatan Anagram:</b> Terdapat beberapa kata tersisa dengan komposisi huruf yang sama persis (hanya beda urutan). Anda harus melakukan trik <i>fishing</i> (pancingan) mandiri untuk menentukan kata pastinya.';
                    anagramWarning.classList.remove('hidden', 'text-red-700', 'bg-red-50', 'border-red-200');
                    anagramWarning.classList.add('text-amber-700', 'bg-amber-50', 'border-amber-200');
                } else {
                    anagramWarning.classList.add('hidden');
                }
            }
        }

        // --- Hubungan Event Listeners ---
        startBtn.addEventListener('click', startGame);
        setupLengthInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startGame();
        });
        
        btnYes.addEventListener('click', () => handleAnswer(true));
        btnNo.addEventListener('click', () => handleAnswer(false));
        undoBtn.addEventListener('click', undo);
        
        resetBtn.addEventListener('click', () => {
            setupSection.classList.remove('hidden');
            setupSection.classList.add('flex');
            revealSection.classList.add('hidden');
            revealSection.classList.remove('flex');
            setupLengthInput.value = '';
            setupLengthInput.focus();
        });

        // Eksekusi otomatis pertama kali
        document.addEventListener('DOMContentLoaded', fetchDatabase);

    </script>
</body>
</html>
